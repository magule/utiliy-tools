<!DOCTYPE html>
<html>
<head>
    <title>Alarm Clock</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Alarm Clock</h1>

    <div class="current-time">
        <div class="time" id="currentTime">00:00:00</div>
        <div class="date" id="currentDate">Loading...</div>
    </div>

    <button id="addAlarm" class="add-btn">+ Add Alarm</button>

    <div id="alarmContainer"></div>

<script>
    let alarmCount = 0;
    const alarms = new Map();
    let audioContext = null;

    function updateCurrentTime() {
        const now = new Date();
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };

        document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-US', timeOptions);
        document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', dateOptions);

        // Check alarms
        const currentTimeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        alarms.forEach((alarm, id) => {
            if (alarm.enabled && alarm.time === currentTimeStr && now.getSeconds() === 0) {
                triggerAlarm(id);
            }
        });
    }

    function triggerAlarm(id) {
        const alarm = alarms.get(id);
        if (!alarm) return;

        const container = document.getElementById(`alarm-${id}`);
        container.classList.add('ringing');

        playAlarmSound(id);
    }

    function playAlarmSound(id) {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        const alarm = alarms.get(id);
        if (!alarm) return;

        function beep() {
            if (!alarms.get(id)?.ringing) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.value = 0.3;

            oscillator.start();
            setTimeout(() => oscillator.stop(), 150);

            setTimeout(() => {
                if (alarms.get(id)?.ringing) {
                    const osc2 = audioContext.createOscillator();
                    const gain2 = audioContext.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioContext.destination);
                    osc2.frequency.value = 600;
                    osc2.type = 'sine';
                    gain2.gain.value = 0.3;
                    osc2.start();
                    setTimeout(() => osc2.stop(), 150);
                }
            }, 200);

            setTimeout(() => beep(), 1000);
        }

        alarm.ringing = true;
        beep();
    }

    function stopAlarm(id) {
        const alarm = alarms.get(id);
        if (alarm) {
            alarm.ringing = false;
        }
        const container = document.getElementById(`alarm-${id}`);
        if (container) {
            container.classList.remove('ringing');
        }
    }

    function createAlarm() {
        alarmCount++;
        const id = alarmCount;

        const now = new Date();
        now.setMinutes(now.getMinutes() + 5);
        const defaultTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

        alarms.set(id, {
            time: defaultTime,
            enabled: true,
            ringing: false
        });

        const container = document.createElement('div');
        container.className = 'alarm';
        container.id = `alarm-${id}`;
        container.innerHTML = `
            <div class="alarm-header">
                <span class="alarm-label" contenteditable="true" spellcheck="false">Alarm ${id}</span>
                <button class="remove-btn" data-id="${id}">×</button>
            </div>
            <div class="alarm-time-row">
                <input type="time" class="alarm-time-input" id="time-${id}" value="${defaultTime}">
                <label class="toggle">
                    <input type="checkbox" id="toggle-${id}" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <button class="dismiss-btn hidden" id="dismiss-${id}">Dismiss</button>
        `;

        document.getElementById('alarmContainer').appendChild(container);

        const timeInput = document.getElementById(`time-${id}`);
        const toggleInput = document.getElementById(`toggle-${id}`);
        const dismissBtn = document.getElementById(`dismiss-${id}`);

        timeInput.addEventListener('change', (e) => {
            const alarm = alarms.get(id);
            if (alarm) {
                alarm.time = e.target.value;
            }
        });

        toggleInput.addEventListener('change', (e) => {
            const alarm = alarms.get(id);
            if (alarm) {
                alarm.enabled = e.target.checked;
                container.classList.toggle('disabled', !e.target.checked);
            }
        });

        dismissBtn.addEventListener('click', () => {
            stopAlarm(id);
            dismissBtn.classList.add('hidden');
        });

        container.querySelector('.remove-btn').addEventListener('click', () => {
            stopAlarm(id);
            alarms.delete(id);
            container.remove();
        });

        // Show dismiss button when ringing
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    if (container.classList.contains('ringing')) {
                        dismissBtn.classList.remove('hidden');
                    }
                }
            });
        });
        observer.observe(container, { attributes: true });
    }

    document.getElementById('addAlarm').addEventListener('click', createAlarm);

    // Update time every second
    setInterval(updateCurrentTime, 1000);
    updateCurrentTime();

    // Create one alarm by default
    createAlarm();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .current-time {
        margin-bottom: 40px;
    }

    .current-time .time {
        font-weight: 300;
        font-size: 4rem;
        font-family: 'SF Mono', 'Fira Code', monospace;
        letter-spacing: 2px;
        color: #fff;
    }

    .current-time .date {
        font-size: 14px;
        color: #666;
        margin-top: 10px;
    }

    #alarmContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }

    .alarm {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        min-width: 280px;
        transition: all 0.3s ease;
    }

    .alarm.disabled {
        opacity: 0.5;
    }

    .alarm.ringing {
        border-color: #e74c3c;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
        50% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
    }

    .alarm-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .alarm-label {
        font-weight: 400;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #666;
        cursor: text;
        padding: 4px 8px;
        border-radius: 4px;
        outline: none;
        transition: background 0.2s ease;
    }

    .alarm-label:hover {
        background: #252525;
    }

    .alarm-label:focus {
        background: #252525;
        color: #fff;
    }

    .remove-btn {
        background: transparent;
        color: #555;
        border: none;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        min-width: 24px;
        min-height: 24px;
        padding: 0;
        margin: 0;
        aspect-ratio: 1;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
    }

    .remove-btn:hover {
        color: #e74c3c;
    }

    .alarm-time-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }

    .alarm-time-input {
        font-weight: 300;
        font-size: 2.5rem;
        font-family: 'SF Mono', 'Fira Code', monospace;
        letter-spacing: 2px;
        color: #fff;
        background: transparent;
        border: none;
        text-align: center;
        outline: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 8px;
        transition: background 0.2s ease;
    }

    .alarm-time-input:hover {
        background: #252525;
    }

    .alarm-time-input:focus {
        background: #252525;
    }

    .alarm-time-input::-webkit-calendar-picker-indicator {
        display: none;
    }

    /* Toggle switch */
    .toggle {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 28px;
    }

    .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #333;
        transition: 0.3s;
        border-radius: 28px;
    }

    .toggle-slider:before {
        position: absolute;
        content: "";
        height: 20px;
        width: 20px;
        left: 4px;
        bottom: 4px;
        background-color: #666;
        transition: 0.3s;
        border-radius: 50%;
    }

    .toggle input:checked + .toggle-slider {
        background-color: #2ecc71;
    }

    .toggle input:checked + .toggle-slider:before {
        transform: translateX(22px);
        background-color: #fff;
    }

    .dismiss-btn {
        margin-top: 20px;
        background: #e74c3c;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
        width: 100%;
    }

    .dismiss-btn:hover {
        opacity: 0.8;
    }

    .dismiss-btn.hidden {
        display: none;
    }

    button {
        margin: 0;
        padding: 10px 20px;
        font-size: 12px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    button:hover {
        opacity: 0.8;
    }

    .add-btn {
        background: #fff;
        color: #0f0f0f;
        padding: 14px 28px;
        font-size: 13px;
        font-weight: 500;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .add-btn:hover {
        opacity: 0.9;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
