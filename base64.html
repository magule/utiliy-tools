<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Base64 Encoder/Decoder</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Base64 Encoder/Decoder</h1>

    <div class="converter">
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="encode">Encode</button>
            <button class="mode-tab" data-mode="decode">Decode</button>
        </div>

        <div class="input-section">
            <div class="section-header">
                <span id="inputLabel">Text to Encode</span>
                <button class="mini-btn" id="pasteBtn">Paste</button>
            </div>
            <textarea id="inputText" placeholder="Enter text here..."></textarea>
        </div>

        <button class="convert-btn" id="convertBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
            Convert
        </button>

        <div class="output-section">
            <div class="section-header">
                <span id="outputLabel">Base64 Output</span>
                <button class="mini-btn" id="copyBtn">Copy</button>
            </div>
            <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
        </div>

        <div class="status" id="status"></div>
    </div>

<script>
    let currentMode = 'encode';

    const modeTabs = document.querySelectorAll('.mode-tab');
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const inputLabel = document.getElementById('inputLabel');
    const outputLabel = document.getElementById('outputLabel');
    const convertBtn = document.getElementById('convertBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const copyBtn = document.getElementById('copyBtn');
    const status = document.getElementById('status');

    function setStatus(message, type) {
        status.textContent = message;
        status.className = 'status ' + type;
        setTimeout(() => {
            status.className = 'status';
            status.textContent = '';
        }, 3000);
    }

    function updateLabels() {
        if (currentMode === 'encode') {
            inputLabel.textContent = 'Text to Encode';
            outputLabel.textContent = 'Base64 Output';
            inputText.placeholder = 'Enter text to encode...';
        } else {
            inputLabel.textContent = 'Base64 to Decode';
            outputLabel.textContent = 'Decoded Text';
            inputText.placeholder = 'Enter Base64 string to decode...';
        }
    }

    function convert() {
        const input = inputText.value;

        if (!input.trim()) {
            outputText.value = '';
            return;
        }

        try {
            if (currentMode === 'encode') {
                // Encode: text to base64
                const encoded = btoa(unescape(encodeURIComponent(input)));
                outputText.value = encoded;
                setStatus('Encoded successfully!', 'success');
            } else {
                // Decode: base64 to text
                const decoded = decodeURIComponent(escape(atob(input)));
                outputText.value = decoded;
                setStatus('Decoded successfully!', 'success');
            }
        } catch (e) {
            setStatus('Error: Invalid input', 'error');
            outputText.value = '';
        }
    }

    modeTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            modeTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentMode = tab.dataset.mode;
            updateLabels();
            inputText.value = '';
            outputText.value = '';
        });
    });

    convertBtn.addEventListener('click', convert);
    inputText.addEventListener('input', convert);

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            inputText.value = text;
            convert();
        } catch (e) {
            setStatus('Could not paste from clipboard', 'error');
        }
    });

    copyBtn.addEventListener('click', async () => {
        if (outputText.value) {
            await navigator.clipboard.writeText(outputText.value);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = 'Copy', 1500);
        }
    });
</script>

<style>

        color: var(--text);

        right: 20px;
        width: 44px;

        border-radius: 50%;

        background: var(--bg-card);
        color: var(--text-muted);

        display: flex;

        justify-content: center;
        transition: all 0.2s ease;

    }

    }

    body[data-theme="dark"] .moon-icon { display: block; }

        background: var(--bg);
        color: var(--text);

        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .converter {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 500px;
        margin: 0 auto;
    }

    .mode-tabs {

        gap: 8px;
        margin-bottom: 25px;
    }

        padding: 12px;
        font-size: 12px;

        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: #666;
        cursor: pointer;
        text-transform: uppercase;

    }

    .mode-tab:hover {

    }

    .mode-tab.active {

        color: var(--text);
    }

    .section-header {

        margin-bottom: 10px;
        text-align: left;

    .section-header span {

        text-transform: uppercase;

        line-height: 1.5;

    textarea::placeholder {

    textarea[readonly] {

    .convert-btn {

        align-items: center;
        justify-content: center;
        gap: 10px;

                <span class="star" data-value="3">★</span>

            <span class="rating-thanks" id="ratingThanks"></span>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>
