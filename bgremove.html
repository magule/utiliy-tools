<!DOCTYPE html>
<html>
<head>
    <title>Background Remover</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Background Remover</h1>

    <div class="remover">
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">✂️</div>
            <div class="upload-text">Drop image here or click to upload</div>
            <div class="upload-hint">Works best with clear subjects</div>
            <input type="file" id="fileInput" accept="image/*" hidden>
        </div>

        <div class="editor" id="editor" style="display: none;">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
                <div class="checkerboard"></div>
            </div>

            <div class="tools">
                <div class="tool-group">
                    <span class="tool-label">Tolerance</span>
                    <input type="range" id="tolerance" min="0" max="100" value="30">
                    <span id="toleranceValue">30</span>
                </div>
                <div class="color-picker">
                    <span class="tool-label">Remove Color</span>
                    <div class="color-options">
                        <button class="color-btn active" data-mode="click">Click to Pick</button>
                        <button class="color-btn" data-mode="white">White</button>
                        <button class="color-btn" data-mode="black">Black</button>
                        <button class="color-btn" data-mode="green">Green Screen</button>
                    </div>
                </div>
            </div>

            <div class="instructions" id="instructions">
                Click on the background color you want to remove
            </div>

            <div class="actions">
                <button class="action-btn" id="downloadBtn">Download PNG</button>
                <button class="action-btn secondary" id="resetBtn">Reset</button>
                <button class="action-btn secondary" id="clearBtn">New Image</button>
            </div>
        </div>
    </div>

<script>
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const editor = document.getElementById('editor');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tolerance = document.getElementById('tolerance');
    const toleranceValue = document.getElementById('toleranceValue');
    const instructions = document.getElementById('instructions');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const clearBtn = document.getElementById('clearBtn');

    let originalImage = null;
    let originalImageData = null;
    let mode = 'click';

    uploadZone.addEventListener('click', () => fileInput.click());

    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) {
            handleFile(e.target.files[0]);
        }
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            originalImage = new Image();
            originalImage.onload = () => {
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;
                ctx.drawImage(originalImage, 0, 0);
                originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                uploadZone.style.display = 'none';
                editor.style.display = 'block';
            };
            originalImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    tolerance.addEventListener('input', () => {
        toleranceValue.textContent = tolerance.value;
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            mode = btn.dataset.mode;

            if (mode === 'click') {
                instructions.textContent = 'Click on the background color you want to remove';
                instructions.style.display = 'block';
            } else {
                instructions.style.display = 'none';
                let color;
                if (mode === 'white') color = [255, 255, 255];
                else if (mode === 'black') color = [0, 0, 0];
                else if (mode === 'green') color = [0, 255, 0];
                removeColor(color);
            }
        });
    });

    canvas.addEventListener('click', (e) => {
        if (mode !== 'click') return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = Math.floor((e.clientX - rect.left) * scaleX);
        const y = Math.floor((e.clientY - rect.top) * scaleY);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const idx = (y * canvas.width + x) * 4;
        const color = [imageData.data[idx], imageData.data[idx + 1], imageData.data[idx + 2]];

        removeColor(color);
    });

    function removeColor(targetColor) {
        const imageData = new ImageData(
            new Uint8ClampedArray(originalImageData.data),
            originalImageData.width,
            originalImageData.height
        );
        const data = imageData.data;
        const tol = parseInt(tolerance.value);

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const diff = Math.sqrt(
                Math.pow(r - targetColor[0], 2) +
                Math.pow(g - targetColor[1], 2) +
                Math.pow(b - targetColor[2], 2)
            );

            const maxDiff = tol * 4.41; // sqrt(3 * 255^2) * tol/100

            if (diff < maxDiff) {
                data[i + 3] = 0; // Set alpha to 0
            }
        }

        ctx.putImageData(imageData, 0, 0);
    }

    resetBtn.addEventListener('click', () => {
        ctx.putImageData(originalImageData, 0, 0);
    });

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'no-background.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    clearBtn.addEventListener('click', () => {
        originalImage = null;
        originalImageData = null;
        editor.style.display = 'none';
        uploadZone.style.display = 'block';
        fileInput.value = '';
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .remover {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        max-width: 600px;
        margin: 0 auto;
    }

    .upload-zone {
        border: 2px dashed #333;
        border-radius: 12px;
        padding: 40px 20px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
        border-color: #555;
        background: #252525;
    }

    .upload-icon {
        font-size: 3rem;
        margin-bottom: 15px;
    }

    .upload-text {
        font-size: 14px;
        color: #888;
        margin-bottom: 8px;
    }

    .upload-hint {
        font-size: 11px;
        color: #555;
    }

    .canvas-container {
        position: relative;
        margin-bottom: 20px;
        border-radius: 10px;
        overflow: hidden;
    }

    .checkerboard {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
            linear-gradient(45deg, #252525 25%, transparent 25%),
            linear-gradient(-45deg, #252525 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #252525 75%),
            linear-gradient(-45deg, transparent 75%, #252525 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        z-index: 0;
    }

    #canvas {
        position: relative;
        max-width: 100%;
        height: auto;
        cursor: crosshair;
        z-index: 1;
    }

    .tools {
        background: #252525;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
    }

    .tool-group {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
        padding-bottom: 15px;
        border-bottom: 1px solid #333;
    }

    .tool-label {
        font-size: 12px;
        color: #888;
        min-width: 80px;
        text-align: left;
    }

    .tool-group input[type="range"] {
        flex: 1;
        accent-color: #2ecc71;
    }

    .tool-group span:last-child {
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #2ecc71;
        min-width: 30px;
    }

    .color-picker {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .color-options {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .color-btn {
        padding: 8px 12px;
        font-size: 11px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        color: #888;
        cursor: pointer;
        transition: all 0.2s;
    }

    .color-btn:hover {
        border-color: #555;
        color: #fff;
    }

    .color-btn.active {
        background: #2ecc71;
        border-color: #2ecc71;
        color: #fff;
    }

    .instructions {
        font-size: 12px;
        color: #888;
        margin-bottom: 15px;
        padding: 10px;
        background: rgba(52, 152, 219, 0.1);
        border-radius: 6px;
        color: #3498db;
    }

    .actions {
        display: flex;
        gap: 10px;
    }

    .action-btn {
        flex: 1;
        padding: 14px;
        font-size: 12px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 10px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .action-btn:hover {
        opacity: 0.9;
    }

    .action-btn.secondary {
        background: #333;
        color: #aaa;
    }

    .action-btn.secondary:hover {
        background: #444;
        color: #fff;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
