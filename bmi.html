<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>BMI Calculator</h1>

    <div class="calculator">
        <div class="unit-toggle">
            <button class="unit-btn active" data-unit="metric">Metric</button>
            <button class="unit-btn" data-unit="imperial">Imperial</button>
        </div>

        <div class="input-section" id="metricInputs">
            <div class="input-group">
                <label>Height</label>
                <div class="input-with-suffix">
                    <input type="number" id="heightCm" value="170" min="1" max="300">
                    <span class="suffix">cm</span>
                </div>
            </div>
            <div class="input-group">
                <label>Weight</label>
                <div class="input-with-suffix">
                    <input type="number" id="weightKg" value="70" min="1" max="500">
                    <span class="suffix">kg</span>
                </div>
            </div>
        </div>

        <div class="input-section hidden" id="imperialInputs">
            <div class="input-group">
                <label>Height</label>
                <div class="dual-input">
                    <div class="input-with-suffix">
                        <input type="number" id="heightFt" value="5" min="1" max="9">
                        <span class="suffix">ft</span>
                    </div>
                    <div class="input-with-suffix">
                        <input type="number" id="heightIn" value="7" min="0" max="11">
                        <span class="suffix">in</span>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label>Weight</label>
                <div class="input-with-suffix">
                    <input type="number" id="weightLbs" value="154" min="1" max="1000">
                    <span class="suffix">lbs</span>
                </div>
            </div>
        </div>

        <div class="result-section">
            <div class="bmi-display">
                <span class="bmi-value" id="bmiValue">24.2</span>
                <span class="bmi-label">BMI</span>
            </div>

            <div class="bmi-bar">
                <div class="bmi-indicator" id="bmiIndicator"></div>
                <div class="bmi-zones">
                    <div class="zone underweight"></div>
                    <div class="zone normal"></div>
                    <div class="zone overweight"></div>
                    <div class="zone obese"></div>
                </div>
            </div>

            <div class="bmi-category" id="bmiCategory">Normal weight</div>

            <div class="bmi-ranges">
                <div class="range-item">
                    <span class="range-color underweight"></span>
                    <span class="range-label">Underweight</span>
                    <span class="range-value">&lt; 18.5</span>
                </div>
                <div class="range-item">
                    <span class="range-color normal"></span>
                    <span class="range-label">Normal</span>
                    <span class="range-value">18.5 - 24.9</span>
                </div>
                <div class="range-item">
                    <span class="range-color overweight"></span>
                    <span class="range-label">Overweight</span>
                    <span class="range-value">25 - 29.9</span>
                </div>
                <div class="range-item">
                    <span class="range-color obese"></span>
                    <span class="range-label">Obese</span>
                    <span class="range-value">&gt; 30</span>
                </div>
            </div>
        </div>
    </div>

<script>
    let currentUnit = 'metric';

    const unitBtns = document.querySelectorAll('.unit-btn');
    const metricInputs = document.getElementById('metricInputs');
    const imperialInputs = document.getElementById('imperialInputs');
    const heightCm = document.getElementById('heightCm');
    const weightKg = document.getElementById('weightKg');
    const heightFt = document.getElementById('heightFt');
    const heightIn = document.getElementById('heightIn');
    const weightLbs = document.getElementById('weightLbs');
    const bmiValue = document.getElementById('bmiValue');
    const bmiCategory = document.getElementById('bmiCategory');
    const bmiIndicator = document.getElementById('bmiIndicator');

    function calculateBMI() {
        let heightM, weightKgVal;

        if (currentUnit === 'metric') {
            heightM = parseFloat(heightCm.value) / 100;
            weightKgVal = parseFloat(weightKg.value);
        } else {
            const totalInches = (parseFloat(heightFt.value) * 12) + parseFloat(heightIn.value);
            heightM = totalInches * 0.0254;
            weightKgVal = parseFloat(weightLbs.value) * 0.453592;
        }

        if (heightM <= 0 || weightKgVal <= 0) {
            bmiValue.textContent = '--';
            bmiCategory.textContent = 'Enter valid values';
            bmiIndicator.style.left = '0%';
            return;
        }

        const bmi = weightKgVal / (heightM * heightM);
        bmiValue.textContent = bmi.toFixed(1);

        // Update category and color
        let category, color, position;
        if (bmi < 18.5) {
            category = 'Underweight';
            color = '#3498db';
            position = (bmi / 18.5) * 25;
        } else if (bmi < 25) {
            category = 'Normal weight';
            color = '#2ecc71';
            position = 25 + ((bmi - 18.5) / 6.5) * 25;
        } else if (bmi < 30) {
            category = 'Overweight';
            color = '#f39c12';
            position = 50 + ((bmi - 25) / 5) * 25;
        } else {
            category = 'Obese';
            color = '#e74c3c';
            position = Math.min(75 + ((bmi - 30) / 10) * 25, 100);
        }

        bmiCategory.textContent = category;
        bmiCategory.style.color = color;
        bmiValue.style.color = color;
        bmiIndicator.style.left = `${position}%`;
    }

    unitBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            unitBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentUnit = btn.dataset.unit;

            if (currentUnit === 'metric') {
                metricInputs.classList.remove('hidden');
                imperialInputs.classList.add('hidden');
            } else {
                metricInputs.classList.add('hidden');
                imperialInputs.classList.remove('hidden');
            }

            calculateBMI();
        });
    });

    [heightCm, weightKg, heightFt, heightIn, weightLbs].forEach(input => {
        input.addEventListener('input', calculateBMI);
    });

    calculateBMI();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .calculator {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 400px;
        margin: 0 auto;
    }

    .unit-toggle {
        display: flex;
        gap: 8px;
        margin-bottom: 25px;
    }

    .unit-btn {
        flex: 1;
        padding: 12px;
        font-size: 12px;
        font-weight: 500;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: #666;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .unit-btn:hover {
        color: var(--text-muted);
    }

    .unit-btn.active {
        background: #333;
        border-color: var(--text-subtle);
        color: var(--text);
    }

    .input-section {
        margin-bottom: 25px;
    }

    .input-section.hidden {
        display: none;
    }

    .input-group {
        margin-bottom: 15px;
        text-align: left;
    }

    .input-group label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .input-with-suffix {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-with-suffix input {
        width: 100%;
        padding: 15px;
        padding-right: 50px;
        font-size: 1.25rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        outline: none;
    }

    .input-with-suffix input:focus {
        border-color: var(--text-subtle);
    }

    .suffix {
        position: absolute;
        right: 15px;
        font-size: 14px;
        color: var(--text-subtle);
    }

    .dual-input {
        display: flex;
        gap: 10px;
    }

    .dual-input .input-with-suffix {
        flex: 1;
    }

    .result-section {
        background: var(--bg-input);
        border-radius: 12px;
        padding: 25px;
    }

    .bmi-display {
        margin-bottom: 20px;
    }

    .bmi-value {
        display: block;
        font-size: 4rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--accent);
        transition: color 0.3s ease;
    }

    .bmi-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-subtle);
    }

    .bmi-bar {
        position: relative;
        height: 8px;
        margin-bottom: 15px;
    }

    .bmi-zones {
        display: flex;
        height: 100%;
        border-radius: 4px;
        overflow: hidden;
    }

    .zone {
        flex: 1;
    }

    .zone.underweight { background: #3498db; }
    .zone.normal { background: var(--accent); }
    .zone.overweight { background: #f39c12; }
    .zone.obese { background: var(--danger); }

    .bmi-indicator {
        position: absolute;
        top: -4px;
        width: 4px;
        height: 16px;
        background: #fff;
        border-radius: 2px;
        transition: left 0.3s ease;
        transform: translateX(-50%);
    }

    .bmi-category {
        font-size: 14px;
        font-weight: 500;
        color: var(--accent);
        margin-bottom: 20px;
        transition: color 0.3s ease;
    }

    .bmi-ranges {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .range-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
    }

    .range-color {
        width: 10px;
        height: 10px;
        border-radius: 2px;
    }

    .range-color.underweight { background: #3498db; }
    .range-color.normal { background: var(--accent); }
    .range-color.overweight { background: #f39c12; }
    .range-color.obese { background: var(--danger); }

    .range-label {
        flex: 1;
        color: var(--text-muted);
        text-align: left;
    }

    .range-value {
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--text-subtle);
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
