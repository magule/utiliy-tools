<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Exercise</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Breathing Exercise</h1>

    <div class="exercise">
        <div class="pattern-select">
            <button class="pattern-btn active" data-pattern="relax">Relaxing</button>
            <button class="pattern-btn" data-pattern="energize">Energizing</button>
            <button class="pattern-btn" data-pattern="box">Box</button>
        </div>

        <div class="breathing-circle">
            <div class="circle" id="circle">
                <div class="circle-text">
                    <span class="instruction" id="instruction">Ready</span>
                    <span class="timer" id="timer"></span>
                </div>
            </div>
        </div>

        <div class="pattern-info" id="patternInfo">
            <div class="pattern-name" id="patternName">4-7-8 Relaxing Breath</div>
            <div class="pattern-desc" id="patternDesc">Inhale 4s → Hold 7s → Exhale 8s</div>
        </div>

        <div class="controls">
            <button class="control-btn" id="startBtn">Start</button>
        </div>

        <div class="cycles">
            <span id="cycleCount">0</span> cycles completed
        </div>

        <div class="duration-select">
            <span>Duration:</span>
            <button class="duration-btn" data-duration="1">1 min</button>
            <button class="duration-btn active" data-duration="3">3 min</button>
            <button class="duration-btn" data-duration="5">5 min</button>
        </div>
    </div>

<script>
    const patterns = {
        relax: {
            name: '4-7-8 Relaxing Breath',
            desc: 'Inhale 4s → Hold 7s → Exhale 8s',
            inhale: 4,
            hold1: 7,
            exhale: 8,
            hold2: 0
        },
        energize: {
            name: 'Energizing Breath',
            desc: 'Inhale 4s → Exhale 4s (quick cycles)',
            inhale: 4,
            hold1: 0,
            exhale: 4,
            hold2: 0
        },
        box: {
            name: 'Box Breathing',
            desc: 'Inhale 4s → Hold 4s → Exhale 4s → Hold 4s',
            inhale: 4,
            hold1: 4,
            exhale: 4,
            hold2: 4
        }
    };

    let currentPattern = 'relax';
    let duration = 3;
    let isRunning = false;
    let cycleCount = 0;
    let timeoutId = null;
    let startTime = null;

    const circle = document.getElementById('circle');
    const instruction = document.getElementById('instruction');
    const timer = document.getElementById('timer');
    const patternName = document.getElementById('patternName');
    const patternDesc = document.getElementById('patternDesc');
    const cycleCountEl = document.getElementById('cycleCount');
    const startBtn = document.getElementById('startBtn');
    const patternBtns = document.querySelectorAll('.pattern-btn');
    const durationBtns = document.querySelectorAll('.duration-btn');

    function updatePatternInfo() {
        const pattern = patterns[currentPattern];
        patternName.textContent = pattern.name;
        patternDesc.textContent = pattern.desc;
    }

    function setCircleState(state, seconds) {
        circle.className = 'circle ' + state;
        instruction.textContent = state === 'hold1' || state === 'hold2' ? 'Hold' :
                                  state.charAt(0).toUpperCase() + state.slice(1);
    }

    function runCycle() {
        const pattern = patterns[currentPattern];
        const phases = [];

        if (pattern.inhale > 0) phases.push({ name: 'inhale', duration: pattern.inhale });
        if (pattern.hold1 > 0) phases.push({ name: 'hold1', duration: pattern.hold1 });
        if (pattern.exhale > 0) phases.push({ name: 'exhale', duration: pattern.exhale });
        if (pattern.hold2 > 0) phases.push({ name: 'hold2', duration: pattern.hold2 });

        let phaseIndex = 0;
        let secondsInPhase = 0;

        function tick() {
            if (!isRunning) return;

            // Check if duration is exceeded
            const elapsed = (Date.now() - startTime) / 1000;
            if (elapsed >= duration * 60) {
                stop();
                return;
            }

            const phase = phases[phaseIndex];
            secondsInPhase++;

            setCircleState(phase.name, phase.duration - secondsInPhase + 1);
            timer.textContent = phase.duration - secondsInPhase + 1;

            if (secondsInPhase >= phase.duration) {
                phaseIndex++;
                secondsInPhase = 0;

                if (phaseIndex >= phases.length) {
                    phaseIndex = 0;
                    cycleCount++;
                    cycleCountEl.textContent = cycleCount;
                }
            }

            timeoutId = setTimeout(tick, 1000);
        }

        // Start first phase immediately
        setCircleState(phases[0].name, phases[0].duration);
        timer.textContent = phases[0].duration;
        timeoutId = setTimeout(tick, 1000);
    }

    function start() {
        if (isRunning) {
            stop();
            return;
        }

        isRunning = true;
        cycleCount = 0;
        cycleCountEl.textContent = 0;
        startTime = Date.now();
        startBtn.textContent = 'Stop';
        startBtn.classList.add('active');

        runCycle();
    }

    function stop() {
        isRunning = false;
        clearTimeout(timeoutId);
        startBtn.textContent = 'Start';
        startBtn.classList.remove('active');
        circle.className = 'circle';
        instruction.textContent = 'Ready';
        timer.textContent = '';
    }

    patternBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (isRunning) stop();
            patternBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPattern = btn.dataset.pattern;
            updatePatternInfo();
        });
    });

    durationBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            durationBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            duration = parseInt(btn.dataset.duration);
        });
    });

    startBtn.addEventListener('click', start);

    updatePatternInfo();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .exercise {
        max-width: 400px;
        margin: 0 auto;
    }

    .pattern-select {
        display: flex;
        gap: 8px;
        margin-bottom: 40px;
    }

    .pattern-btn {
        flex: 1;
        padding: 12px 10px;
        font-size: 11px;
        font-weight: 500;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: #666;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .pattern-btn:hover {
        border-color: var(--border);
        color: var(--text-muted);
    }

    .pattern-btn.active {
        background: var(--bg-input);
        border-color: var(--border);
        color: var(--text);
    }

    .breathing-circle {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
    }

    .circle {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: var(--bg-card);
        border: 3px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 1s ease;
    }

    .circle.inhale {
        transform: scale(1.2);
        border-color: #3498db;
        background: rgba(52, 152, 219, 0.1);
    }

    .circle.exhale {
        transform: scale(0.9);
        border-color: #9b59b6;
        background: rgba(155, 89, 182, 0.1);
    }

    .circle.hold1,
    .circle.hold2 {
        border-color: var(--accent);
        background: rgba(46, 204, 113, 0.1);
    }

    .circle-text {
        text-align: center;
    }

    .instruction {
        display: block;
        font-size: 1.25rem;
        font-weight: 300;
        color: var(--text);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 5px;
    }

    .timer {
        font-size: 2rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--text-muted);
    }

    .pattern-info {
        margin-bottom: 30px;
    }

    .pattern-name {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 5px;
    }

    .pattern-desc {
        font-size: 12px;
        color: var(--text-subtle);
    }

    .controls {
        margin-bottom: 20px;
    }

    .control-btn {
        padding: 16px 60px;
        font-size: 14px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 12px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.2s ease;
    }

    .control-btn:hover {
        opacity: 0.9;
    }

    .control-btn.active {
        background: var(--danger);
        color: var(--text);
    }

    .cycles {
        font-size: 13px;
        color: var(--text-subtle);
        margin-bottom: 30px;
    }

    .cycles span {
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--accent);
    }

    .duration-select {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .duration-select > span {
        font-size: 12px;
        color: var(--text-subtle);
    }

    .duration-btn {
        padding: 8px 15px;
        font-size: 11px;
        font-weight: 500;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-subtle);
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .duration-btn:hover {
        border-color: var(--border);
        color: var(--text-muted);
    }

    .duration-btn.active {
        background: var(--bg-input);
        border-color: var(--border);
        color: var(--text);
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
