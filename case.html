<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Case Converter</h1>

    <div class="converter">
        <div class="input-section">
            <textarea id="input" placeholder="Enter your text here..."></textarea>
        </div>

        <div class="case-buttons">
            <button class="case-btn" data-case="lower">lowercase</button>
            <button class="case-btn" data-case="upper">UPPERCASE</button>
            <button class="case-btn" data-case="title">Title Case</button>
            <button class="case-btn" data-case="sentence">Sentence case</button>
            <button class="case-btn" data-case="camel">camelCase</button>
            <button class="case-btn" data-case="pascal">PascalCase</button>
            <button class="case-btn" data-case="snake">snake_case</button>
            <button class="case-btn" data-case="kebab">kebab-case</button>
            <button class="case-btn" data-case="constant">CONSTANT_CASE</button>
            <button class="case-btn" data-case="dot">dot.case</button>
            <button class="case-btn" data-case="toggle">tOGGLE cASE</button>
            <button class="case-btn" data-case="alternating">aLtErNaTiNg</button>
        </div>

        <div class="output-section">
            <div class="output-header">
                <span id="charCount">0 characters</span>
                <button class="copy-btn" id="copyBtn">Copy</button>
            </div>
            <div class="output" id="output"></div>
        </div>
    </div>

<script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const charCount = document.getElementById('charCount');
    const copyBtn = document.getElementById('copyBtn');

    function toWords(str) {
        return str
            .replace(/([a-z])([A-Z])/g, '$1 $2')
            .replace(/[_\-\.]/g, ' ')
            .split(/\s+/)
            .filter(w => w.length > 0);
    }

    const converters = {
        lower: (text) => text.toLowerCase(),
        upper: (text) => text.toUpperCase(),
        title: (text) => text.replace(/\w\S*/g, (txt) =>
            txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase()
        ),
        sentence: (text) => {
            return text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, (c) => c.toUpperCase());
        },
        camel: (text) => {
            const words = toWords(text);
            return words.map((w, i) =>
                i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
            ).join('');
        },
        pascal: (text) => {
            const words = toWords(text);
            return words.map(w =>
                w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
            ).join('');
        },
        snake: (text) => {
            const words = toWords(text);
            return words.map(w => w.toLowerCase()).join('_');
        },
        kebab: (text) => {
            const words = toWords(text);
            return words.map(w => w.toLowerCase()).join('-');
        },
        constant: (text) => {
            const words = toWords(text);
            return words.map(w => w.toUpperCase()).join('_');
        },
        dot: (text) => {
            const words = toWords(text);
            return words.map(w => w.toLowerCase()).join('.');
        },
        toggle: (text) => {
            return text.split('').map(c => {
                if (c === c.toUpperCase()) return c.toLowerCase();
                return c.toUpperCase();
            }).join('');
        },
        alternating: (text) => {
            let i = 0;
            return text.split('').map(c => {
                if (/[a-zA-Z]/.test(c)) {
                    return i++ % 2 === 0 ? c.toLowerCase() : c.toUpperCase();
                }
                return c;
            }).join('');
        }
    };

    document.querySelectorAll('.case-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const caseType = btn.dataset.case;
            const text = input.value;
            const result = converters[caseType](text);
            output.textContent = result;
            updateCount(result);

            document.querySelectorAll('.case-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    function updateCount(text) {
        const count = text.length;
        charCount.textContent = count + ' character' + (count !== 1 ? 's' : '');
    }

    input.addEventListener('input', () => {
        output.textContent = '';
        updateCount('');
        document.querySelectorAll('.case-btn').forEach(b => b.classList.remove('active'));
    });

    copyBtn.addEventListener('click', async () => {
        await navigator.clipboard.writeText(output.textContent);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1500);
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .converter {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 600px;
        margin: 0 auto;
    }

    .input-section {
        margin-bottom: 20px;
    }

    .input-section textarea {
        width: 100%;
        height: 120px;
        padding: 15px;
        font-size: 14px;
        font-family: inherit;
        line-height: 1.6;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        outline: none;
        resize: vertical;
    }

    .input-section textarea:focus {
        border-color: var(--text-subtle);
    }

    .input-section textarea::placeholder {
        color: var(--text-subtle);
    }

    .case-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 20px;
    }

    .case-btn {
        padding: 12px 8px;
        font-size: 11px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
    }

    .case-btn:hover {
        border-color: var(--text-subtle);
        color: var(--text);
    }

    .case-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--text);
    }

    .output-section {
        background: var(--bg-input);
        border-radius: 10px;
        overflow: hidden;
        text-align: left;
    }

    .output-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 15px;
        border-bottom: 1px solid #333;
    }

    #charCount {
        font-size: 11px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--accent);
    }

    .copy-btn {
        padding: 6px 12px;
        font-size: 10px;
        font-weight: 500;
        background: #333;
        border: none;
        border-radius: 4px;
        color: var(--text-muted);
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
    }

    .copy-btn:hover {
        background: #444;
        color: var(--text);
    }

    .output {
        padding: 15px;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        line-height: 1.6;
        color: var(--text);
        min-height: 60px;
        max-height: 200px;
        overflow-y: auto;
        word-break: break-all;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
