<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Image Compressor</h1>

    <div class="compressor">
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">🗜️</div>
            <div class="upload-text">Drop images here or click to upload</div>
            <div class="upload-hint">Supports JPG, PNG, WebP</div>
            <input type="file" id="fileInput" multiple accept="image/*" hidden>
        </div>

        <div class="options">
            <div class="option-row">
                <label>Quality</label>
                <input type="range" id="quality" min="10" max="100" value="80">
                <span id="qualityValue">80%</span>
            </div>
            <div class="option-row">
                <label>Max Width</label>
                <select id="maxWidth">
                    <option value="0">No limit</option>
                    <option value="800">800px</option>
                    <option value="1200">1200px</option>
                    <option value="1920" selected>1920px</option>
                    <option value="2560">2560px</option>
                </select>
            </div>
            <div class="option-row">
                <label>Format</label>
                <select id="format">
                    <option value="original">Keep Original</option>
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/webp">WebP</option>
                </select>
            </div>
        </div>

        <div class="images-list" id="imagesList"></div>

        <div class="total-savings" id="totalSavings" style="display: none;">
            <span class="savings-label">Total Savings</span>
            <span class="savings-value" id="savingsValue"></span>
        </div>

        <div class="actions" id="actions" style="display: none;">
            <button class="action-btn" id="downloadAllBtn">Download All</button>
            <button class="action-btn secondary" id="clearBtn">Clear</button>
        </div>
    </div>

<script>
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const imagesList = document.getElementById('imagesList');
    const quality = document.getElementById('quality');
    const qualityValue = document.getElementById('qualityValue');
    const maxWidth = document.getElementById('maxWidth');
    const format = document.getElementById('format');
    const totalSavings = document.getElementById('totalSavings');
    const savingsValue = document.getElementById('savingsValue');
    const actions = document.getElementById('actions');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const clearBtn = document.getElementById('clearBtn');

    let images = [];

    uploadZone.addEventListener('click', () => fileInput.click());

    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    quality.addEventListener('input', () => {
        qualityValue.textContent = quality.value + '%';
        recompressAll();
    });

    maxWidth.addEventListener('change', recompressAll);
    format.addEventListener('change', recompressAll);

    async function handleFiles(files) {
        for (const file of files) {
            if (file.type.startsWith('image/')) {
                const img = await loadImage(file);
                images.push({
                    name: file.name,
                    originalSize: file.size,
                    originalType: file.type,
                    image: img,
                    compressed: null,
                    compressedSize: 0
                });
            }
        }
        await recompressAll();
    }

    function loadImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function recompressAll() {
        for (let i = 0; i < images.length; i++) {
            await compressImage(images[i]);
        }
        renderImages();
    }

    async function compressImage(item) {
        const img = item.image;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        let w = img.width;
        let h = img.height;
        const max = parseInt(maxWidth.value);

        if (max > 0 && w > max) {
            h = (max / w) * h;
            w = max;
        }

        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);

        const fmt = format.value === 'original' ? item.originalType : format.value;
        const q = quality.value / 100;

        const dataUrl = canvas.toDataURL(fmt, q);
        item.compressed = dataUrl;
        item.compressedSize = Math.round((dataUrl.length * 3) / 4);
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function renderImages() {
        if (images.length === 0) {
            imagesList.innerHTML = '';
            totalSavings.style.display = 'none';
            actions.style.display = 'none';
            return;
        }

        actions.style.display = 'flex';
        totalSavings.style.display = 'flex';

        let totalOriginal = 0;
        let totalCompressed = 0;

        imagesList.innerHTML = images.map((item, i) => {
            totalOriginal += item.originalSize;
            totalCompressed += item.compressedSize;

            const savings = ((1 - item.compressedSize / item.originalSize) * 100).toFixed(0);
            const savingsClass = savings > 0 ? 'positive' : 'negative';

            return `
                <div class="image-item">
                    <img src="${item.compressed}" alt="${item.name}">
                    <div class="image-info">
                        <div class="image-name">${item.name}</div>
                        <div class="image-sizes">
                            <span class="original-size">${formatSize(item.originalSize)}</span>
                            <span class="arrow">→</span>
                            <span class="new-size">${formatSize(item.compressedSize)}</span>
                            <span class="savings ${savingsClass}">${savings}%</span>
                        </div>
                    </div>
                    <button class="download-btn" data-index="${i}">↓</button>
                    <button class="remove-btn" data-index="${i}">×</button>
                </div>
            `;
        }).join('');

        const totalSavingsPercent = ((1 - totalCompressed / totalOriginal) * 100).toFixed(0);
        savingsValue.textContent = `${formatSize(totalOriginal - totalCompressed)} (${totalSavingsPercent}%)`;
    }

    imagesList.addEventListener('click', (e) => {
        const index = parseInt(e.target.dataset.index);

        if (e.target.classList.contains('download-btn')) {
            downloadImage(index);
        } else if (e.target.classList.contains('remove-btn')) {
            images.splice(index, 1);
            renderImages();
        }
    });

    function downloadImage(index) {
        const item = images[index];
        const link = document.createElement('a');
        const ext = format.value === 'original'
            ? item.name.split('.').pop()
            : format.value.split('/')[1];
        link.download = item.name.replace(/\.[^.]+$/, '') + '-compressed.' + ext;
        link.href = item.compressed;
        link.click();
    }

    downloadAllBtn.addEventListener('click', async () => {
        for (let i = 0; i < images.length; i++) {
            downloadImage(i);
            await new Promise(r => setTimeout(r, 300));
        }
    });

    clearBtn.addEventListener('click', () => {
        images = [];
        renderImages();
        fileInput.value = '';
    });
</script>

<style>

                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>

            <span class="rating-thanks" id="ratingThanks"></span>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>
