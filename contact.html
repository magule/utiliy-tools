<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Contact</h1>

    <div class="contact">
        <p class="intro">Got questions, feedback, or just want to say hi?</p>

        <div class="contact-links">
            <a href="mailto:tevah.dev@gmail.com" class="contact-card">
                <div class="contact-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
                <div class="contact-info">
                    <h3>Email</h3>
                    <p>tevah.dev@gmail.com</p>
                </div>
            </a>

            <a href="https://github.com/magule" target="_blank" rel="noopener noreferrer" class="contact-card">
                <div class="contact-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                </div>
                <div class="contact-info">
                    <h3>GitHub</h3>
                    <p>github.com/magule</p>
                </div>
            </a>
        </div>
    </div>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .contact {
        max-width: 500px;
        margin: 0 auto;
    }

    .intro {
        font-size: 14px;
        color: #666;
        margin-bottom: 40px;
    }

    .contact-links {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .contact-card {
        display: flex;
        align-items: center;
        gap: 20px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 20px;
        text-decoration: none;
        color: inherit;
        transition: all 0.2s ease;
    }

    .contact-card:hover {
        border-color: #333;
        background: #1e1e1e;
    }

    .contact-icon {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        background: #252525;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        flex-shrink: 0;
        transition: all 0.2s ease;
    }

    .contact-card:hover .contact-icon {
        background: #2a2a2a;
        color: #2ecc71;
    }

    .contact-info {
        text-align: left;
    }

    .contact-info h3 {
        font-size: 14px;
        font-weight: 500;
        color: #ddd;
        margin-bottom: 4px;
    }

    .contact-info p {
        font-size: 13px;
        color: #666;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    footer {
        max-width: 500px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    footer p {
        font-size: 11px;
        color: #333;
        letter-spacing: 1px;
    }
</style>

    <footer>
        <p>All tools work offline. No data leaves your browser.</p>
    </footer>

</body>
</html>
