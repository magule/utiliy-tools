<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Countdown Timer</h1>

    <button id="addCountdown" class="add-btn">+ Add Countdown</button>

    <div id="countdownContainer"></div>

<script>
    let countdownCount = 0;

    function createCountdown() {
        countdownCount++;
        const id = countdownCount;

        const countdown = {
            totalSeconds: 300,
            initialSeconds: 300,
            intervalID: null,
            isRunning: false
        };

        const container = document.createElement('div');
        container.className = 'countdown';
        container.id = `countdown-${id}`;
        container.innerHTML = `
            <div class="countdown-header">
                <span class="countdown-label" contenteditable="true" spellcheck="false">Countdown ${id}</span>
                <button class="remove-btn" data-id="${id}">×</button>
            </div>
            <div class="time-display" id="time-${id}">
                <input type="number" class="time-input" id="hours-${id}" min="0" max="99" value="00">
                <span class="time-separator">:</span>
                <input type="number" class="time-input" id="minutes-${id}" min="0" max="59" value="05">
                <span class="time-separator">:</span>
                <input type="number" class="time-input" id="seconds-${id}" min="0" max="59" value="00">
            </div>
            <div class="buttons">
                <button class="start-btn" data-id="${id}">Start</button>
                <button class="stop-btn" data-id="${id}">Stop</button>
                <button class="reset-btn" data-id="${id}">Reset</button>
            </div>
        `;

        document.getElementById('countdownContainer').appendChild(container);

        const timeDisplay = document.getElementById(`time-${id}`);
        const hoursInput = document.getElementById(`hours-${id}`);
        const minutesInput = document.getElementById(`minutes-${id}`);
        const secondsInput = document.getElementById(`seconds-${id}`);

        function formatValue(val) {
            return val.toString().padStart(2, '0');
        }

        function getInputSeconds() {
            const h = parseInt(hoursInput.value) || 0;
            const m = parseInt(minutesInput.value) || 0;
            const s = parseInt(secondsInput.value) || 0;
            return h * 3600 + m * 60 + s;
        }

        function setInputsFromSeconds(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            hoursInput.value = formatValue(hours);
            minutesInput.value = formatValue(minutes);
            secondsInput.value = formatValue(seconds);
        }

        function setInputsEnabled(enabled) {
            hoursInput.disabled = !enabled;
            minutesInput.disabled = !enabled;
            secondsInput.disabled = !enabled;
        }

        function updateDisplay() {
            setInputsFromSeconds(countdown.totalSeconds);
            if (countdown.totalSeconds <= 0 && countdown.isRunning) {
                clearInterval(countdown.intervalID);
                countdown.isRunning = false;
                timeDisplay.classList.add('finished');
                setInputsEnabled(true);
            }
        }

        function tick() {
            if (countdown.totalSeconds > 0) {
                countdown.totalSeconds -= 1;
                updateDisplay();
            }
        }

        // Format input on blur
        [hoursInput, minutesInput, secondsInput].forEach(input => {
            input.addEventListener('blur', () => {
                input.value = formatValue(parseInt(input.value) || 0);
            });
            input.addEventListener('input', () => {
                if (!countdown.isRunning) {
                    countdown.totalSeconds = getInputSeconds();
                    countdown.initialSeconds = countdown.totalSeconds;
                    timeDisplay.classList.remove('finished');
                }
            });
        });

        container.querySelector('.start-btn').addEventListener('click', () => {
            if (!countdown.isRunning) {
                countdown.totalSeconds = getInputSeconds();
                countdown.initialSeconds = countdown.totalSeconds;
                if (countdown.totalSeconds > 0) {
                    countdown.intervalID = setInterval(tick, 1000);
                    countdown.isRunning = true;
                    setInputsEnabled(false);
                    timeDisplay.classList.remove('finished');
                }
            }
        });

        container.querySelector('.stop-btn').addEventListener('click', () => {
            if (countdown.isRunning) {
                clearInterval(countdown.intervalID);
                countdown.isRunning = false;
                setInputsEnabled(true);
            }
        });

        container.querySelector('.reset-btn').addEventListener('click', () => {
            clearInterval(countdown.intervalID);
            countdown.totalSeconds = countdown.initialSeconds;
            updateDisplay();
            countdown.isRunning = false;
            setInputsEnabled(true);
            timeDisplay.classList.remove('finished');
        });

        container.querySelector('.remove-btn').addEventListener('click', () => {
            clearInterval(countdown.intervalID);
            container.remove();
        });

        // Initialize
        setInputsFromSeconds(countdown.totalSeconds);
    }

    document.getElementById('addCountdown').addEventListener('click', createCountdown);

    // Create one countdown by default
    createCountdown();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    #countdownContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }

    .countdown {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        min-width: 280px;
    }

    .countdown-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .countdown-label {
        font-weight: 400;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #666;
        cursor: text;
        padding: 4px 8px;
        border-radius: 4px;
        outline: none;
        transition: background 0.2s ease;
    }

    .countdown-label:hover {
        background: var(--bg-input);
    }

    .countdown-label:focus {
        background: var(--bg-input);
        color: var(--text);
    }

    .remove-btn {
        background: transparent;
        color: var(--text-subtle);
        border: none;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        min-width: 24px;
        min-height: 24px;
        padding: 0;
        margin: 0;
        aspect-ratio: 1;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
    }

    .remove-btn:hover {
        color: var(--danger);
    }

    .time-display {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px 0;
        transition: color 0.3s ease;
    }

    .time-display.finished .time-input,
    .time-display.finished .time-separator {
        color: var(--danger);
    }

    .time-input {
        width: 60px;
        font-weight: 300;
        font-size: 3rem;
        font-family: 'SF Mono', 'Fira Code', monospace;
        letter-spacing: 2px;
        color: var(--text);
        background: transparent;
        border: none;
        text-align: center;
        outline: none;
        padding: 0;
        transition: background 0.2s ease;
        border-radius: 8px;
    }

    .time-input:not(:disabled):hover {
        background: var(--bg-input);
    }

    .time-input:not(:disabled):focus {
        background: var(--bg-input);
    }

    .time-input:disabled {
        color: var(--text);
        cursor: default;
    }

    .time-input::-webkit-inner-spin-button,
    .time-input::-webkit-outer-spin-button {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
    }

    .time-input[type=number] {
        -moz-appearance: textfield;
    }

    .time-separator {
        font-weight: 300;
        font-size: 3rem;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--text);
        margin: 0 2px;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 8px;
    }

    button {
        margin: 0;
        padding: 10px 20px;
        font-size: 12px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    button:hover {
        opacity: 0.8;
    }

    .start-btn {
        background: var(--accent);
        color: white;
    }

    .stop-btn {
        background: var(--danger);
        color: white;
    }

    .reset-btn {
        background: var(--bg-input);
        color: var(--text-muted);
    }

    .add-btn {
        background: var(--bg-card);
        color: var(--text-muted);
        padding: 12px 24px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .add-btn:hover {
        color: var(--text);
        border-color: var(--border-hover);
        background: var(--bg-card-hover);
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: var(--star-inactive);
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 480px) {
        .add-btn {
            width: 100%;
            max-width: 280px;
            padding: 14px 20px;
        }

        #countdownContainer {
            padding: 0 10px;
        }

        .countdown {
            min-width: 100%;
            padding: 25px 20px;
        }

        .time-input {
            font-size: 2.2rem;
            width: 45px;
        }

        .time-separator {
            font-size: 2.2rem;
        }

        .buttons {
            flex-wrap: wrap;
        }

        .buttons button {
            flex: 1;
            min-width: 80px;
        }
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
