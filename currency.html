<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Currency Converter</h1>

    <div class="currency-app">
        <div class="converter-card">
            <div class="input-section">
                <div class="currency-input">
                    <label>Amount</label>
                    <input type="number" id="amount" value="1" min="0" step="any">
                </div>
                <div class="currency-select">
                    <label>From</label>
                    <select id="fromCurrency"></select>
                </div>
            </div>

            <button class="swap-btn" id="swapBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="17 1 21 5 17 9"></polyline>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                    <polyline points="7 23 3 19 7 15"></polyline>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
            </button>

            <div class="input-section">
                <div class="currency-select">
                    <label>To</label>
                    <select id="toCurrency"></select>
                </div>
                <div class="result-display">
                    <label>Converted</label>
                    <div class="result-value" id="result">0.00</div>
                </div>
            </div>
        </div>

        <div class="rate-info">
            <span id="rateDisplay">1 USD = 1.00 USD</span>
            <span class="update-time" id="updateTime">Using offline rates</span>
        </div>

        <div class="popular-currencies">
            <h3>Quick Convert</h3>
            <div class="quick-rates" id="quickRates"></div>
        </div>
    </div>

<script>
// Fallback rates (approximate, for offline use)
const fallbackRates = {
    USD: 1, EUR: 0.92, GBP: 0.79, JPY: 149.50, CAD: 1.36, AUD: 1.53,
    CHF: 0.88, CNY: 7.24, INR: 83.12, MXN: 17.15, BRL: 4.97, KRW: 1320,
    SGD: 1.34, HKD: 7.82, NOK: 10.65, SEK: 10.42, DKK: 6.87, NZD: 1.64,
    ZAR: 18.65, RUB: 91.50, TRY: 32.15, PLN: 3.98, THB: 35.50, IDR: 15650,
    MYR: 4.72, PHP: 56.20, CZK: 22.85, ILS: 3.67, AED: 3.67, SAR: 3.75
};

const currencyNames = {
    USD: 'US Dollar', EUR: 'Euro', GBP: 'British Pound', JPY: 'Japanese Yen',
    CAD: 'Canadian Dollar', AUD: 'Australian Dollar', CHF: 'Swiss Franc',
    CNY: 'Chinese Yuan', INR: 'Indian Rupee', MXN: 'Mexican Peso',
    BRL: 'Brazilian Real', KRW: 'South Korean Won', SGD: 'Singapore Dollar',
    HKD: 'Hong Kong Dollar', NOK: 'Norwegian Krone', SEK: 'Swedish Krona',
    DKK: 'Danish Krone', NZD: 'New Zealand Dollar', ZAR: 'South African Rand',
    RUB: 'Russian Ruble', TRY: 'Turkish Lira', PLN: 'Polish Zloty',
    THB: 'Thai Baht', IDR: 'Indonesian Rupiah', MYR: 'Malaysian Ringgit',
    PHP: 'Philippine Peso', CZK: 'Czech Koruna', ILS: 'Israeli Shekel',
    AED: 'UAE Dirham', SAR: 'Saudi Riyal'
};

let rates = { ...fallbackRates };

const fromSelect = document.getElementById('fromCurrency');
const toSelect = document.getElementById('toCurrency');
const amountInput = document.getElementById('amount');
const resultDisplay = document.getElementById('result');
const rateDisplay = document.getElementById('rateDisplay');
const updateTime = document.getElementById('updateTime');
const quickRates = document.getElementById('quickRates');

// Populate selects
Object.keys(currencyNames).forEach(code => {
    const option1 = new Option(`${code} - ${currencyNames[code]}`, code);
    const option2 = new Option(`${code} - ${currencyNames[code]}`, code);
    fromSelect.add(option1);
    toSelect.add(option2);
});

fromSelect.value = 'USD';
toSelect.value = 'EUR';

function convert() {
    const amount = parseFloat(amountInput.value) || 0;
    const from = fromSelect.value;
    const to = toSelect.value;

    const fromRate = rates[from];
    const toRate = rates[to];

    const result = (amount / fromRate) * toRate;
    resultDisplay.textContent = result.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 4
    });

    const rate = toRate / fromRate;
    rateDisplay.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;

    updateQuickRates();
}

function updateQuickRates() {
    const from = fromSelect.value;
    const amount = parseFloat(amountInput.value) || 1;
    const fromRate = rates[from];

    const popular = ['USD', 'EUR', 'GBP', 'JPY', 'CAD', 'AUD'].filter(c => c !== from);

    quickRates.innerHTML = popular.map(code => {
        const rate = rates[code] / fromRate;
        const converted = amount * rate;
        return `
            <div class="quick-rate" data-to="${code}">
                <span class="quick-code">${code}</span>
                <span class="quick-value">${converted.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
            </div>
        `;
    }).join('');

    document.querySelectorAll('.quick-rate').forEach(el => {
        el.addEventListener('click', () => {
            toSelect.value = el.dataset.to;
            convert();
        });
    });
}

// Try to fetch live rates
async function fetchRates() {
    try {
        // Using exchangerate.host free API
        const response = await fetch('https://api.exchangerate.host/latest?base=USD');
        const data = await response.json();
        if (data.rates) {
            rates = data.rates;
            rates.USD = 1;
            updateTime.textContent = `Updated: ${new Date().toLocaleTimeString()}`;
            convert();
        }
    } catch (e) {
        console.log('Using offline rates');
    }
}

document.getElementById('swapBtn').addEventListener('click', () => {
    const temp = fromSelect.value;
    fromSelect.value = toSelect.value;
    toSelect.value = temp;
    convert();
});

amountInput.addEventListener('input', convert);
fromSelect.addEventListener('change', convert);
toSelect.addEventListener('change', convert);

// Initialize
convert();
fetchRates();
</script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body[data-theme="dark"] {
        --bg: #0f0f0f; --bg-card: #1a1a1a; --bg-card-hover: #1e1e1e;
        --bg-input: #252525; --border: #2a2a2a; --border-hover: #333;
        --text: #fff; --text-secondary: #ddd; --text-muted: #888;
        --text-subtle: #555; --accent: #2ecc71; --accent-hover: #27ae60;
        --star: #f39c12; --star-inactive: #333;
    }
    body[data-theme="light"] {
        --bg: #f5f5f7; --bg-card: #ffffff; --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2; --border: #d1d5db; --border-hover: #14b8a6;
        --text: #111827; --text-secondary: #1f2937; --text-muted: #4b5563;
        --text-subtle: #6b7280; --accent: #0d9488; --accent-hover: #0f766e;
        --star: #f59e0b; --star-inactive: #d1d5db;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--text); text-align: center;
        padding: 60px 20px; min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
    }
    .theme-toggle {
        position: fixed; top: 20px; right: 20px; width: 44px; height: 44px;
        border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card);
        color: var(--text-muted); cursor: pointer; display: flex; align-items: center;
        justify-content: center; transition: all 0.2s ease; z-index: 100;
    }
    .theme-toggle:hover { border-color: var(--border-hover); color: var(--text); }
    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }
    h1 {
        margin-bottom: 40px; font-size: 1.5rem; font-weight: 400;
        letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted);
    }
    .currency-app {
        max-width: 450px; margin: 0 auto;
    }
    .converter-card {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 16px; padding: 25px;
    }
    .input-section {
        display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        margin-bottom: 15px;
    }
    .input-section:last-of-type { margin-bottom: 0; margin-top: 15px; }
    .currency-input, .currency-select, .result-display { text-align: left; }
    .currency-input label, .currency-select label, .result-display label {
        display: block; font-size: 10px; text-transform: uppercase;
        letter-spacing: 1px; color: var(--text-subtle); margin-bottom: 8px;
    }
    .currency-input input {
        width: 100%; padding: 14px; font-size: 18px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input); border: 1px solid var(--border);
        border-radius: 10px; color: var(--text); outline: none;
    }
    .currency-input input:focus { border-color: var(--accent); }
    .currency-select select {
        width: 100%; padding: 14px; font-size: 14px;
        background: var(--bg-input); border: 1px solid var(--border);
        border-radius: 10px; color: var(--text); cursor: pointer; outline: none;
    }
    .currency-select select:focus { border-color: var(--accent); }
    .result-display .result-value {
        padding: 14px; font-size: 18px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input); border-radius: 10px;
        color: var(--accent); font-weight: 500;
    }
    .swap-btn {
        width: 44px; height: 44px; border-radius: 50%;
        background: var(--accent); border: none;
        color: white; cursor: pointer; margin: 0 auto;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s ease;
    }
    .swap-btn:hover { background: var(--accent-hover); transform: rotate(180deg); }
    .rate-info {
        margin-top: 20px; padding: 15px; background: var(--bg-card);
        border: 1px solid var(--border); border-radius: 12px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .rate-info span:first-child {
        font-size: 14px; font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--text-secondary);
    }
    .update-time { font-size: 11px; color: var(--text-subtle); }
    .popular-currencies {
        margin-top: 25px; background: var(--bg-card);
        border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    }
    .popular-currencies h3 {
        font-size: 11px; font-weight: 500; text-transform: uppercase;
        letter-spacing: 1px; color: var(--text-muted); margin-bottom: 15px;
    }
    .quick-rates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .quick-rate {
        background: var(--bg-input); border-radius: 10px; padding: 12px;
        cursor: pointer; transition: all 0.2s ease;
    }
    .quick-rate:hover { background: var(--bg-card-hover); border: 1px solid var(--accent); }
    .quick-code {
        display: block; font-size: 12px; font-weight: 500;
        color: var(--text-muted); margin-bottom: 4px;
    }
    .quick-value {
        display: block; font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace; color: var(--text);
    }
    .back-btn {
        position: fixed; top: 20px; left: 20px; padding: 8px 16px; font-size: 12px;
        color: var(--text-subtle); text-decoration: none; background: var(--bg-card);
        border: 1px solid var(--border); border-radius: 8px;
        transition: all 0.2s ease; z-index: 100;
    }
    .back-btn:hover { color: var(--text); }
    .rating-footer {
        max-width: 900px; margin: 60px auto 0; padding-top: 30px;
        border-top: 1px solid var(--border); text-align: center;
    }
    .rating-section { margin: 0; }
    .rating-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-subtle); margin-bottom: 8px; }
    .stars { display: inline-flex; gap: 4px; }
    .star { font-size: 20px; color: var(--star-inactive); cursor: pointer; transition: color 0.2s ease, transform 0.1s ease; }
    .star:hover { transform: scale(1.1); }
    .star.active { color: var(--star); }
    .rating-thanks { display: block; margin-top: 8px; font-size: 11px; color: var(--accent); }
    @media (max-width: 600px) {
        body { padding: 60px 16px 30px; }
        .theme-toggle { top: 12px; right: 12px; width: 40px; height: 40px; }
        h1 { font-size: 1.2rem; margin-bottom: 25px; }
        .back-btn { top: 12px; left: 12px; padding: 6px 12px; font-size: 11px; }
        .input-section { grid-template-columns: 1fr; }
        .quick-rates { grid-template-columns: repeat(2, 1fr); }
    }
</style>

    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
(function() {
    const pageId = window.location.pathname; const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star'); const thanksEl = document.getElementById('ratingThanks');
    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) { showRating(parseInt(existingRating)); thanksEl.textContent = 'Thanks for rating!'; }
    function showRating(rating) { stars.forEach((star, index) => { star.classList.toggle('active', index < rating); }); }
    stars.forEach((star, index) => { star.addEventListener('mouseenter', () => { if (!localStorage.getItem(storageKey)) showRating(index + 1); }); });
    document.getElementById('stars').addEventListener('mouseleave', () => { if (!localStorage.getItem(storageKey)) showRating(0); else showRating(parseInt(localStorage.getItem(storageKey))); });
    stars.forEach(star => { star.addEventListener('click', () => { if (localStorage.getItem(storageKey)) return; const rating = parseInt(star.dataset.value); localStorage.setItem(storageKey, rating); showRating(rating); thanksEl.textContent = 'Thanks for rating!'; fetch('https://formspree.io/f/xjgevpap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: pageId, rating: rating, timestamp: new Date().toISOString() }) }).catch(() => {}); }); });
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
