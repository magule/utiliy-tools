<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff Checker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Diff Checker</h1>

    <div class="checker">
        <div class="inputs">
            <div class="input-panel">
                <div class="panel-header">
                    <span>Original</span>
                    <button class="clear-btn" data-target="original">Clear</button>
                </div>
                <textarea id="original" placeholder="Paste original text..."></textarea>
            </div>
            <div class="input-panel">
                <div class="panel-header">
                    <span>Changed</span>
                    <button class="clear-btn" data-target="changed">Clear</button>
                </div>
                <textarea id="changed" placeholder="Paste changed text..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" id="compareBtn">Compare</button>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat">
                <span class="stat-value added" id="addedCount">0</span>
                <span class="stat-label">Added</span>
            </div>
            <div class="stat">
                <span class="stat-value removed" id="removedCount">0</span>
                <span class="stat-label">Removed</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="unchangedCount">0</span>
                <span class="stat-label">Unchanged</span>
            </div>
        </div>

        <div class="diff-output" id="diffOutput"></div>
    </div>

<script>
    const original = document.getElementById('original');
    const changed = document.getElementById('changed');
    const compareBtn = document.getElementById('compareBtn');
    const diffOutput = document.getElementById('diffOutput');
    const stats = document.getElementById('stats');
    const addedCount = document.getElementById('addedCount');
    const removedCount = document.getElementById('removedCount');
    const unchangedCount = document.getElementById('unchangedCount');

    document.querySelectorAll('.clear-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById(btn.dataset.target).value = '';
        });
    });

    function diff(oldText, newText) {
        const oldLines = oldText.split('\n');
        const newLines = newText.split('\n');

        // Simple LCS-based diff
        const m = oldLines.length;
        const n = newLines.length;

        // Build LCS table
        const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                if (oldLines[i - 1] === newLines[j - 1]) {
                    dp[i][j] = dp[i - 1][j - 1] + 1;
                } else {
                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                }
            }
        }

        // Backtrack to find diff
        const result = [];
        let i = m, j = n;

        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && oldLines[i - 1] === newLines[j - 1]) {
                result.unshift({ type: 'unchanged', line: oldLines[i - 1] });
                i--; j--;
            } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                result.unshift({ type: 'added', line: newLines[j - 1] });
                j--;
            } else if (i > 0) {
                result.unshift({ type: 'removed', line: oldLines[i - 1] });
                i--;
            }
        }

        return result;
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    compareBtn.addEventListener('click', () => {
        const result = diff(original.value, changed.value);

        let added = 0, removed = 0, unchanged = 0;

        const html = result.map((item, idx) => {
            const lineNum = idx + 1;
            const escapedLine = escapeHtml(item.line) || '&nbsp;';

            if (item.type === 'added') {
                added++;
                return `<div class="diff-line added"><span class="line-num">+</span><span class="line-content">${escapedLine}</span></div>`;
            } else if (item.type === 'removed') {
                removed++;
                return `<div class="diff-line removed"><span class="line-num">-</span><span class="line-content">${escapedLine}</span></div>`;
            } else {
                unchanged++;
                return `<div class="diff-line"><span class="line-num">${lineNum}</span><span class="line-content">${escapedLine}</span></div>`;
            }
        }).join('');

        diffOutput.innerHTML = html || '<div class="no-diff">No differences found</div>';

        addedCount.textContent = added;
        removedCount.textContent = removed;
        unchangedCount.textContent = unchanged;

        stats.style.display = 'flex';
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .checker {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 25px;
        max-width: 900px;
        margin: 0 auto;
    }

    .inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
    }

    .input-panel {
        background: var(--bg-input);
        border-radius: 10px;
        overflow: hidden;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
        border-bottom: 1px solid #333;
    }

    .panel-header span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
    }

    .clear-btn {
        padding: 4px 10px;
        font-size: 10px;
        background: #333;
        border: none;
        border-radius: 4px;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
    }

    .clear-btn:hover {
        background: #444;
        color: var(--text);
    }

    textarea {
        width: 100%;
        height: 200px;
        padding: 15px;
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        line-height: 1.5;
        background: transparent;
        border: none;
        color: var(--text);
        outline: none;
        resize: none;
    }

    textarea::placeholder {
        color: var(--text-subtle);
    }

    .actions {
        margin-bottom: 20px;
    }

    .action-btn {
        width: 100%;
        padding: 14px;
        font-size: 12px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 10px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .action-btn:hover {
        opacity: 0.9;
    }

    .stats {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-bottom: 20px;
    }

    .stat {
        text-align: center;
    }

    .stat-value {
        display: block;
        font-size: 1.5rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--text-muted);
    }

    .stat-value.added {
        color: var(--accent);
    }

    .stat-value.removed {
        color: var(--danger);
    }

    .stat-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
    }

    .diff-output {
        background: var(--bg-input);
        border-radius: 10px;
        max-height: 400px;
        overflow-y: auto;
        text-align: left;
    }

    .no-diff {
        padding: 30px;
        text-align: center;
        color: var(--text-subtle);
    }

    .diff-line {
        display: flex;
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 12px;
        line-height: 1.6;
        border-bottom: 1px solid #333;
    }

    .diff-line:last-child {
        border-bottom: none;
    }

    .diff-line.added {
        background: rgba(46, 204, 113, 0.1);
    }

    .diff-line.removed {
        background: rgba(231, 76, 60, 0.1);
    }

    .line-num {
        min-width: 40px;
        padding: 8px 12px;
        text-align: right;
        color: var(--text-subtle);
        background: rgba(0,0,0,0.2);
        user-select: none;
    }

    .diff-line.added .line-num {
        color: var(--accent);
    }

    .diff-line.removed .line-num {
        color: var(--danger);
    }

    .line-content {
        flex: 1;
        padding: 8px 15px;
        color: #ccc;
        white-space: pre-wrap;
        word-break: break-all;
    }

    .diff-line.added .line-content {
        color: var(--accent);
    }

    .diff-line.removed .line-content {
        color: var(--danger);
        text-decoration: line-through;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    @media (max-width: 768px) {
        .inputs {
            grid-template-columns: 1fr;
        }
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>


<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
