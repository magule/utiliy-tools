<!DOCTYPE html>
<html>
<head>
    <title>HTML Entity Encoder</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>HTML Entity Encoder</h1>

    <div class="converter">
        <div class="input-section">
            <div class="section-header">
                <span>Input</span>
            </div>
            <textarea id="input" placeholder="Enter text to encode/decode..."></textarea>
        </div>

        <div class="actions">
            <button class="action-btn" id="encodeBtn">Encode</button>
            <button class="action-btn" id="decodeBtn">Decode</button>
        </div>

        <div class="output-section">
            <div class="section-header">
                <span>Output</span>
                <button class="copy-btn" id="copyBtn">Copy</button>
            </div>
            <textarea id="output" readonly></textarea>
        </div>

        <div class="reference">
            <div class="section-header">
                <span>Common Entities</span>
            </div>
            <div class="entities-grid">
                <div class="entity" data-char="&lt;">&lt; <span>&amp;lt;</span></div>
                <div class="entity" data-char="&gt;">&gt; <span>&amp;gt;</span></div>
                <div class="entity" data-char="&amp;">&amp; <span>&amp;amp;</span></div>
                <div class="entity" data-char="&quot;">&quot; <span>&amp;quot;</span></div>
                <div class="entity" data-char="&apos;">&apos; <span>&amp;apos;</span></div>
                <div class="entity" data-char="&nbsp;">  <span>&amp;nbsp;</span></div>
                <div class="entity" data-char="&copy;">© <span>&amp;copy;</span></div>
                <div class="entity" data-char="&reg;">® <span>&amp;reg;</span></div>
                <div class="entity" data-char="&trade;">™ <span>&amp;trade;</span></div>
                <div class="entity" data-char="&euro;">€ <span>&amp;euro;</span></div>
                <div class="entity" data-char="&pound;">£ <span>&amp;pound;</span></div>
                <div class="entity" data-char="&yen;">¥ <span>&amp;yen;</span></div>
            </div>
        </div>
    </div>

<script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const encodeBtn = document.getElementById('encodeBtn');
    const decodeBtn = document.getElementById('decodeBtn');
    const copyBtn = document.getElementById('copyBtn');

    const entities = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&apos;',
        '©': '&copy;',
        '®': '&reg;',
        '™': '&trade;',
        '€': '&euro;',
        '£': '&pound;',
        '¥': '&yen;',
        '¢': '&cent;',
        '§': '&sect;',
        '°': '&deg;',
        '±': '&plusmn;',
        '²': '&sup2;',
        '³': '&sup3;',
        '·': '&middot;',
        '¶': '&para;',
        '½': '&frac12;',
        '¼': '&frac14;',
        '¾': '&frac34;',
        '×': '&times;',
        '÷': '&divide;',
        '←': '&larr;',
        '→': '&rarr;',
        '↑': '&uarr;',
        '↓': '&darr;',
        '♠': '&spades;',
        '♣': '&clubs;',
        '♥': '&hearts;',
        '♦': '&diams;'
    };

    const reverseEntities = {};
    for (const [char, entity] of Object.entries(entities)) {
        reverseEntities[entity] = char;
    }

    function encode(text) {
        return text.split('').map(char => {
            if (entities[char]) {
                return entities[char];
            }
            const code = char.charCodeAt(0);
            if (code > 127) {
                return '&#' + code + ';';
            }
            return char;
        }).join('');
    }

    function decode(text) {
        // First replace named entities
        let result = text;
        for (const [entity, char] of Object.entries(reverseEntities)) {
            result = result.split(entity).join(char);
        }
        // Then replace numeric entities
        result = result.replace(/&#(\d+);/g, (match, dec) => {
            return String.fromCharCode(parseInt(dec, 10));
        });
        result = result.replace(/&#x([0-9a-fA-F]+);/g, (match, hex) => {
            return String.fromCharCode(parseInt(hex, 16));
        });
        return result;
    }

    encodeBtn.addEventListener('click', () => {
        output.value = encode(input.value);
    });

    decodeBtn.addEventListener('click', () => {
        output.value = decode(input.value);
    });

    copyBtn.addEventListener('click', async () => {
        await navigator.clipboard.writeText(output.value);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1500);
    });

    // Click to copy entity
    document.querySelectorAll('.entity').forEach(el => {
        el.addEventListener('click', async () => {
            const entity = el.querySelector('span').textContent;
            await navigator.clipboard.writeText(entity);
            el.classList.add('copied');
            setTimeout(() => el.classList.remove('copied'), 1000);
        });
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .converter {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        max-width: 600px;
        margin: 0 auto;
        text-align: left;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .section-header span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #555;
    }

    .copy-btn {
        padding: 5px 12px;
        font-size: 10px;
        background: #333;
        border: none;
        border-radius: 4px;
        color: #888;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
    }

    .copy-btn:hover {
        background: #444;
        color: #fff;
    }

    .input-section,
    .output-section {
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        height: 100px;
        padding: 15px;
        font-size: 13px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        line-height: 1.5;
        background: #252525;
        border: 1px solid #333;
        border-radius: 10px;
        color: #fff;
        outline: none;
        resize: vertical;
    }

    textarea:focus {
        border-color: #444;
    }

    textarea::placeholder {
        color: #555;
    }

    #output {
        color: #2ecc71;
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .action-btn {
        flex: 1;
        padding: 14px;
        font-size: 12px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 10px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .action-btn:hover {
        opacity: 0.9;
    }

    .reference {
        background: #252525;
        border-radius: 10px;
        padding: 15px;
    }

    .entities-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 10px;
    }

    .entity {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
    }

    .entity:hover {
        border-color: #555;
    }

    .entity.copied {
        background: #2ecc71;
        border-color: #2ecc71;
    }

    .entity span {
        display: block;
        font-size: 9px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #666;
        margin-top: 4px;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
