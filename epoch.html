<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epoch Converter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Epoch Converter</h1>

    <div class="converter">
        <div class="current-time">
            <div class="current-label">Current Unix Timestamp</div>
            <div class="current-value" id="currentTime">0</div>
            <button class="copy-btn" id="copyCurrentBtn">Copy</button>
        </div>

        <div class="section">
            <div class="section-header">
                <span>Timestamp to Date</span>
            </div>
            <div class="input-row">
                <input type="number" id="timestampInput" placeholder="Enter Unix timestamp...">
                <select id="timestampUnit">
                    <option value="s">Seconds</option>
                    <option value="ms">Milliseconds</option>
                </select>
            </div>
            <div class="result" id="timestampResult"></div>
        </div>

        <div class="section">
            <div class="section-header">
                <span>Date to Timestamp</span>
            </div>
            <div class="date-inputs">
                <input type="date" id="dateInput">
                <input type="time" id="timeInput" step="1">
            </div>
            <div class="result" id="dateResult"></div>
        </div>

        <div class="formats" id="formats" style="display: none;">
            <div class="section-header">
                <span>Date Formats</span>
            </div>
            <div class="formats-list" id="formatsList"></div>
        </div>
    </div>

<script>
    const currentTimeEl = document.getElementById('currentTime');
    const copyCurrentBtn = document.getElementById('copyCurrentBtn');
    const timestampInput = document.getElementById('timestampInput');
    const timestampUnit = document.getElementById('timestampUnit');
    const timestampResult = document.getElementById('timestampResult');
    const dateInput = document.getElementById('dateInput');
    const timeInput = document.getElementById('timeInput');
    const dateResult = document.getElementById('dateResult');
    const formats = document.getElementById('formats');
    const formatsList = document.getElementById('formatsList');

    // Update current time
    function updateCurrentTime() {
        currentTimeEl.textContent = Math.floor(Date.now() / 1000);
    }
    updateCurrentTime();
    setInterval(updateCurrentTime, 1000);

    copyCurrentBtn.addEventListener('click', async () => {
        await navigator.clipboard.writeText(currentTimeEl.textContent);
        copyCurrentBtn.textContent = 'Copied!';
        setTimeout(() => copyCurrentBtn.textContent = 'Copy', 1500);
    });

    // Set default date/time to now
    const now = new Date();
    dateInput.value = now.toISOString().split('T')[0];
    timeInput.value = now.toTimeString().split(' ')[0];

    function showFormats(date) {
        const formatOptions = [
            { label: 'ISO 8601', value: date.toISOString() },
            { label: 'UTC', value: date.toUTCString() },
            { label: 'Local', value: date.toString() },
            { label: 'Date only', value: date.toLocaleDateString() },
            { label: 'Time only', value: date.toLocaleTimeString() },
            { label: 'Relative', value: getRelativeTime(date) }
        ];

        formatsList.innerHTML = formatOptions.map(f => `
            <div class="format-item">
                <span class="format-label">${f.label}</span>
                <span class="format-value">${f.value}</span>
            </div>
        `).join('');

        formats.style.display = 'block';
    }

    function getRelativeTime(date) {
        const now = new Date();
        const diff = now - date;
        const absDiff = Math.abs(diff);
        const isFuture = diff < 0;

        const seconds = Math.floor(absDiff / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);
        const months = Math.floor(days / 30);
        const years = Math.floor(days / 365);

        let unit, value;
        if (years > 0) { value = years; unit = 'year'; }
        else if (months > 0) { value = months; unit = 'month'; }
        else if (days > 0) { value = days; unit = 'day'; }
        else if (hours > 0) { value = hours; unit = 'hour'; }
        else if (minutes > 0) { value = minutes; unit = 'minute'; }
        else { value = seconds; unit = 'second'; }

        const plural = value !== 1 ? 's' : '';
        if (isFuture) {
            return `in ${value} ${unit}${plural}`;
        }
        return `${value} ${unit}${plural} ago`;
    }

    timestampInput.addEventListener('input', () => {
        const ts = parseInt(timestampInput.value);
        if (isNaN(ts)) {
            timestampResult.innerHTML = '';
            formats.style.display = 'none';
            return;
        }

        const ms = timestampUnit.value === 's' ? ts * 1000 : ts;
        const date = new Date(ms);

        if (isNaN(date.getTime())) {
            timestampResult.innerHTML = '<span class="error">Invalid timestamp</span>';
            formats.style.display = 'none';
            return;
        }

        timestampResult.innerHTML = `
            <span class="date-output">${date.toLocaleString()}</span>
        `;

        showFormats(date);
    });

    timestampUnit.addEventListener('change', () => {
        timestampInput.dispatchEvent(new Event('input'));
    });

    function updateDateResult() {
        if (!dateInput.value || !timeInput.value) return;

        const date = new Date(`${dateInput.value}T${timeInput.value}`);

        if (isNaN(date.getTime())) {
            dateResult.innerHTML = '<span class="error">Invalid date</span>';
            return;
        }

        const seconds = Math.floor(date.getTime() / 1000);
        const ms = date.getTime();

        dateResult.innerHTML = `
            <div class="timestamp-output">
                <span class="ts-label">Seconds</span>
                <span class="ts-value">${seconds}</span>
            </div>
            <div class="timestamp-output">
                <span class="ts-label">Milliseconds</span>
                <span class="ts-value">${ms}</span>
            </div>
        `;
    }

    dateInput.addEventListener('input', updateDateResult);
    timeInput.addEventListener('input', updateDateResult);
    updateDateResult();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .converter {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 500px;
        margin: 0 auto;
        text-align: left;
    }

    .current-time {
        background: var(--bg-input);
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        margin-bottom: 25px;
    }

    .current-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 10px;
    }

    .current-value {
        font-size: 2.5rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--accent);
        margin-bottom: 15px;
    }

    .copy-btn {
        padding: 8px 16px;
        font-size: 10px;
        background: #333;
        border: none;
        border-radius: 6px;
        color: var(--text-muted);
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
    }

    .copy-btn:hover {
        background: #444;
        color: var(--text);
    }

    .section {
        margin-bottom: 25px;
    }

    .section-header {
        margin-bottom: 10px;
    }

    .section-header span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
    }

    .input-row {
        display: flex;
        gap: 10px;
    }

    .input-row input {
        flex: 1;
    }

    input, select {
        padding: 12px 15px;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        outline: none;
    }

    input:focus, select:focus {
        border-color: var(--text-subtle);
    }

    select {
        cursor: pointer;
    }

    .date-inputs {
        display: flex;
        gap: 10px;
    }

    .date-inputs input {
        flex: 1;
    }

    .result {
        margin-top: 15px;
    }

    .date-output {
        display: block;
        padding: 15px;
        background: var(--bg-input);
        border-radius: 8px;
        font-size: 14px;
        color: var(--accent);
        font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .timestamp-output {

        justify-content: space-between;
        padding: 12px 15px;
        background: var(--bg-input);
        border-radius: 8px;
        margin-bottom: 8px;

    }

    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {

        margin: 0;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
