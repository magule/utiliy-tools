<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Generator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Favicon Generator</h1>

    <div class="favicon-app">
        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p>Drop an image here or click to upload</p>
            <span>PNG, JPG, SVG recommended</span>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
            <h2>Preview</h2>
            <div class="preview-grid">
                <div class="preview-item">
                    <canvas id="preview16" width="16" height="16"></canvas>
                    <span>16×16</span>
                </div>
                <div class="preview-item">
                    <canvas id="preview32" width="32" height="32"></canvas>
                    <span>32×32</span>
                </div>
                <div class="preview-item">
                    <canvas id="preview48" width="48" height="48"></canvas>
                    <span>48×48</span>
                </div>
                <div class="preview-item large">
                    <canvas id="preview180" width="180" height="180"></canvas>
                    <span>180×180 (Apple)</span>
                </div>
            </div>

            <div class="options">
                <label class="checkbox-row">
                    <input type="checkbox" id="roundCorners">
                    <span>Round corners</span>
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" id="addPadding">
                    <span>Add padding</span>
                </label>
            </div>

            <div class="download-buttons">
                <button class="download-btn" data-size="16">Download 16×16</button>
                <button class="download-btn" data-size="32">Download 32×32</button>
                <button class="download-btn" data-size="48">Download 48×48</button>
                <button class="download-btn primary" data-size="ico">Download .ICO</button>
                <button class="download-btn" data-size="180">Download 180×180</button>
                <button class="download-btn" data-size="all">Download All</button>
            </div>
        </div>
    </div>

<script>
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const previewSection = document.getElementById('previewSection');
const roundCorners = document.getElementById('roundCorners');
const addPadding = document.getElementById('addPadding');

let originalImage = null;

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        loadImage(file);
    }
});

fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) {
        loadImage(e.target.files[0]);
    }
});

function loadImage(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            originalImage = img;
            generatePreviews();
            previewSection.style.display = 'block';
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function generatePreviews() {
    if (!originalImage) return;

    const sizes = [16, 32, 48, 180];
    sizes.forEach(size => {
        const canvas = document.getElementById(`preview${size}`);
        drawFavicon(canvas, size);
    });
}

function drawFavicon(canvas, size) {
    const ctx = canvas.getContext('2d');
    const padding = addPadding.checked ? size * 0.1 : 0;
    const drawSize = size - padding * 2;

    ctx.clearRect(0, 0, size, size);

    if (roundCorners.checked) {
        const radius = size * 0.2;
        ctx.beginPath();
        ctx.roundRect(0, 0, size, size, radius);
        ctx.clip();
    }

    // Calculate aspect ratio fit
    const scale = Math.min(drawSize / originalImage.width, drawSize / originalImage.height);
    const w = originalImage.width * scale;
    const h = originalImage.height * scale;
    const x = (size - w) / 2;
    const y = (size - h) / 2;

    ctx.drawImage(originalImage, x, y, w, h);
}

roundCorners.addEventListener('change', generatePreviews);
addPadding.addEventListener('change', generatePreviews);

document.querySelectorAll('.download-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const size = btn.dataset.size;

        if (size === 'all') {
            downloadAll();
        } else if (size === 'ico') {
            downloadICO();
        } else {
            downloadPNG(parseInt(size));
        }
    });
});

function downloadPNG(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    drawFavicon(canvas, size);

    const link = document.createElement('a');
    link.download = `favicon-${size}x${size}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function downloadICO() {
    // Create a multi-size ICO by combining 16, 32, 48
    // For simplicity, we'll just download 32x32 as PNG (browsers accept PNG favicons)
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    drawFavicon(canvas, 32);

    const link = document.createElement('a');
    link.download = 'favicon.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function downloadAll() {
    const sizes = [16, 32, 48, 180];
    sizes.forEach((size, i) => {
        setTimeout(() => downloadPNG(size), i * 200);
    });
}
</script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body[data-theme="dark"] {
        --bg: #0f0f0f; --bg-card: #1a1a1a; --bg-card-hover: #1e1e1e;
        --bg-input: #252525; --border: #2a2a2a; --border-hover: #333;
        --text: #fff; --text-secondary: #ddd; --text-muted: #888;
        --text-subtle: #555; --accent: #2ecc71; --accent-hover: #27ae60;
        --danger: #e74c3c; --star: #f39c12; --star-inactive: #333;
    }
    body[data-theme="light"] {
        --bg: #f5f5f7; --bg-card: #ffffff; --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2; --border: #d1d5db; --border-hover: #14b8a6;
        --text: #111827; --text-secondary: #1f2937; --text-muted: #4b5563;
        --text-subtle: #6b7280; --accent: #0d9488; --accent-hover: #0f766e;
        --danger: #dc2626; --star: #f59e0b; --star-inactive: #d1d5db;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--text); text-align: center;
        padding: 60px 20px; min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
    }
    .theme-toggle {
        position: fixed; top: 20px; right: 20px; width: 44px; height: 44px;
        border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card);
        color: var(--text-muted); cursor: pointer; display: flex; align-items: center;
        justify-content: center; transition: all 0.2s ease; z-index: 100;
    }
    .theme-toggle:hover { border-color: var(--border-hover); color: var(--text); }
    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }
    h1 {
        margin-bottom: 40px; font-size: 1.5rem; font-weight: 400;
        letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted);
    }
    .favicon-app {
        background: var(--bg-card); border: 1px solid var(--border);
        border-radius: 16px; padding: 30px; max-width: 500px; margin: 0 auto;
    }
    .upload-area {
        border: 2px dashed var(--border); border-radius: 12px; padding: 40px;
        cursor: pointer; transition: all 0.2s ease; color: var(--text-muted);
    }
    .upload-area:hover, .upload-area.dragover {
        border-color: var(--accent); color: var(--accent);
    }
    .upload-area svg { margin-bottom: 15px; }
    .upload-area p { font-size: 14px; margin-bottom: 5px; }
    .upload-area span { font-size: 11px; color: var(--text-subtle); }
    .preview-section h2 {
        font-size: 12px; font-weight: 500; text-transform: uppercase;
        letter-spacing: 2px; color: var(--text-muted); margin: 25px 0 20px;
    }
    .preview-grid {
        display: flex; justify-content: center; align-items: flex-end;
        gap: 20px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .preview-item { text-align: center; }
    .preview-item canvas {
        background: var(--bg-input); border-radius: 4px;
        image-rendering: pixelated;
    }
    .preview-item.large canvas { border-radius: 20px; }
    .preview-item span {
        display: block; font-size: 10px; color: var(--text-subtle);
        margin-top: 8px; text-transform: uppercase; letter-spacing: 1px;
    }
    .options { margin-bottom: 20px; }
    .checkbox-row {
        display: inline-flex; align-items: center; gap: 8px;
        margin: 0 10px; font-size: 13px; color: var(--text-muted); cursor: pointer;
    }
    .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
    .download-buttons {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .download-btn {
        padding: 12px; font-size: 11px; font-weight: 500; text-transform: uppercase;
        letter-spacing: 1px; background: var(--bg-input); border: 1px solid var(--border);
        border-radius: 8px; color: var(--text-muted); cursor: pointer;
        transition: all 0.2s ease;
    }
    .download-btn:hover { border-color: var(--accent); color: var(--text); }
    .download-btn.primary {
        background: var(--accent); border-color: var(--accent); color: white;
    }
    .download-btn.primary:hover { background: var(--accent-hover); }
    .back-btn {
        position: fixed; top: 20px; left: 20px; padding: 8px 16px; font-size: 12px;
        color: var(--text-subtle); text-decoration: none; background: var(--bg-card);
        border: 1px solid var(--border); border-radius: 8px;
        transition: all 0.2s ease; z-index: 100;
    }
    .back-btn:hover { color: var(--text); border-color: var(--border); }
    .rating-footer {
        max-width: 900px; margin: 60px auto 0; padding-top: 30px;
        border-top: 1px solid var(--border); text-align: center;
    }
    .rating-section { margin: 0; }
    .rating-label {
        display: block; font-size: 10px; text-transform: uppercase;
        letter-spacing: 1px; color: var(--text-subtle); margin-bottom: 8px;
    }
    .stars { display: inline-flex; gap: 4px; }
    .star {
        font-size: 20px; color: var(--star-inactive); cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }
    .star:hover { transform: scale(1.1); }
    .star.active { color: var(--star); }
    .rating-thanks { display: block; margin-top: 8px; font-size: 11px; color: var(--accent); }
    @media (max-width: 600px) {
        body { padding: 60px 16px 30px; }
        .theme-toggle { top: 12px; right: 12px; width: 40px; height: 40px; }
        h1 { font-size: 1.2rem; margin-bottom: 25px; }
        .back-btn { top: 12px; left: 12px; padding: 6px 12px; font-size: 11px; }
        .download-buttons { grid-template-columns: repeat(2, 1fr); }
    }
</style>

    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');
    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) { showRating(parseInt(existingRating)); thanksEl.textContent = 'Thanks for rating!'; }
    function showRating(rating) { stars.forEach((star, index) => { star.classList.toggle('active', index < rating); }); }
    stars.forEach((star, index) => { star.addEventListener('mouseenter', () => { if (!localStorage.getItem(storageKey)) showRating(index + 1); }); });
    document.getElementById('stars').addEventListener('mouseleave', () => { if (!localStorage.getItem(storageKey)) showRating(0); else showRating(parseInt(localStorage.getItem(storageKey))); });
    stars.forEach(star => { star.addEventListener('click', () => { if (localStorage.getItem(storageKey)) return; const rating = parseInt(star.dataset.value); localStorage.setItem(storageKey, rating); showRating(rating); thanksEl.textContent = 'Thanks for rating!'; fetch('https://formspree.io/f/xjgevpap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: pageId, rating: rating, timestamp: new Date().toISOString() }) }).catch(() => {}); }); });
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
