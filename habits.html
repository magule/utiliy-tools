<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Habit Tracker</h1>

    <div class="habit-app">
        <div class="week-nav">
            <button class="nav-btn" id="prevWeek">&larr;</button>
            <span id="weekLabel">This Week</span>
            <button class="nav-btn" id="nextWeek">&rarr;</button>
        </div>

        <div class="habits-container">
            <div class="days-header" id="daysHeader"></div>
            <div id="habitsList"></div>
        </div>

        <div class="add-habit">
            <input type="text" id="habitInput" placeholder="Add new habit...">
            <button id="addHabitBtn">Add</button>
        </div>

        <div class="stats" id="stats"></div>
    </div>

<script>
    let habits = JSON.parse(localStorage.getItem('habits')) || [];
    let completions = JSON.parse(localStorage.getItem('habitCompletions')) || {};
    let currentWeekOffset = 0;

    const habitsList = document.getElementById('habitsList');
    const daysHeader = document.getElementById('daysHeader');
    const weekLabel = document.getElementById('weekLabel');
    const habitInput = document.getElementById('habitInput');
    const addHabitBtn = document.getElementById('addHabitBtn');
    const prevWeekBtn = document.getElementById('prevWeek');
    const nextWeekBtn = document.getElementById('nextWeek');
    const statsEl = document.getElementById('stats');

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function save() {
        localStorage.setItem('habits', JSON.stringify(habits));
        localStorage.setItem('habitCompletions', JSON.stringify(completions));
    }

    function getWeekDates(offset = 0) {
        const today = new Date();
        const startDate = new Date(today);
        startDate.setDate(today.getDate() + (offset * 7));

        const dates = [];
        for (let i = 0; i < 7; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + i);
            dates.push(date);
        }
        return dates;
    }

    function formatDateKey(date) {
        return date.toISOString().split('T')[0];
    }

    function isToday(date) {
        const today = new Date();
        return formatDateKey(date) === formatDateKey(today);
    }

    function updateWeekLabel() {
        const dates = getWeekDates(currentWeekOffset);
        const start = dates[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const end = dates[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        if (currentWeekOffset === 0) {
            weekLabel.textContent = `Today → ${end}`;
        } else {
            weekLabel.textContent = `${start} - ${end}`;
        }
    }

    function renderDaysHeader() {
        const dates = getWeekDates(currentWeekOffset);
        const dayLetters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

        daysHeader.innerHTML = '<div class="habit-name-header">Habit</div>';
        dates.forEach((date) => {
            const div = document.createElement('div');
            div.className = `day-header ${isToday(date) ? 'today' : ''}`;
            div.innerHTML = `
                <span class="day-name">${dayLetters[date.getDay()]}</span>
                <span class="day-num">${date.getDate()}</span>
            `;
            daysHeader.appendChild(div);
        });
    }

    function renderHabits() {
        const dates = getWeekDates(currentWeekOffset);

        habitsList.innerHTML = '';

        if (habits.length === 0) {
            habitsList.innerHTML = '<div class="empty-state">No habits yet. Add one below!</div>';
            return;
        }

        habits.forEach(habit => {
            const row = document.createElement('div');
            row.className = 'habit-row';

            let html = `
                <div class="habit-name">
                    <span>${habit.name}</span>
                    <button class="remove-habit" data-id="${habit.id}">×</button>
                </div>
            `;

            dates.forEach(date => {
                const dateKey = formatDateKey(date);
                const key = `${habit.id}-${dateKey}`;
                const completed = completions[key] || false;

                html += `
                    <div class="day-cell ${isToday(date) ? 'today' : ''}">
                        <label class="checkbox">
                            <input type="checkbox" ${completed ? 'checked' : ''} data-habit="${habit.id}" data-date="${dateKey}">
                            <span class="checkmark"></span>
                        </label>
                    </div>
                `;
            });

            row.innerHTML = html;
            habitsList.appendChild(row);
        });

        updateStats();
    }

    function updateStats() {
        const dates = getWeekDates(currentWeekOffset);
        let total = habits.length * 7;
        let completed = 0;

        habits.forEach(habit => {
            dates.forEach(date => {
                const key = `${habit.id}-${formatDateKey(date)}`;
                if (completions[key]) completed++;
            });
        });

        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
        statsEl.innerHTML = `
            <div class="stat">
                <span class="stat-value">${completed}/${total}</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat">
                <span class="stat-value">${percentage}%</span>
                <span class="stat-label">Success Rate</span>
            </div>
        `;
    }

    function addHabit(name) {
        if (!name.trim()) return;

        habits.push({
            id: generateId(),
            name: name.trim(),
            createdAt: Date.now()
        });

        save();
        renderHabits();
        habitInput.value = '';
    }

    function removeHabit(id) {
        habits = habits.filter(h => h.id !== id);
        // Clean up completions for this habit
        Object.keys(completions).forEach(key => {
            if (key.startsWith(id)) {
                delete completions[key];
            }
        });
        save();
        renderHabits();
    }

    function toggleCompletion(habitId, dateKey) {
        const key = `${habitId}-${dateKey}`;
        completions[key] = !completions[key];
        save();
        updateStats();
    }

    addHabitBtn.addEventListener('click', () => addHabit(habitInput.value));
    habitInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addHabit(habitInput.value);
    });

    habitsList.addEventListener('click', (e) => {
        if (e.target.classList.contains('remove-habit')) {
            removeHabit(e.target.dataset.id);
        }
    });

    habitsList.addEventListener('change', (e) => {
        if (e.target.type === 'checkbox') {
            toggleCompletion(e.target.dataset.habit, e.target.dataset.date);
        }
    });

    prevWeekBtn.addEventListener('click', () => {
        currentWeekOffset--;
        updateWeekLabel();
        renderDaysHeader();
        renderHabits();
    });

    nextWeekBtn.addEventListener('click', () => {
        currentWeekOffset++;
        updateWeekLabel();
        renderDaysHeader();
        renderHabits();
    });

    // Initialize
    updateWeekLabel();
    renderDaysHeader();
    renderHabits();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .habit-app {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 25px;
        max-width: 600px;
        margin: 0 auto;
    }

    .week-nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    .nav-btn {
        width: 36px;
        height: 36px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 50%;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s ease;
    }

    .nav-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    #weekLabel {
        font-size: 13px;
        color: var(--text-muted);
        min-width: 120px;
    }

    .habits-container {
        margin-bottom: 20px;
    }

    .days-header,
    .habit-row {
        display: grid;
        grid-template-columns: 1fr repeat(7, 36px);
        gap: 8px;
        align-items: center;
    }

    .days-header {
        margin-bottom: 10px;
        padding: 0 10px;
    }

    .habit-name-header {
        text-align: left;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
    }

    .day-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 36px;
    }

    .day-header.today {
        color: var(--accent);
        background: var(--accent-soft, rgba(46, 204, 113, 0.15));
        border-radius: 8px;
        padding: 4px 0;
    }

    .day-header.today .day-name {
        color: var(--accent);
        font-weight: 600;
    }

    .day-name {
        font-size: 10px;
        color: var(--text-subtle);
        line-height: 1;
    }

    .day-num {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.2;
    }

    .day-header.today .day-num {
        color: var(--accent);
    }

    .habit-row {
        background: var(--bg-input);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
    }

    .habit-name {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        font-size: 13px;
        color: var(--text-secondary);
        padding-right: 5px;
        min-width: 0;
    }

    .habit-name span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .remove-habit {
        background: transparent;
        border: none;
        color: var(--text-subtle);
        font-size: 18px;
        cursor: pointer;
        padding: 0 5px;
        opacity: 0;
        transition: all 0.2s ease;
    }

    .habit-row:hover .remove-habit {
        opacity: 1;
    }

    .remove-habit:hover {
        color: var(--danger);
    }

    .day-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
    }

    .day-cell.today {
        background: var(--accent-soft, rgba(46, 204, 113, 0.15));
        border-radius: 8px;
    }

    .checkbox {
        position: relative;
        width: 24px;
        height: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .checkbox input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
    }

    .checkmark {
        position: absolute;
        top: 0;
        left: 0;
        width: 24px;
        height: 24px;
        background: var(--bg-card);
        border: 2px solid #444;
        border-radius: 6px;
        transition: all 0.2s ease;
    }

    .checkbox:hover .checkmark {
        border-color: var(--accent);
    }

    .checkbox input:checked ~ .checkmark {
        background: var(--accent);
        border-color: var(--accent);
    }

    .checkbox input:checked ~ .checkmark:after {
        content: '';
        position: absolute;
        left: 50%;
        top: 45%;
        width: 5px;
        height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: translate(-50%, -50%) rotate(45deg);
    }

    .empty-state {
        padding: 30px;
        color: var(--text-subtle);
        font-size: 13px;
    }

    .add-habit {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .add-habit input {
        flex: 1;
        padding: 12px 15px;
        font-size: 13px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        outline: none;
    }

    .add-habit input:focus {
        border-color: var(--accent);
    }

    .add-habit input::placeholder {
        color: var(--text-subtle);
    }

    .add-habit button {
        padding: 12px 20px;
        font-size: 12px;
        font-weight: 500;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .add-habit button:hover {
        background: var(--accent-hover);
    }

    .stats {
        display: flex;
        justify-content: center;
        gap: 30px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .stat {
        text-align: center;
    }

    .stat-value {
        display: block;
        font-size: 1.5rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--accent);
    }

    .stat-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .habit-app {
            padding: 15px;
        }

        .days-header,
        .habit-row {
            grid-template-columns: 1fr repeat(7, 28px);
            gap: 4px;
        }

        .day-header {
            width: 28px;
        }

        .day-cell {
            width: 28px;
            height: 28px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
        }

        .checkmark {
            width: 20px;
            height: 20px;
        }

        .checkbox input:checked ~ .checkmark:after {
            width: 4px;
            height: 8px;
        }

        .habit-name {
            font-size: 12px;
        }

        .add-habit {
            flex-direction: column;
        }

        .add-habit button {
            width: 100%;
        }

        .stats {
            gap: 20px;
        }

        .stat-value {
            font-size: 1.2rem;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }

    @media (max-width: 360px) {
        .days-header,
        .habit-row {
            grid-template-columns: 1fr repeat(7, 24px);
            gap: 3px;
        }

        .day-header {
            width: 24px;
        }

        .day-name {
            font-size: 9px;
        }

        .day-num {
            font-size: 10px;
        }

        .day-cell {
            width: 24px;
            height: 24px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
        }

        .checkmark {
            width: 18px;
            height: 18px;
            border-radius: 4px;
        }

        .checkbox input:checked ~ .checkmark:after {
            width: 3px;
            height: 7px;
        }

        .habit-name {
            font-size: 11px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
