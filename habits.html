<!DOCTYPE html>
<html>
<head>
    <title>Habit Tracker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Habit Tracker</h1>

    <div class="habit-app">
        <div class="week-nav">
            <button class="nav-btn" id="prevWeek">&larr;</button>
            <span id="weekLabel">This Week</span>
            <button class="nav-btn" id="nextWeek">&rarr;</button>
        </div>

        <div class="habits-container">
            <div class="days-header" id="daysHeader"></div>
            <div id="habitsList"></div>
        </div>

        <div class="add-habit">
            <input type="text" id="habitInput" placeholder="Add new habit...">
            <button id="addHabitBtn">Add</button>
        </div>

        <div class="stats" id="stats"></div>
    </div>

<script>
    let habits = JSON.parse(localStorage.getItem('habits')) || [];
    let completions = JSON.parse(localStorage.getItem('habitCompletions')) || {};
    let currentWeekOffset = 0;

    const habitsList = document.getElementById('habitsList');
    const daysHeader = document.getElementById('daysHeader');
    const weekLabel = document.getElementById('weekLabel');
    const habitInput = document.getElementById('habitInput');
    const addHabitBtn = document.getElementById('addHabitBtn');
    const prevWeekBtn = document.getElementById('prevWeek');
    const nextWeekBtn = document.getElementById('nextWeek');
    const statsEl = document.getElementById('stats');

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function save() {
        localStorage.setItem('habits', JSON.stringify(habits));
        localStorage.setItem('habitCompletions', JSON.stringify(completions));
    }

    function getWeekDates(offset = 0) {
        const today = new Date();
        const monday = new Date(today);
        monday.setDate(today.getDate() - today.getDay() + 1 + (offset * 7));

        const dates = [];
        for (let i = 0; i < 7; i++) {
            const date = new Date(monday);
            date.setDate(monday.getDate() + i);
            dates.push(date);
        }
        return dates;
    }

    function formatDateKey(date) {
        return date.toISOString().split('T')[0];
    }

    function isToday(date) {
        const today = new Date();
        return formatDateKey(date) === formatDateKey(today);
    }

    function updateWeekLabel() {
        if (currentWeekOffset === 0) {
            weekLabel.textContent = 'This Week';
        } else if (currentWeekOffset === -1) {
            weekLabel.textContent = 'Last Week';
        } else if (currentWeekOffset === 1) {
            weekLabel.textContent = 'Next Week';
        } else {
            const dates = getWeekDates(currentWeekOffset);
            const start = dates[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const end = dates[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            weekLabel.textContent = `${start} - ${end}`;
        }
    }

    function renderDaysHeader() {
        const dates = getWeekDates(currentWeekOffset);
        const dayNames = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

        daysHeader.innerHTML = '<div class="habit-name-header">Habit</div>';
        dates.forEach((date, i) => {
            const div = document.createElement('div');
            div.className = `day-header ${isToday(date) ? 'today' : ''}`;
            div.innerHTML = `
                <span class="day-name">${dayNames[i]}</span>
                <span class="day-num">${date.getDate()}</span>
            `;
            daysHeader.appendChild(div);
        });
    }

    function renderHabits() {
        const dates = getWeekDates(currentWeekOffset);

        habitsList.innerHTML = '';

        if (habits.length === 0) {
            habitsList.innerHTML = '<div class="empty-state">No habits yet. Add one below!</div>';
            return;
        }

        habits.forEach(habit => {
            const row = document.createElement('div');
            row.className = 'habit-row';

            let html = `
                <div class="habit-name">
                    <span>${habit.name}</span>
                    <button class="remove-habit" data-id="${habit.id}">×</button>
                </div>
            `;

            dates.forEach(date => {
                const dateKey = formatDateKey(date);
                const key = `${habit.id}-${dateKey}`;
                const completed = completions[key] || false;

                html += `
                    <div class="day-cell ${isToday(date) ? 'today' : ''}">
                        <label class="checkbox">
                            <input type="checkbox" ${completed ? 'checked' : ''} data-habit="${habit.id}" data-date="${dateKey}">
                            <span class="checkmark"></span>
                        </label>
                    </div>
                `;
            });

            row.innerHTML = html;
            habitsList.appendChild(row);
        });

        updateStats();
    }

    function updateStats() {
        const dates = getWeekDates(currentWeekOffset);
        let total = habits.length * 7;
        let completed = 0;

        habits.forEach(habit => {
            dates.forEach(date => {
                const key = `${habit.id}-${formatDateKey(date)}`;
                if (completions[key]) completed++;
            });
        });

        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
        statsEl.innerHTML = `
            <div class="stat">
                <span class="stat-value">${completed}/${total}</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat">
                <span class="stat-value">${percentage}%</span>
                <span class="stat-label">Success Rate</span>
            </div>
        `;
    }

    function addHabit(name) {
        if (!name.trim()) return;

        habits.push({
            id: generateId(),
            name: name.trim(),
            createdAt: Date.now()
        });

        save();
        renderHabits();
        habitInput.value = '';
    }

    function removeHabit(id) {
        habits = habits.filter(h => h.id !== id);
        // Clean up completions for this habit
        Object.keys(completions).forEach(key => {
            if (key.startsWith(id)) {
                delete completions[key];
            }
        });
        save();
        renderHabits();
    }

    function toggleCompletion(habitId, dateKey) {
        const key = `${habitId}-${dateKey}`;
        completions[key] = !completions[key];
        save();
        updateStats();
    }

    addHabitBtn.addEventListener('click', () => addHabit(habitInput.value));
    habitInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addHabit(habitInput.value);
    });

    habitsList.addEventListener('click', (e) => {
        if (e.target.classList.contains('remove-habit')) {
            removeHabit(e.target.dataset.id);
        }
    });

    habitsList.addEventListener('change', (e) => {
        if (e.target.type === 'checkbox') {
            toggleCompletion(e.target.dataset.habit, e.target.dataset.date);
        }
    });

    prevWeekBtn.addEventListener('click', () => {
        currentWeekOffset--;
        updateWeekLabel();
        renderDaysHeader();
        renderHabits();
    });

    nextWeekBtn.addEventListener('click', () => {
        currentWeekOffset++;
        updateWeekLabel();
        renderDaysHeader();
        renderHabits();
    });

    // Initialize
    updateWeekLabel();
    renderDaysHeader();
    renderHabits();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .habit-app {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 25px;
        max-width: 600px;
        margin: 0 auto;
    }

    .week-nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
    }

    .nav-btn {
        width: 36px;
        height: 36px;
        background: #252525;
        border: 1px solid #333;
        border-radius: 50%;
        color: #888;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s ease;
    }

    .nav-btn:hover {
        border-color: #444;
        color: #fff;
    }

    #weekLabel {
        font-size: 13px;
        color: #888;
        min-width: 120px;
    }

    .habits-container {
        margin-bottom: 20px;
    }

    .days-header,
    .habit-row {
        display: grid;
        grid-template-columns: 1fr repeat(7, 36px);
        gap: 8px;
        align-items: center;
    }

    .days-header {
        margin-bottom: 10px;
        padding: 0 10px;
    }

    .habit-name-header {
        text-align: left;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
    }

    .day-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 36px;
    }

    .day-header.today {
        color: #2ecc71;
    }

    .day-name {
        font-size: 10px;
        color: #555;
        line-height: 1;
    }

    .day-num {
        font-size: 12px;
        color: #888;
        line-height: 1.2;
    }

    .day-header.today .day-num {
        color: #2ecc71;
    }

    .habit-row {
        background: #252525;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
    }

    .habit-name {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        font-size: 13px;
        color: #ddd;
        padding-right: 5px;
        min-width: 0;
    }

    .habit-name span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .remove-habit {
        background: transparent;
        border: none;
        color: #444;
        font-size: 18px;
        cursor: pointer;
        padding: 0 5px;
        opacity: 0;
        transition: all 0.2s ease;
    }

    .habit-row:hover .remove-habit {
        opacity: 1;
    }

    .remove-habit:hover {
        color: #e74c3c;
    }

    .day-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
    }

    .day-cell.today {
        background: rgba(46, 204, 113, 0.1);
        border-radius: 8px;
    }

    .checkbox {
        position: relative;
        width: 24px;
        height: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .checkbox input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
    }

    .checkmark {
        position: absolute;
        top: 0;
        left: 0;
        width: 24px;
        height: 24px;
        background: #1a1a1a;
        border: 2px solid #444;
        border-radius: 6px;
        transition: all 0.2s ease;
    }

    .checkbox:hover .checkmark {
        border-color: #666;
    }

    .checkbox input:checked ~ .checkmark {
        background: #2ecc71;
        border-color: #2ecc71;
    }

    .checkbox input:checked ~ .checkmark:after {
        content: '';
        position: absolute;
        left: 50%;
        top: 45%;
        width: 5px;
        height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: translate(-50%, -50%) rotate(45deg);
    }

    .empty-state {
        padding: 30px;
        color: #444;
        font-size: 13px;
    }

    .add-habit {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .add-habit input {
        flex: 1;
        padding: 12px 15px;
        font-size: 13px;
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        outline: none;
    }

    .add-habit input:focus {
        border-color: #444;
    }

    .add-habit input::placeholder {
        color: #555;
    }

    .add-habit button {
        padding: 12px 20px;
        font-size: 12px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 8px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .add-habit button:hover {
        opacity: 0.9;
    }

    .stats {
        display: flex;
        justify-content: center;
        gap: 30px;
        padding-top: 20px;
        border-top: 1px solid #252525;
    }

    .stat {
        text-align: center;
    }

    .stat-value {
        display: block;
        font-size: 1.5rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #2ecc71;
    }

    .stat-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #555;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
