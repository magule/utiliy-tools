<!DOCTYPE html>
<html>
<head>
    <title>JSON Formatter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>JSON Formatter</h1>

    <div class="formatter">
        <div class="input-section">
            <div class="section-header">
                <span>Input</span>
                <button class="mini-btn" id="pasteBtn">Paste</button>
            </div>
            <textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea>
        </div>

        <div class="actions">
            <button class="action-btn" id="formatBtn">Format</button>
            <button class="action-btn secondary" id="minifyBtn">Minify</button>
            <button class="action-btn secondary" id="validateBtn">Validate</button>
        </div>

        <div class="status" id="status"></div>

        <div class="output-section">
            <div class="section-header">
                <span>Output</span>
                <button class="mini-btn" id="copyBtn">Copy</button>
            </div>
            <pre id="jsonOutput"><code></code></pre>
        </div>
    </div>

<script>
    const jsonInput = document.getElementById('jsonInput');
    const jsonOutput = document.getElementById('jsonOutput').querySelector('code');
    const formatBtn = document.getElementById('formatBtn');
    const minifyBtn = document.getElementById('minifyBtn');
    const validateBtn = document.getElementById('validateBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const copyBtn = document.getElementById('copyBtn');
    const status = document.getElementById('status');

    function setStatus(message, type) {
        status.textContent = message;
        status.className = 'status ' + type;
    }

    function format() {
        try {
            const parsed = JSON.parse(jsonInput.value);
            const formatted = JSON.stringify(parsed, null, 2);
            jsonOutput.textContent = formatted;
            setStatus('Valid JSON - Formatted successfully', 'success');
        } catch (e) {
            setStatus('Error: ' + e.message, 'error');
            jsonOutput.textContent = '';
        }
    }

    function minify() {
        try {
            const parsed = JSON.parse(jsonInput.value);
            const minified = JSON.stringify(parsed);
            jsonOutput.textContent = minified;
            setStatus('Valid JSON - Minified successfully', 'success');
        } catch (e) {
            setStatus('Error: ' + e.message, 'error');
            jsonOutput.textContent = '';
        }
    }

    function validate() {
        try {
            const parsed = JSON.parse(jsonInput.value);
            const keys = typeof parsed === 'object' ? Object.keys(parsed).length : 0;
            const isArray = Array.isArray(parsed);
            let info = isArray ? `Array with ${parsed.length} items` : `Object with ${keys} keys`;
            setStatus('Valid JSON - ' + info, 'success');
            jsonOutput.textContent = JSON.stringify(parsed, null, 2);
        } catch (e) {
            setStatus('Invalid JSON: ' + e.message, 'error');
            jsonOutput.textContent = '';
        }
    }

    formatBtn.addEventListener('click', format);
    minifyBtn.addEventListener('click', minify);
    validateBtn.addEventListener('click', validate);

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            jsonInput.value = text;
            format();
        } catch (e) {
            setStatus('Could not paste from clipboard', 'error');
        }
    });

    copyBtn.addEventListener('click', async () => {
        const text = jsonOutput.textContent;
        if (text) {
            await navigator.clipboard.writeText(text);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = 'Copy', 1500);
        }
    });

    jsonInput.addEventListener('input', () => {
        if (jsonInput.value.trim()) {
            validate();
        } else {
            status.className = 'status';
            status.textContent = '';
            jsonOutput.textContent = '';
        }
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .formatter {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        max-width: 600px;
        margin: 0 auto;
        text-align: left;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .section-header span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #555;
    }

    .mini-btn {
        padding: 5px 12px;
        font-size: 10px;
        font-weight: 500;
        background: #333;
        border: none;
        border-radius: 4px;
        color: #888;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .mini-btn:hover {
        background: #444;
        color: #fff;
    }

    .input-section {
        margin-bottom: 20px;
    }

    .input-section textarea {
        width: 100%;
        height: 150px;
        padding: 15px;
        font-size: 13px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        line-height: 1.5;
        background: #252525;
        border: 1px solid #333;
        border-radius: 10px;
        color: #fff;
        outline: none;
        resize: vertical;
    }

    .input-section textarea:focus {
        border-color: #444;
    }

    .input-section textarea::placeholder {
        color: #555;
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .action-btn {
        flex: 1;
        padding: 12px;
        font-size: 11px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 8px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .action-btn:hover {
        opacity: 0.9;
    }

    .action-btn.secondary {
        background: #333;
        color: #aaa;
    }

    .action-btn.secondary:hover {
        background: #444;
        color: #fff;
    }

    .status {
        min-height: 20px;
        font-size: 12px;
        margin-bottom: 15px;
        padding: 8px 12px;
        border-radius: 6px;
        display: none;
    }

    .status.success {
        display: block;
        background: rgba(46, 204, 113, 0.1);
        color: #2ecc71;
    }

    .status.error {
        display: block;
        background: rgba(231, 76, 60, 0.1);
        color: #e74c3c;
    }

    .output-section pre {
        background: #252525;
        border-radius: 10px;
        padding: 15px;
        overflow-x: auto;
        max-height: 300px;
    }

    .output-section code {
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        line-height: 1.5;
        color: #2ecc71;
        white-space: pre;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
