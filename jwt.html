<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Decoder</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>JWT Decoder</h1>

    <div class="decoder">
        <div class="input-section">
            <div class="section-header">
                <span>JWT Token</span>
                <button class="paste-btn" id="pasteBtn">Paste</button>
            </div>
            <textarea id="jwtInput" placeholder="Paste your JWT token here..."></textarea>
        </div>

        <div class="status" id="status"></div>

        <div class="decoded" id="decoded" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <span class="header-label">Header</span>
                    <span class="alg" id="algorithm"></span>
                </div>
                <pre id="headerOutput"><code></code></pre>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="payload-label">Payload</span>
                    <span class="claims-count" id="claimsCount"></span>
                </div>
                <pre id="payloadOutput"><code></code></pre>
            </div>

            <div class="section">
                <div class="section-header">
                    <span>Signature</span>
                </div>
                <div class="signature" id="signature"></div>
            </div>

            <div class="expiry" id="expiry"></div>
        </div>
    </div>

<script>
    const jwtInput = document.getElementById('jwtInput');
    const status = document.getElementById('status');
    const decoded = document.getElementById('decoded');
    const headerOutput = document.getElementById('headerOutput').querySelector('code');
    const payloadOutput = document.getElementById('payloadOutput').querySelector('code');
    const signature = document.getElementById('signature');
    const algorithm = document.getElementById('algorithm');
    const claimsCount = document.getElementById('claimsCount');
    const expiry = document.getElementById('expiry');
    const pasteBtn = document.getElementById('pasteBtn');

    function base64UrlDecode(str) {
        str = str.replace(/-/g, '+').replace(/_/g, '/');
        const pad = str.length % 4;
        if (pad) {
            str += '='.repeat(4 - pad);
        }
        return decodeURIComponent(atob(str).split('').map(c => {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }

    function formatJSON(obj) {
        return JSON.stringify(obj, null, 2);
    }

    function decodeJWT(token) {
        const parts = token.trim().split('.');

        if (parts.length !== 3) {
            throw new Error('Invalid JWT format: expected 3 parts');
        }

        try {
            const header = JSON.parse(base64UrlDecode(parts[0]));
            const payload = JSON.parse(base64UrlDecode(parts[1]));
            const sig = parts[2];

            return { header, payload, signature: sig };
        } catch (e) {
            throw new Error('Failed to decode JWT: ' + e.message);
        }
    }

    function updateDisplay() {
        const token = jwtInput.value.trim();

        if (!token) {
            status.textContent = '';
            status.className = 'status';
            decoded.style.display = 'none';
            return;
        }

        try {
            const jwt = decodeJWT(token);

            headerOutput.textContent = formatJSON(jwt.header);
            payloadOutput.textContent = formatJSON(jwt.payload);
            signature.textContent = jwt.signature;

            algorithm.textContent = jwt.header.alg || 'Unknown';
            claimsCount.textContent = Object.keys(jwt.payload).length + ' claims';

            // Check expiry
            if (jwt.payload.exp) {
                const expDate = new Date(jwt.payload.exp * 1000);
                const now = new Date();
                const isExpired = expDate < now;

                if (isExpired) {
                    expiry.innerHTML = `<span class="expired">Expired: ${expDate.toLocaleString()}</span>`;
                } else {
                    const diff = expDate - now;
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    expiry.innerHTML = `<span class="valid">Expires: ${expDate.toLocaleString()} (in ${days}d ${hours}h)</span>`;
                }
            } else {
                expiry.innerHTML = '<span class="no-expiry">No expiration set</span>';
            }

            status.textContent = 'Valid JWT';
            status.className = 'status success';
            decoded.style.display = 'block';

        } catch (e) {
            status.textContent = e.message;
            status.className = 'status error';
            decoded.style.display = 'none';
        }
    }

    jwtInput.addEventListener('input', updateDisplay);

    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            jwtInput.value = text;
            updateDisplay();
        } catch (e) {}
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .decoder {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 600px;
        margin: 0 auto;
        text-align: left;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .section-header span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
    }

    .paste-btn {
        padding: 5px 12px;
        font-size: 10px;
        background: #333;
        border: none;
        border-radius: 4px;
        color: var(--text-muted);
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
    }

    .paste-btn:hover {
        background: #444;
        color: var(--text);
    }

    .input-section {
        margin-bottom: 15px;
    }

    textarea {
        width: 100%;
        height: 100px;
        padding: 15px;
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        line-height: 1.5;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        outline: none;
        resize: vertical;
        word-break: break-all;
    }

    textarea:focus {
        border-color: var(--text-subtle);
    }

    textarea::placeholder {
        color: var(--text-subtle);
    }

    .status {
        font-size: 12px;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        display: none;
    }

    .status.success {
        display: block;
        background: rgba(46, 204, 113, 0.1);
        color: var(--accent);
    }

    .status.error {

        background: rgba(231, 76, 60, 0.1);
        color: var(--danger);
    }

    .section {
        margin-bottom: 15px;
    }

    .header-label {
        color: #e74c3c !important;
    }

    .payload-label {
        color: #9b59b6 !important;
    }

    .alg {
        font-family: 'SF Mono', 'Fira Code', monospace;

        font-size: 12px !important;
    }

    .claims-count {

        font-size: 12px !important;

    pre {

    pre code {

    .back-btn {

        left: 20px;

        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;

    }

        text-transform: uppercase;

    .stars {

        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {

    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {

        margin-top: 8px;
        font-size: 11px;

    @media (max-width: 600px) {

            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>
