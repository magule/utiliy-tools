<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Generator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Lorem Ipsum Generator</h1>

    <div class="generator">
        <div class="options">
            <div class="option-row">
                <label>Type</label>
                <select id="type">
                    <option value="paragraphs">Paragraphs</option>
                    <option value="sentences">Sentences</option>
                    <option value="words">Words</option>
                </select>
            </div>
            <div class="option-row">
                <label>Amount</label>
                <div class="amount-control">
                    <button class="amount-btn" id="decreaseBtn">−</button>
                    <input type="number" id="amount" value="3" min="1" max="100">
                    <button class="amount-btn" id="increaseBtn">+</button>
                </div>
            </div>
            <div class="option-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="startLorem" checked>
                    <span>Start with "Lorem ipsum..."</span>
                </label>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate</button>

        <div class="output-section">
            <div class="output-header">
                <span class="word-count" id="wordCount">0 words</span>
                <button class="copy-btn" id="copyBtn">Copy</button>
            </div>
            <div class="output" id="output"></div>
        </div>
    </div>

<script>
    const words = [
        'lorem', 'ipsum', 'dolor', 'sit', 'amet', 'consectetur', 'adipiscing', 'elit',
        'sed', 'do', 'eiusmod', 'tempor', 'incididunt', 'ut', 'labore', 'et', 'dolore',
        'magna', 'aliqua', 'enim', 'ad', 'minim', 'veniam', 'quis', 'nostrud',
        'exercitation', 'ullamco', 'laboris', 'nisi', 'aliquip', 'ex', 'ea', 'commodo',
        'consequat', 'duis', 'aute', 'irure', 'in', 'reprehenderit', 'voluptate',
        'velit', 'esse', 'cillum', 'fugiat', 'nulla', 'pariatur', 'excepteur', 'sint',
        'occaecat', 'cupidatat', 'non', 'proident', 'sunt', 'culpa', 'qui', 'officia',
        'deserunt', 'mollit', 'anim', 'id', 'est', 'laborum', 'perspiciatis', 'unde',
        'omnis', 'iste', 'natus', 'error', 'voluptatem', 'accusantium', 'doloremque',
        'laudantium', 'totam', 'rem', 'aperiam', 'eaque', 'ipsa', 'quae', 'ab', 'illo',
        'inventore', 'veritatis', 'quasi', 'architecto', 'beatae', 'vitae', 'dicta',
        'explicabo', 'nemo', 'ipsam', 'quia', 'voluptas', 'aspernatur', 'aut', 'odit',
        'fugit', 'consequuntur', 'magni', 'dolores', 'eos', 'ratione', 'sequi',
        'nesciunt', 'neque', 'porro', 'quisquam', 'dolorem', 'adipisci', 'numquam',
        'eius', 'modi', 'tempora', 'quaerat', 'magnam', 'aliquam', 'quam', 'minima',
        'nostrum', 'exercitationem', 'ullam', 'corporis', 'suscipit', 'laboriosam'
    ];

    const loremStart = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.';

    const type = document.getElementById('type');
    const amount = document.getElementById('amount');
    const startLorem = document.getElementById('startLorem');
    const generateBtn = document.getElementById('generateBtn');
    const output = document.getElementById('output');
    const wordCount = document.getElementById('wordCount');
    const copyBtn = document.getElementById('copyBtn');
    const decreaseBtn = document.getElementById('decreaseBtn');
    const increaseBtn = document.getElementById('increaseBtn');

    function randomWord() {
        return words[Math.floor(Math.random() * words.length)];
    }

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function generateSentence(minWords = 8, maxWords = 15) {
        const count = Math.floor(Math.random() * (maxWords - minWords + 1)) + minWords;
        let sentence = [];
        for (let i = 0; i < count; i++) {
            sentence.push(randomWord());
        }
        return capitalize(sentence.join(' ')) + '.';
    }

    function generateParagraph(minSentences = 4, maxSentences = 8) {
        const count = Math.floor(Math.random() * (maxSentences - minSentences + 1)) + minSentences;
        let sentences = [];
        for (let i = 0; i < count; i++) {
            sentences.push(generateSentence());
        }
        return sentences.join(' ');
    }

    function generate() {
        const typeVal = type.value;
        const amountVal = parseInt(amount.value) || 1;
        const useLoremStart = startLorem.checked;
        let result = '';

        if (typeVal === 'paragraphs') {
            let paragraphs = [];
            for (let i = 0; i < amountVal; i++) {
                if (i === 0 && useLoremStart) {
                    paragraphs.push(loremStart + ' ' + generateParagraph(3, 6));
                } else {
                    paragraphs.push(generateParagraph());
                }
            }
            result = paragraphs.join('\n\n');
        } else if (typeVal === 'sentences') {
            let sentences = [];
            for (let i = 0; i < amountVal; i++) {
                if (i === 0 && useLoremStart) {
                    sentences.push(loremStart);
                } else {
                    sentences.push(generateSentence());
                }
            }
            result = sentences.join(' ');
        } else {
            let wordList = [];
            if (useLoremStart) {
                wordList = ['Lorem', 'ipsum', 'dolor', 'sit', 'amet'];
            }
            while (wordList.length < amountVal) {
                wordList.push(randomWord());
            }
            result = wordList.slice(0, amountVal).join(' ');
        }

        output.textContent = result;
        const count = result.trim().split(/\s+/).length;
        wordCount.textContent = count + ' word' + (count !== 1 ? 's' : '');
    }

    generateBtn.addEventListener('click', generate);

    copyBtn.addEventListener('click', async () => {
        await navigator.clipboard.writeText(output.textContent);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1500);
    });

    decreaseBtn.addEventListener('click', () => {
        if (amount.value > 1) {
            amount.value = parseInt(amount.value) - 1;
        }
    });

    increaseBtn.addEventListener('click', () => {
        if (amount.value < 100) {
            amount.value = parseInt(amount.value) + 1;
        }
    });

    // Generate on load
    generate();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .generator {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 600px;
        margin: 0 auto;
        text-align: left;
    }

    .options {
        background: var(--bg-input);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .option-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
    }

    .option-row:not(:last-child) {
        border-bottom: 1px solid #333;
    }

    .option-row label {
        font-size: 12px;
        color: var(--text-muted);
    }

    .option-row select {
        padding: 8px 12px;
        font-size: 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        outline: none;
    }

    .amount-control {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .amount-btn {
        width: 32px;
        height: 32px;
        background: #333;
        border: none;
        border-radius: 6px;
        color: var(--text-muted);
        font-size: 18px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .amount-btn:hover {
        background: #444;
        color: var(--text);
    }

    .amount-control input {
        width: 60px;
        padding: 8px;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        text-align: center;
        outline: none;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        width: 100%;
    }

    .checkbox-label input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
    }

    .checkbox-label span {
        font-size: 12px;
        color: var(--text-muted);
    }

    .generate-btn {
        width: 100%;
        padding: 14px;
        font-size: 12px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 10px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 20px;
        transition: opacity 0.2s ease;
    }

    .generate-btn:hover {
        opacity: 0.9;
    }

    .output-section {
        background: var(--bg-input);
        border-radius: 10px;
        overflow: hidden;
    }

    .output-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 15px;
        border-bottom: 1px solid #333;
    }

    .word-count {
        font-size: 11px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--accent);
    }

    .copy-btn {
        padding: 6px 12px;
        font-size: 10px;
        font-weight: 500;
        background: #333;
        border: none;
        border-radius: 4px;
        color: var(--text-muted);
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
    }

    .copy-btn:hover {
        background: #444;
        color: var(--text);
    }

    .output {
        padding: 15px;
        font-size: 13px;
        line-height: 1.7;
        color: #ccc;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>
