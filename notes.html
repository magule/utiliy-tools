<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Quick Notes</h1>

    <div class="notes-app">
        <div class="toolbar">
            <button class="tool-btn" id="newNote">+ New</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search notes...">
            </div>
        </div>

        <div class="notes-container">
            <div class="notes-list" id="notesList"></div>
            <div class="note-editor" id="noteEditor">
                <input type="text" class="note-title" id="noteTitle" placeholder="Note title...">
                <textarea class="note-content" id="noteContent" placeholder="Start writing..."></textarea>
                <div class="note-footer">
                    <span class="note-date" id="noteDate"></span>
                    <button class="delete-btn" id="deleteNote">Delete</button>
                </div>
            </div>
        </div>
    </div>

<script>
    let notes = JSON.parse(localStorage.getItem('quickNotes')) || [];
    let currentNoteId = null;

    const notesList = document.getElementById('notesList');
    const noteEditor = document.getElementById('noteEditor');
    const noteTitle = document.getElementById('noteTitle');
    const noteContent = document.getElementById('noteContent');
    const noteDate = document.getElementById('noteDate');
    const newNoteBtn = document.getElementById('newNote');
    const deleteNoteBtn = document.getElementById('deleteNote');
    const searchInput = document.getElementById('searchInput');

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function saveNotes() {
        localStorage.setItem('quickNotes', JSON.stringify(notes));
    }

    function formatDate(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function getPreview(content) {
        return content.substring(0, 50).replace(/\n/g, ' ') + (content.length > 50 ? '...' : '');
    }

    function renderNotesList(filter = '') {
        const filtered = notes.filter(note => {
            const search = filter.toLowerCase();
            return note.title.toLowerCase().includes(search) ||
                   note.content.toLowerCase().includes(search);
        });

        notesList.innerHTML = '';

        if (filtered.length === 0) {
            notesList.innerHTML = `<div class="empty-state">${filter ? 'No matching notes' : 'No notes yet'}</div>`;
            return;
        }

        filtered.sort((a, b) => b.updatedAt - a.updatedAt);

        filtered.forEach(note => {
            const div = document.createElement('div');
            div.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
            div.dataset.id = note.id;
            div.innerHTML = `
                <div class="note-item-title">${note.title || 'Untitled'}</div>
                <div class="note-item-preview">${getPreview(note.content) || 'No content'}</div>
                <div class="note-item-date">${formatDate(note.updatedAt)}</div>
            `;
            div.addEventListener('click', () => selectNote(note.id));
            notesList.appendChild(div);
        });
    }

    function selectNote(id) {
        currentNoteId = id;
        const note = notes.find(n => n.id === id);

        if (note) {
            noteTitle.value = note.title;
            noteContent.value = note.content;
            noteDate.textContent = 'Last edited ' + formatDate(note.updatedAt);
            noteEditor.classList.add('active');
        }

        renderNotesList(searchInput.value);
    }

    function createNote() {
        const note = {
            id: generateId(),
            title: '',
            content: '',
            createdAt: Date.now(),
            updatedAt: Date.now()
        };

        notes.unshift(note);
        saveNotes();
        selectNote(note.id);
        noteTitle.focus();
    }

    function updateCurrentNote() {
        if (!currentNoteId) return;

        const note = notes.find(n => n.id === currentNoteId);
        if (note) {
            note.title = noteTitle.value;
            note.content = noteContent.value;
            note.updatedAt = Date.now();
            saveNotes();
            renderNotesList(searchInput.value);
        }
    }

    function deleteCurrentNote() {
        if (!currentNoteId) return;

        notes = notes.filter(n => n.id !== currentNoteId);
        saveNotes();
        currentNoteId = null;
        noteEditor.classList.remove('active');
        noteTitle.value = '';
        noteContent.value = '';
        renderNotesList(searchInput.value);

        if (notes.length > 0) {
            selectNote(notes[0].id);
        }
    }

    newNoteBtn.addEventListener('click', createNote);
    deleteNoteBtn.addEventListener('click', deleteCurrentNote);
    noteTitle.addEventListener('input', updateCurrentNote);
    noteContent.addEventListener('input', updateCurrentNote);
    searchInput.addEventListener('input', (e) => renderNotesList(e.target.value));

    // Initialize
    renderNotesList();
    if (notes.length > 0) {
        selectNote(notes[0].id);
    }
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .notes-app {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        max-width: 800px;
        margin: 0 auto;
        overflow: hidden;
    }

    .toolbar {
        display: flex;
        gap: 10px;
        padding: 15px;
        border-bottom: 1px solid #252525;
    }

    .tool-btn {
        padding: 10px 20px;
        font-size: 12px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 8px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .tool-btn:hover {
        opacity: 0.9;
    }

    .search-box {
        flex: 1;
    }

    .search-box input {
        width: 100%;
        padding: 10px 15px;
        font-size: 13px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        outline: none;
    }

    .search-box input:focus {
        border-color: var(--text-subtle);
    }

    .search-box input::placeholder {
        color: var(--text-subtle);
    }

    .notes-container {
        display: flex;
        min-height: 400px;
    }

    .notes-list {
        width: 250px;
        border-right: 1px solid #252525;
        overflow-y: auto;
        max-height: 500px;
    }

    .empty-state {
        padding: 40px 20px;
        color: var(--text-subtle);
        font-size: 13px;
    }

    .note-item {
        padding: 15px;
        border-bottom: 1px solid #252525;
        cursor: pointer;
        text-align: left;
        transition: background 0.2s ease;
    }

    .note-item:hover {
        background: #222;
    }

    .note-item.active {
        background: var(--bg-input);
    }

    .note-item-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .note-item-preview {
        font-size: 11px;
        color: var(--text-subtle);
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .note-item-date {
        font-size: 10px;
        color: var(--text-subtle);
    }

    .note-editor {
        flex: 1;
        display: none;
        flex-direction: column;
        padding: 20px;
        text-align: left;
    }

    .note-editor.active {
        display: flex;
    }

    .note-title {
        font-size: 1.25rem;
        font-weight: 500;
        background: transparent;
        border: none;
        color: var(--text);
        outline: none;
        margin-bottom: 15px;
        padding: 5px 0;
    }

    .note-title::placeholder {
        color: var(--text-subtle);
    }

    .note-content {
        flex: 1;
        font-size: 14px;
        line-height: 1.6;
        background: transparent;
        border: none;
        color: #ccc;
        outline: none;
        resize: none;
        font-family: inherit;
    }

    .note-content::placeholder {
        color: var(--text-subtle);
    }

    .note-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #252525;
    }

    .note-date {
        font-size: 11px;
        color: var(--text-subtle);
    }

    .delete-btn {
        padding: 8px 15px;
        font-size: 11px;
        font-weight: 500;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: #666;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .delete-btn:hover {
        border-color: var(--danger);
        color: var(--danger);
    }

    @media (max-width: 600px) {
        .notes-container {
            flex-direction: column;
        }

        .notes-list {
            width: 100%;
            max-height: 200px;
            border-right: none;
            border-bottom: 1px solid #252525;
        }
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
