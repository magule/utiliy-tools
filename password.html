<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Password Generator</h1>

    <div class="generator">
        <div class="password-display">
            <input type="text" id="password" readonly value="Click Generate">
            <button class="copy-btn" id="copyBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
        </div>

        <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
        </div>
        <div class="strength-label" id="strengthLabel">Generate a password</div>

        <div class="options">
            <div class="option-row">
                <label>Length</label>
                <div class="length-control">
                    <input type="range" id="lengthSlider" min="4" max="64" value="16">
                    <span id="lengthValue">16</span>
                </div>
            </div>

            <div class="option-row">
                <label>Uppercase (A-Z)</label>
                <label class="toggle">
                    <input type="checkbox" id="uppercase" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="option-row">
                <label>Lowercase (a-z)</label>
                <label class="toggle">
                    <input type="checkbox" id="lowercase" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="option-row">
                <label>Numbers (0-9)</label>
                <label class="toggle">
                    <input type="checkbox" id="numbers" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="option-row">
                <label>Symbols (!@#$...)</label>
                <label class="toggle">
                    <input type="checkbox" id="symbols" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate Password</button>
    </div>

<script>
    const passwordEl = document.getElementById('password');
    const copyBtn = document.getElementById('copyBtn');
    const generateBtn = document.getElementById('generateBtn');
    const lengthSlider = document.getElementById('lengthSlider');
    const lengthValue = document.getElementById('lengthValue');
    const strengthFill = document.getElementById('strengthFill');
    const strengthLabel = document.getElementById('strengthLabel');

    const uppercaseEl = document.getElementById('uppercase');
    const lowercaseEl = document.getElementById('lowercase');
    const numbersEl = document.getElementById('numbers');
    const symbolsEl = document.getElementById('symbols');

    const charSets = {
        uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lowercase: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    function generatePassword() {
        let chars = '';
        if (uppercaseEl.checked) chars += charSets.uppercase;
        if (lowercaseEl.checked) chars += charSets.lowercase;
        if (numbersEl.checked) chars += charSets.numbers;
        if (symbolsEl.checked) chars += charSets.symbols;

        if (chars === '') {
            passwordEl.value = 'Select at least one option';
            updateStrength(0);
            return;
        }

        const length = parseInt(lengthSlider.value);
        let password = '';

        const array = new Uint32Array(length);
        crypto.getRandomValues(array);

        for (let i = 0; i < length; i++) {
            password += chars[array[i] % chars.length];
        }

        passwordEl.value = password;
        updateStrength(calculateStrength(password));
    }

    function calculateStrength(password) {
        let score = 0;
        const length = password.length;

        // Length score
        if (length >= 8) score += 1;
        if (length >= 12) score += 1;
        if (length >= 16) score += 1;
        if (length >= 24) score += 1;

        // Character variety score
        if (/[a-z]/.test(password)) score += 1;
        if (/[A-Z]/.test(password)) score += 1;
        if (/[0-9]/.test(password)) score += 1;
        if (/[^a-zA-Z0-9]/.test(password)) score += 1;

        return Math.min(score / 8 * 100, 100);
    }

    function updateStrength(score) {
        strengthFill.style.width = score + '%';

        if (score === 0) {
            strengthFill.style.background = '#333';
            strengthLabel.textContent = 'Generate a password';
        } else if (score < 30) {
            strengthFill.style.background = '#e74c3c';
            strengthLabel.textContent = 'Weak';
        } else if (score < 60) {
            strengthFill.style.background = '#f39c12';
            strengthLabel.textContent = 'Medium';
        } else if (score < 80) {
            strengthFill.style.background = '#3498db';
            strengthLabel.textContent = 'Strong';
        } else {
            strengthFill.style.background = '#2ecc71';
            strengthLabel.textContent = 'Very Strong';
        }
    }

    async function copyPassword() {
        const password = passwordEl.value;
        if (password && password !== 'Click Generate' && password !== 'Select at least one option') {
            await navigator.clipboard.writeText(password);
            copyBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            `;
            setTimeout(() => {
                copyBtn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                `;
            }, 2000);
        }
    }

    lengthSlider.addEventListener('input', () => {
        lengthValue.textContent = lengthSlider.value;
    });

    generateBtn.addEventListener('click', generatePassword);
    copyBtn.addEventListener('click', copyPassword);

    [uppercaseEl, lowercaseEl, numbersEl, symbolsEl, lengthSlider].forEach(el => {
        el.addEventListener('change', generatePassword);
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .generator {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 400px;
        margin: 0 auto;
    }

    .password-display {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .password-display input {
        flex: 1;
        padding: 15px;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--accent);
        outline: none;
    }

    .copy-btn {
        width: 50px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: #666;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }

    .copy-btn:hover {
        border-color: var(--text-subtle);
        color: var(--text);
    }

    .strength-bar {
        height: 4px;
        background: var(--bg-input);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 8px;
    }

    .strength-fill {
        height: 100%;
        width: 0;
        background: #333;
        transition: all 0.3s ease;
    }

    .strength-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 25px;
    }

    .options {
        margin-bottom: 25px;
    }

    .option-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #252525;
    }

    .option-row:last-child {
        border-bottom: none;
    }

    .option-row > label:first-child {
        font-size: 13px;
        color: var(--text-muted);
    }

    .length-control {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .length-control input[type="range"] {
        width: 120px;
        height: 4px;
        background: #333;
        border-radius: 2px;
        appearance: none;
        -webkit-appearance: none;
    }

    .length-control input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
    }

    #lengthValue {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 14px;
        color: var(--text);
        min-width: 24px;
    }

    .toggle {
        position: relative;
        width: 44px;
        height: 24px;
        cursor: pointer;
    }

    .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .toggle-slider {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #333;
        border-radius: 24px;
        transition: 0.3s;
    }

    .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #666;
        border-radius: 50%;
        transition: 0.3s;
    }

    .toggle input:checked + .toggle-slider {
        background: var(--accent);
    }

    .toggle input:checked + .toggle-slider:before {
        transform: translateX(20px);
        background: #fff;
    }

    .generate-btn {
        width: 100%;
        padding: 15px;
        font-size: 13px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 10px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .generate-btn:hover {
        opacity: 0.9;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>
