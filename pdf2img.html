<!DOCTYPE html>
<html>
<head>
    <title>PDF to Image</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>PDF to Image</h1>

    <div class="converter">
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📄</div>
            <div class="upload-text">Drop PDF here or click to upload</div>
            <div class="upload-hint">Max 50MB</div>
            <input type="file" id="fileInput" accept=".pdf" hidden>
        </div>

        <div class="file-info" id="fileInfo" style="display: none;">
            <span class="file-name" id="fileName"></span>
            <span class="file-pages" id="filePages"></span>
        </div>

        <div class="options" id="options" style="display: none;">
            <div class="option-row">
                <label>Format</label>
                <select id="format">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                </select>
            </div>
            <div class="option-row">
                <label>Quality</label>
                <select id="quality">
                    <option value="1">Low (1x)</option>
                    <option value="2" selected>Medium (2x)</option>
                    <option value="3">High (3x)</option>
                </select>
            </div>
        </div>

        <div class="actions" id="actions" style="display: none;">
            <button class="action-btn" id="convertBtn">Convert All Pages</button>
            <button class="action-btn secondary" id="clearBtn">Clear</button>
        </div>

        <div class="status" id="status"></div>

        <div class="preview" id="preview"></div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const filePages = document.getElementById('filePages');
    const options = document.getElementById('options');
    const actions = document.getElementById('actions');
    const convertBtn = document.getElementById('convertBtn');
    const clearBtn = document.getElementById('clearBtn');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    let pdfDoc = null;

    uploadZone.addEventListener('click', () => fileInput.click());

    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) {
            handleFile(e.target.files[0]);
        }
    });

    async function handleFile(file) {
        if (file.type !== 'application/pdf') {
            status.textContent = 'Please upload a PDF file';
            status.className = 'status error';
            return;
        }

        status.textContent = 'Loading PDF...';
        status.className = 'status processing';

        try {
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            fileName.textContent = file.name;
            filePages.textContent = `${pdfDoc.numPages} page${pdfDoc.numPages > 1 ? 's' : ''}`;

            fileInfo.style.display = 'flex';
            options.style.display = 'block';
            actions.style.display = 'flex';
            uploadZone.style.display = 'none';

            status.textContent = '';
            status.className = 'status';

            // Show preview of first page
            await renderPreview(1);
        } catch (e) {
            status.textContent = 'Error loading PDF: ' + e.message;
            status.className = 'status error';
        }
    }

    async function renderPreview(pageNum) {
        const page = await pdfDoc.getPage(pageNum);
        const scale = 1;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.className = 'preview-canvas';
        const context = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;

        preview.innerHTML = '';
        preview.appendChild(canvas);
    }

    clearBtn.addEventListener('click', () => {
        pdfDoc = null;
        fileInfo.style.display = 'none';
        options.style.display = 'none';
        actions.style.display = 'none';
        uploadZone.style.display = 'block';
        preview.innerHTML = '';
        status.textContent = '';
        status.className = 'status';
        fileInput.value = '';
    });

    convertBtn.addEventListener('click', async () => {
        if (!pdfDoc) return;

        const format = document.getElementById('format').value;
        const quality = parseInt(document.getElementById('quality').value);
        const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';

        status.textContent = 'Converting...';
        status.className = 'status processing';

        try {
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                status.textContent = `Converting page ${i} of ${pdfDoc.numPages}...`;

                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: quality });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                const dataUrl = canvas.toDataURL(mimeType, 0.9);
                const link = document.createElement('a');
                link.download = `page-${i}.${format}`;
                link.href = dataUrl;
                link.click();

                // Small delay between downloads
                await new Promise(r => setTimeout(r, 300));
            }

            status.textContent = `Converted ${pdfDoc.numPages} page${pdfDoc.numPages > 1 ? 's' : ''} successfully!`;
            status.className = 'status success';
        } catch (e) {
            status.textContent = 'Error converting: ' + e.message;
            status.className = 'status error';
        }
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .converter {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        max-width: 500px;
        margin: 0 auto;
    }

    .upload-zone {
        border: 2px dashed #333;
        border-radius: 12px;
        padding: 40px 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-bottom: 20px;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
        border-color: #555;
        background: #252525;
    }

    .upload-icon {
        font-size: 3rem;
        margin-bottom: 15px;
    }

    .upload-text {
        font-size: 14px;
        color: #888;
        margin-bottom: 8px;
    }

    .upload-hint {
        font-size: 11px;
        color: #555;
    }

    .file-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #252525;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .file-name {
        font-size: 13px;
        color: #fff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .file-pages {
        font-size: 12px;
        color: #2ecc71;
        font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .options {
        background: #252525;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .option-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
    }

    .option-row:not(:last-child) {
        border-bottom: 1px solid #333;
    }

    .option-row label {
        font-size: 12px;
        color: #888;
    }

    .option-row select {
        padding: 8px 12px;
        font-size: 12px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        color: #fff;
        outline: none;
        cursor: pointer;
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .action-btn {
        flex: 1;
        padding: 14px;
        font-size: 12px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 10px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .action-btn:hover {
        opacity: 0.9;
    }

    .action-btn.secondary {
        background: #333;
        color: #aaa;
    }

    .action-btn.secondary:hover {
        background: #444;
        color: #fff;
    }

    .status {
        font-size: 12px;
        padding: 10px;
        border-radius: 6px;
        display: none;
        margin-bottom: 15px;
    }

    .status.processing {
        display: block;
        background: rgba(52, 152, 219, 0.1);
        color: #3498db;
    }

    .status.success {
        display: block;
        background: rgba(46, 204, 113, 0.1);
        color: #2ecc71;
    }

    .status.error {
        display: block;
        background: rgba(231, 76, 60, 0.1);
        color: #e74c3c;
    }

    .preview {
        margin-top: 15px;
    }

    .preview-canvas {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        border: 1px solid #333;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
