<!DOCTYPE html>
<html>
<head>
    <title>Percentage Calculator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Percentage Calculator</h1>

    <div class="calculator">
        <div class="calc-tabs">
            <button class="calc-tab active" data-calc="basic">Basic</button>
            <button class="calc-tab" data-calc="discount">Discount</button>
            <button class="calc-tab" data-calc="change">Change</button>
        </div>

        <div class="calc-body" id="basicCalc">
            <div class="calc-row">
                <span class="calc-text">What is</span>
                <input type="number" id="basicPercent" value="25">
                <span class="calc-text">% of</span>
                <input type="number" id="basicOf" value="200">
                <span class="calc-text">?</span>
            </div>
            <div class="result-box">
                <span class="result-label">Result</span>
                <span class="result-value" id="basicResult">50</span>
            </div>
        </div>

        <div class="calc-body hidden" id="discountCalc">
            <div class="input-stack">
                <div class="input-row">
                    <label>Original Price</label>
                    <div class="input-with-prefix">
                        <span class="prefix">$</span>
                        <input type="number" id="discountOriginal" value="100">
                    </div>
                </div>
                <div class="input-row">
                    <label>Discount</label>
                    <div class="input-with-suffix">
                        <input type="number" id="discountPercent" value="20">
                        <span class="suffix">%</span>
                    </div>
                </div>
            </div>
            <div class="result-box">
                <div class="result-row">
                    <span class="result-label">You Save</span>
                    <span class="result-value small" id="discountSaved">$20.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Final Price</span>
                    <span class="result-value" id="discountFinal">$80.00</span>
                </div>
            </div>
        </div>

        <div class="calc-body hidden" id="changeCalc">
            <div class="input-stack">
                <div class="input-row">
                    <label>Original Value</label>
                    <input type="number" id="changeOriginal" value="50">
                </div>
                <div class="input-row">
                    <label>New Value</label>
                    <input type="number" id="changeNew" value="75">
                </div>
            </div>
            <div class="result-box">
                <div class="result-row">
                    <span class="result-label">Change</span>
                    <span class="result-value" id="changeResult">+50%</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Difference</span>
                    <span class="result-value small" id="changeDiff">+25</span>
                </div>
            </div>
        </div>
    </div>

<script>
    const calcTabs = document.querySelectorAll('.calc-tab');
    const calcBodies = document.querySelectorAll('.calc-body');

    // Basic calculator
    const basicPercent = document.getElementById('basicPercent');
    const basicOf = document.getElementById('basicOf');
    const basicResult = document.getElementById('basicResult');

    // Discount calculator
    const discountOriginal = document.getElementById('discountOriginal');
    const discountPercent = document.getElementById('discountPercent');
    const discountSaved = document.getElementById('discountSaved');
    const discountFinal = document.getElementById('discountFinal');

    // Change calculator
    const changeOriginal = document.getElementById('changeOriginal');
    const changeNew = document.getElementById('changeNew');
    const changeResult = document.getElementById('changeResult');
    const changeDiff = document.getElementById('changeDiff');

    function calculateBasic() {
        const percent = parseFloat(basicPercent.value) || 0;
        const of = parseFloat(basicOf.value) || 0;
        const result = (percent / 100) * of;
        basicResult.textContent = result.toFixed(2).replace(/\.?0+$/, '');
    }

    function calculateDiscount() {
        const original = parseFloat(discountOriginal.value) || 0;
        const percent = parseFloat(discountPercent.value) || 0;
        const saved = original * (percent / 100);
        const final = original - saved;
        discountSaved.textContent = '$' + saved.toFixed(2);
        discountFinal.textContent = '$' + final.toFixed(2);
    }

    function calculateChange() {
        const original = parseFloat(changeOriginal.value) || 0;
        const newVal = parseFloat(changeNew.value) || 0;

        if (original === 0) {
            changeResult.textContent = '—';
            changeDiff.textContent = '—';
            return;
        }

        const diff = newVal - original;
        const percent = ((newVal - original) / original) * 100;
        const sign = percent >= 0 ? '+' : '';

        changeResult.textContent = sign + percent.toFixed(1) + '%';
        changeResult.className = 'result-value ' + (percent >= 0 ? 'positive' : 'negative');
        changeDiff.textContent = sign + diff.toFixed(2).replace(/\.?0+$/, '');
    }

    calcTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            calcTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            calcBodies.forEach(body => body.classList.add('hidden'));
            document.getElementById(tab.dataset.calc + 'Calc').classList.remove('hidden');
        });
    });

    basicPercent.addEventListener('input', calculateBasic);
    basicOf.addEventListener('input', calculateBasic);
    discountOriginal.addEventListener('input', calculateDiscount);
    discountPercent.addEventListener('input', calculateDiscount);
    changeOriginal.addEventListener('input', calculateChange);
    changeNew.addEventListener('input', calculateChange);

    calculateBasic();
    calculateDiscount();
    calculateChange();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .calculator {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        max-width: 400px;
        margin: 0 auto;
    }

    .calc-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 25px;
    }

    .calc-tab {
        flex: 1;
        padding: 10px;
        font-size: 11px;
        font-weight: 500;
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        color: #666;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .calc-tab:hover {
        color: #888;
    }

    .calc-tab.active {
        background: #333;
        border-color: #444;
        color: #fff;
    }

    .calc-body.hidden {
        display: none;
    }

    .calc-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .calc-text {
        font-size: 14px;
        color: #666;
    }

    .calc-row input {
        width: 80px;
        padding: 10px;
        font-size: 1.25rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        outline: none;
        text-align: center;
    }

    .calc-row input:focus {
        border-color: #555;
    }

    .input-stack {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 20px;
    }

    .input-row {
        text-align: left;
    }

    .input-row label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #555;
        margin-bottom: 8px;
    }

    .input-row input {
        width: 100%;
        padding: 12px 15px;
        font-size: 1.25rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        outline: none;
    }

    .input-row input:focus {
        border-color: #555;
    }

    .input-with-prefix,
    .input-with-suffix {
        position: relative;
    }

    .input-with-prefix input {
        padding-left: 30px;
    }

    .input-with-suffix input {
        padding-right: 35px;
    }

    .prefix,
    .suffix {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1rem;
        color: #555;
    }

    .prefix {
        left: 12px;
    }

    .suffix {
        right: 12px;
    }

    .result-box {
        background: #252525;
        border-radius: 10px;
        padding: 20px;
    }

    .result-box .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
    }

    .result-box .result-row:not(:last-child) {
        border-bottom: 1px solid #333;
    }

    .result-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #555;
    }

    .result-value {
        font-size: 2rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #2ecc71;
    }

    .result-value.small {
        font-size: 1.25rem;
    }

    .result-value.positive {
        color: #2ecc71;
    }

    .result-value.negative {
        color: #e74c3c;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
        appearance: textfield;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
