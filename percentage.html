<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Percentage Calculator</h1>

    <div class="calculator">
        <div class="calc-tabs">
            <button class="calc-tab active" data-calc="basic">Basic</button>
            <button class="calc-tab" data-calc="discount">Discount</button>
            <button class="calc-tab" data-calc="change">Change</button>
        </div>

        <div class="calc-body" id="basicCalc">
            <div class="calc-row">
                <span class="calc-text">What is</span>
                <input type="number" id="basicPercent" value="25">
                <span class="calc-text">% of</span>
                <input type="number" id="basicOf" value="200">
                <span class="calc-text">?</span>
            </div>
            <div class="result-box">
                <span class="result-label">Result</span>
                <span class="result-value" id="basicResult">50</span>
            </div>
        </div>

        <div class="calc-body hidden" id="discountCalc">
            <div class="input-stack">
                <div class="input-row">
                    <label>Original Price</label>
                    <div class="input-with-prefix">
                        <span class="prefix">$</span>
                        <input type="number" id="discountOriginal" value="100">
                    </div>
                </div>
                <div class="input-row">
                    <label>Discount</label>
                    <div class="input-with-suffix">
                        <input type="number" id="discountPercent" value="20">
                        <span class="suffix">%</span>
                    </div>
                </div>
            </div>
            <div class="result-box">
                <div class="result-row">
                    <span class="result-label">You Save</span>
                    <span class="result-value small" id="discountSaved">$20.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Final Price</span>
                    <span class="result-value" id="discountFinal">$80.00</span>
                </div>
            </div>
        </div>

        <div class="calc-body hidden" id="changeCalc">
            <div class="input-stack">
                <div class="input-row">
                    <label>Original Value</label>
                    <input type="number" id="changeOriginal" value="50">
                </div>
                <div class="input-row">
                    <label>New Value</label>
                    <input type="number" id="changeNew" value="75">
                </div>
            </div>
            <div class="result-box">
                <div class="result-row">
                    <span class="result-label">Change</span>
                    <span class="result-value" id="changeResult">+50%</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Difference</span>
                    <span class="result-value small" id="changeDiff">+25</span>
                </div>
            </div>
        </div>
    </div>

<script>
    const calcTabs = document.querySelectorAll('.calc-tab');
    const calcBodies = document.querySelectorAll('.calc-body');

    // Basic calculator
    const basicPercent = document.getElementById('basicPercent');
    const basicOf = document.getElementById('basicOf');
    const basicResult = document.getElementById('basicResult');

    // Discount calculator
    const discountOriginal = document.getElementById('discountOriginal');
    const discountPercent = document.getElementById('discountPercent');
    const discountSaved = document.getElementById('discountSaved');
    const discountFinal = document.getElementById('discountFinal');

    // Change calculator
    const changeOriginal = document.getElementById('changeOriginal');
    const changeNew = document.getElementById('changeNew');
    const changeResult = document.getElementById('changeResult');
    const changeDiff = document.getElementById('changeDiff');

    function calculateBasic() {
        const percent = parseFloat(basicPercent.value) || 0;
        const of = parseFloat(basicOf.value) || 0;
        const result = (percent / 100) * of;
        basicResult.textContent = result.toFixed(2).replace(/\.?0+$/, '');
    }

    function calculateDiscount() {
        const original = parseFloat(discountOriginal.value) || 0;
        const percent = parseFloat(discountPercent.value) || 0;
        const saved = original * (percent / 100);
        const final = original - saved;
        discountSaved.textContent = '$' + saved.toFixed(2);
        discountFinal.textContent = '$' + final.toFixed(2);
    }

    function calculateChange() {
        const original = parseFloat(changeOriginal.value) || 0;
        const newVal = parseFloat(changeNew.value) || 0;

        if (original === 0) {
            changeResult.textContent = '—';
            changeDiff.textContent = '—';
            return;
        }

        const diff = newVal - original;
        const percent = ((newVal - original) / original) * 100;
        const sign = percent >= 0 ? '+' : '';

        changeResult.textContent = sign + percent.toFixed(1) + '%';
        changeResult.className = 'result-value ' + (percent >= 0 ? 'positive' : 'negative');
        changeDiff.textContent = sign + diff.toFixed(2).replace(/\.?0+$/, '');
    }

    calcTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            calcTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            calcBodies.forEach(body => body.classList.add('hidden'));
            document.getElementById(tab.dataset.calc + 'Calc').classList.remove('hidden');
        });
    });

    basicPercent.addEventListener('input', calculateBasic);
    basicOf.addEventListener('input', calculateBasic);
    discountOriginal.addEventListener('input', calculateDiscount);
    discountPercent.addEventListener('input', calculateDiscount);
    changeOriginal.addEventListener('input', calculateChange);
    changeNew.addEventListener('input', calculateChange);

    calculateBasic();
    calculateDiscount();
    calculateChange();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .calculator {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 400px;
        margin: 0 auto;
    }

    .calc-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 25px;
    }

    .calc-tab {
        flex: 1;
        padding: 10px;
        font-size: 11px;
        font-weight: 500;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: #666;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .calc-tab:hover {
        color: var(--text-muted);
    }

    .calc-tab.active {
        background: #333;
        border-color: var(--text-subtle);
        color: var(--text);
    }

    .calc-body.hidden {
        display: none;
    }

    .calc-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .calc-text {
        font-size: 14px;
        color: #666;
    }

    .calc-row input {
        width: 80px;
        padding: 10px;
        font-size: 1.25rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        outline: none;
        text-align: center;
    }

    .calc-row input:focus {
        border-color: var(--text-subtle);
    }

    .input-stack {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 20px;
    }

    .input-row {
        text-align: left;
    }

    .input-row label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .input-row input {
        width: 100%;
        padding: 12px 15px;
        font-size: 1.25rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        outline: none;
    }

    .input-row input:focus {
        border-color: var(--text-subtle);
    }

    .input-with-prefix,
    .input-with-suffix {
        position: relative;
    }

    .input-with-prefix input {
        padding-left: 30px;
    }

    .input-with-suffix input {
        padding-right: 35px;
    }

    .prefix,
    .suffix {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1rem;
        color: var(--text-subtle);
    }

    .prefix {
        left: 12px;
    }

    .suffix {
        right: 12px;
    }

    .result-box {
        background: var(--bg-input);
        border-radius: 10px;
        padding: 20px;
    }

    .result-box .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
    }

    .result-box .result-row:not(:last-child) {
        border-bottom: 1px solid #333;
    }

    .result-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
    }

    .result-value {
        font-size: 2rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--accent);
    }

    .result-value.small {
        font-size: 1.25rem;
    }

    .result-value.positive {
        color: var(--accent);
    }

    .result-value.negative {
        color: var(--danger);
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
        appearance: textfield;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
