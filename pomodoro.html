<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Pomodoro Timer</title>

</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Pomodoro Timer</h1>

    <div class="pomodoro">
        <div class="pomodoro-header">
            <span class="pomodoro-label" contenteditable="true" spellcheck="false">Focus Session</span>
        </div>

        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="work">Work</button>
            <button class="mode-tab" data-mode="shortBreak">Short Break</button>
            <button class="mode-tab" data-mode="longBreak">Long Break</button>
        </div>

        <div class="time" id="time">25:00</div>

        <div class="session-info">
            <span id="sessionCount">Session 1 of 4</span>
        </div>

        <div class="buttons">
            <button class="start-btn" id="startBtn">Start</button>
            <button class="stop-btn" id="stopBtn">Stop</button>
            <button class="reset-btn" id="resetBtn">Reset</button>
        </div>

        <div class="settings-toggle">
            <button class="settings-btn" id="settingsBtn">Settings</button>
        </div>

        <div class="settings" id="settings">
            <div class="setting-row">
                <label>Work Duration</label>
                <div class="setting-input">
                    <input type="number" id="workDuration" min="1" max="60" value="25">
                    <span>min</span>
                </div>
            </div>
            <div class="setting-row">
                <label>Short Break</label>
                <div class="setting-input">
                    <input type="number" id="shortBreakDuration" min="1" max="30" value="5">
                    <span>min</span>
                </div>
            </div>
            <div class="setting-row">
                <label>Long Break</label>
                <div class="setting-input">
                    <input type="number" id="longBreakDuration" min="1" max="60" value="15">
                    <span>min</span>
                </div>
            </div>
            <div class="setting-row">
                <label>Sessions until long break</label>
                <div class="setting-input">
                    <input type="number" id="sessionsCount" min="2" max="10" value="4">
                    <span></span>
                </div>
            </div>
        </div>
    </div>

<script>
    const config = {
        work: 25 * 60,
        shortBreak: 5 * 60,
        longBreak: 15 * 60,
        sessionsUntilLong: 4
    };

    let currentMode = 'work';
    let totalSeconds = config.work;
    let intervalID = null;
    let isRunning = false;
    let currentSession = 1;

    const timeDisplay = document.getElementById('time');
    const sessionDisplay = document.getElementById('sessionCount');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settings');
    const modeTabs = document.querySelectorAll('.mode-tab');

    // Settings inputs
    const workInput = document.getElementById('workDuration');
    const shortBreakInput = document.getElementById('shortBreakDuration');
    const longBreakInput = document.getElementById('longBreakDuration');
    const sessionsInput = document.getElementById('sessionsCount');

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
        timeDisplay.textContent = formatTime(totalSeconds);
        sessionDisplay.textContent = `Session ${currentSession} of ${config.sessionsUntilLong}`;
    }

    function setMode(mode) {
        currentMode = mode;
        modeTabs.forEach(tab => {
            tab.classList.toggle('active', tab.dataset.mode === mode);
        });

        if (mode === 'work') {
            totalSeconds = config.work;
            document.body.className = '';
        } else if (mode === 'shortBreak') {
            totalSeconds = config.shortBreak;
            document.body.className = 'break-mode';
        } else {
            totalSeconds = config.longBreak;
            document.body.className = 'break-mode long';
        }

        updateDisplay();
    }

    function tick() {
        if (totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
        } else {
            clearInterval(intervalID);
            isRunning = false;
            playSound();

            // Auto-switch modes
            if (currentMode === 'work') {
                if (currentSession >= config.sessionsUntilLong) {
                    currentSession = 1;
                    setMode('longBreak');
                } else {
                    setMode('shortBreak');
                }
            } else {
                if (currentMode === 'shortBreak') {
                    currentSession++;
                }
                setMode('work');
            }
        }
    }

    function playSound() {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.frequency.value = 800;
        oscillator.type = 'sine';
        gainNode.gain.value = 0.3;

        oscillator.start();

        setTimeout(() => {
            oscillator.stop();
        }, 200);

        setTimeout(() => {
            const osc2 = audioContext.createOscillator();
            osc2.connect(gainNode);
            osc2.frequency.value = 800;
            osc2.type = 'sine';
            osc2.start();
            setTimeout(() => osc2.stop(), 200);
        }, 300);
    }

    startBtn.addEventListener('click', () => {
        if (!isRunning) {
            intervalID = setInterval(tick, 1000);
            isRunning = true;
        }
    });

    stopBtn.addEventListener('click', () => {
        if (isRunning) {
            clearInterval(intervalID);
            isRunning = false;
        }
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(intervalID);
        isRunning = false;
        setMode(currentMode);
    });

    modeTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            if (!isRunning) {
                setMode(tab.dataset.mode);
            }
        });
    });

    settingsBtn.addEventListener('click', () => {
        settingsPanel.classList.toggle('open');
        settingsBtn.textContent = settingsPanel.classList.contains('open') ? 'Close' : 'Settings';
    });

    // Settings change handlers
    function updateConfig() {
        config.work = (parseInt(workInput.value) || 25) * 60;
        config.shortBreak = (parseInt(shortBreakInput.value) || 5) * 60;
        config.longBreak = (parseInt(longBreakInput.value) || 15) * 60;
        config.sessionsUntilLong = parseInt(sessionsInput.value) || 4;

        if (!isRunning) {
            setMode(currentMode);
        }
    }

    [workInput, shortBreakInput, longBreakInput, sessionsInput].forEach(input => {
        input.addEventListener('change', updateConfig);
    });

    // Initialize
    updateDisplay();
</script>

<style>

        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */

        --text-muted: #888;

        --accent-hover: #27ae60;

        --star: #f39c12;
        --star-inactive: #333;

        --text-muted: #4b5563;

        --accent: #0d9488;
        --accent-hover: #0f766e;

        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>
