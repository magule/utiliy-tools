<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Image Resizer</h1>

    <div class="resizer">
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">🖼️</div>
            <div class="upload-text">Drop image here or click to upload</div>
            <div class="upload-hint">Supports JPG, PNG, WebP</div>
            <input type="file" id="fileInput" accept="image/*" hidden>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
            <div class="original-info" id="originalInfo"></div>
            <canvas id="preview"></canvas>
        </div>

        <div class="options" id="options" style="display: none;">
            <div class="size-inputs">
                <div class="size-input">
                    <label>Width</label>
                    <input type="number" id="widthInput" min="1" max="10000">
                    <span>px</span>
                </div>
                <button class="link-btn" id="linkBtn" title="Keep aspect ratio">🔗</button>
                <div class="size-input">
                    <label>Height</label>
                    <input type="number" id="heightInput" min="1" max="10000">
                    <span>px</span>
                </div>
            </div>

            <div class="presets">
                <button class="preset-btn" data-scale="0.25">25%</button>
                <button class="preset-btn" data-scale="0.5">50%</button>
                <button class="preset-btn" data-scale="0.75">75%</button>
                <button class="preset-btn" data-scale="2">200%</button>
            </div>

            <div class="option-row">
                <label>Format</label>
                <select id="format">
                    <option value="original">Original</option>
                    <option value="image/png">PNG</option>
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/webp">WebP</option>
                </select>
            </div>

            <div class="option-row" id="qualityRow">
                <label>Quality</label>
                <input type="range" id="quality" min="10" max="100" value="90">
                <span id="qualityValue">90%</span>
            </div>
        </div>

        <div class="actions" id="actions" style="display: none;">
            <button class="action-btn" id="downloadBtn">Download</button>
            <button class="action-btn secondary" id="clearBtn">Clear</button>
        </div>

        <div class="new-size" id="newSize"></div>
    </div>

<script>
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const originalInfo = document.getElementById('originalInfo');
    const preview = document.getElementById('preview');
    const options = document.getElementById('options');
    const actions = document.getElementById('actions');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const linkBtn = document.getElementById('linkBtn');
    const format = document.getElementById('format');
    const quality = document.getElementById('quality');
    const qualityValue = document.getElementById('qualityValue');
    const qualityRow = document.getElementById('qualityRow');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const newSize = document.getElementById('newSize');

    let originalImage = null;
    let originalWidth = 0;
    let originalHeight = 0;
    let aspectRatio = 1;
    let keepRatio = true;
    let originalFormat = 'image/png';

    uploadZone.addEventListener('click', () => fileInput.click());

    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files[0]) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) {
            handleFile(e.target.files[0]);
        }
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) return;

        originalFormat = file.type;
        const reader = new FileReader();
        reader.onload = (e) => {
            originalImage = new Image();
            originalImage.onload = () => {
                originalWidth = originalImage.width;
                originalHeight = originalImage.height;
                aspectRatio = originalWidth / originalHeight;

                originalInfo.textContent = `Original: ${originalWidth} × ${originalHeight}`;
                widthInput.value = originalWidth;
                heightInput.value = originalHeight;

                uploadZone.style.display = 'none';
                previewSection.style.display = 'block';
                options.style.display = 'block';
                actions.style.display = 'flex';

                updatePreview();
            };
            originalImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    linkBtn.addEventListener('click', () => {
        keepRatio = !keepRatio;
        linkBtn.classList.toggle('active', keepRatio);
    });
    linkBtn.classList.add('active');

    widthInput.addEventListener('input', () => {
        if (keepRatio) {
            heightInput.value = Math.round(widthInput.value / aspectRatio);
        }
        updatePreview();
    });

    heightInput.addEventListener('input', () => {
        if (keepRatio) {
            widthInput.value = Math.round(heightInput.value * aspectRatio);
        }
        updatePreview();
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const scale = parseFloat(btn.dataset.scale);
            widthInput.value = Math.round(originalWidth * scale);
            heightInput.value = Math.round(originalHeight * scale);
            updatePreview();
        });
    });

    format.addEventListener('change', () => {
        const fmt = format.value;
        qualityRow.style.display = (fmt === 'image/png') ? 'none' : 'flex';
        updatePreview();
    });

    quality.addEventListener('input', () => {
        qualityValue.textContent = quality.value + '%';
        updatePreview();
    });

    function updatePreview() {
        const w = parseInt(widthInput.value) || 1;
        const h = parseInt(heightInput.value) || 1;

        preview.width = w;
        preview.height = h;
        const ctx = preview.getContext('2d');
        ctx.drawImage(originalImage, 0, 0, w, h);

        const fmt = format.value === 'original' ? originalFormat : format.value;
        const q = quality.value / 100;
        const dataUrl = preview.toDataURL(fmt, q);
        const sizeKB = Math.round((dataUrl.length * 3) / 4 / 1024);

        newSize.innerHTML = `<span class="new-dimensions">${w} × ${h}</span> <span class="new-filesize">~${sizeKB} KB</span>`;
    }

    downloadBtn.addEventListener('click', () => {
        const fmt = format.value === 'original' ? originalFormat : format.value;
        const ext = fmt.split('/')[1];
        const q = quality.value / 100;
        const dataUrl = preview.toDataURL(fmt, q);

        const link = document.createElement('a');
        link.download = `resized.${ext}`;
        link.href = dataUrl;
        link.click();
    });

    clearBtn.addEventListener('click', () => {
        originalImage = null;
        uploadZone.style.display = 'block';
        previewSection.style.display = 'none';
        options.style.display = 'none';
        actions.style.display = 'none';
        newSize.innerHTML = '';
        fileInput.value = '';
    });
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .resizer {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 500px;
        margin: 0 auto;
    }

    .upload-zone {
        border: 2px dashed #333;
        border-radius: 12px;
        padding: 40px 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-bottom: 20px;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
        border-color: var(--text-subtle);
        background: var(--bg-input);
    }

    .upload-icon {
        font-size: 3rem;
        margin-bottom: 15px;
    }

    .upload-text {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 8px;
    }

    .upload-hint {
        font-size: 11px;
        color: var(--text-subtle);
    }

    .preview-section {
        margin-bottom: 20px;
    }

    .original-info {
        font-size: 11px;
        color: var(--text-subtle);
        margin-bottom: 10px;
    }

    #preview {
        max-width: 100%;
        max-height: 200px;
        border-radius: 8px;
        border: 1px solid var(--border);
    }

    .options {
        text-align: left;
        margin-bottom: 20px;
    }

    .size-inputs {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg-input);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
    }

    .size-input {
        flex: 1;
    }

    .size-input label {
        display: block;
        font-size: 10px;
        color: var(--text-subtle);
        margin-bottom: 5px;
        text-transform: uppercase;
    }

    .size-input input {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        outline: none;
    }

    .size-input span {
        font-size: 11px;
        color: var(--text-subtle);
    }

    .link-btn {
        width: 36px;
        height: 36px;
        background: #333;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
        margin-top: 15px;
    }

    .link-btn.active {
        background: var(--accent);
    }

    .presets {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
    }

    .preset-btn {
        flex: 1;
        padding: 10px;
        font-size: 11px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
    }

    .preset-btn:hover {
        background: #333;
        color: var(--text);
    }

    .option-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-input);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 10px;
    }

    .option-row label {
        font-size: 12px;
        color: var(--text-muted);
    }

    .option-row select {
        padding: 8px 12px;
        font-size: 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        outline: none;
    }

    .option-row input[type="range"] {
        flex: 1;
        margin: 0 15px;
        accent-color: var(--accent);
    }

    .option-row span {
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--accent);
        min-width: 40px;
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .action-btn {
        flex: 1;
        padding: 14px;
        font-size: 12px;
        font-weight: 500;
        background: #fff;
        border: none;
        border-radius: 10px;
        color: #0f0f0f;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .action-btn:hover {
        opacity: 0.9;
    }

    .action-btn.secondary {
        background: #333;
        color: #aaa;
    }

    .action-btn.secondary:hover {
        background: #444;
        color: var(--text);
    }

    .new-size {
        font-size: 13px;
    }

    .new-dimensions {
        color: var(--accent);
        font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .new-filesize {
        color: var(--text-subtle);
        margin-left: 10px;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
