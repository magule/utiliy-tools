<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Slug</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Text to Slug</h1>

    <div class="converter">
        <div class="input-section">
            <div class="section-header">
                <span>Input Text</span>
            </div>
            <input type="text" id="input" placeholder="Enter text to convert to slug...">
        </div>

        <div class="options">
            <div class="option-row">
                <label>Separator</label>
                <div class="separator-options">
                    <button class="sep-btn active" data-sep="-">dash (-)</button>
                    <button class="sep-btn" data-sep="_">underscore (_)</button>
                    <button class="sep-btn" data-sep=".">dot (.)</button>
                </div>
            </div>
            <div class="option-row">
                <label>Case</label>
                <div class="case-options">
                    <button class="case-btn active" data-case="lower">lowercase</button>
                    <button class="case-btn" data-case="upper">UPPERCASE</button>
                </div>
            </div>
            <div class="option-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="removeNumbers">
                    <span>Remove numbers</span>
                </label>
            </div>
        </div>

        <div class="output-section">
            <div class="section-header">
                <span>URL Slug</span>
                <button class="copy-btn" id="copyBtn">Copy</button>
            </div>
            <div class="output" id="output"></div>
        </div>

        <div class="preview-section">
            <div class="section-header">
                <span>URL Preview</span>
            </div>
            <div class="url-preview">
                <span class="url-base">https://example.com/</span><span class="url-slug" id="urlSlug"></span>
            </div>
        </div>
    </div>

<script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const urlSlug = document.getElementById('urlSlug');
    const copyBtn = document.getElementById('copyBtn');
    const removeNumbers = document.getElementById('removeNumbers');

    let separator = '-';
    let textCase = 'lower';

    function slugify(text) {
        let slug = text
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '') // Remove accents
            .replace(/[^\w\s-]/g, '') // Remove special chars
            .trim();

        if (removeNumbers.checked) {
            slug = slug.replace(/\d+/g, '');
        }

        slug = slug.replace(/\s+/g, separator);
        slug = slug.replace(new RegExp(`\\${separator}+`, 'g'), separator);
        slug = slug.replace(new RegExp(`^\\${separator}|\\${separator}$`, 'g'), '');

        if (textCase === 'lower') {
            slug = slug.toLowerCase();
        } else {
            slug = slug.toUpperCase();
        }

        return slug;
    }

    function update() {
        const slug = slugify(input.value);
        output.textContent = slug;
        urlSlug.textContent = slug;
    }

    input.addEventListener('input', update);
    removeNumbers.addEventListener('change', update);

    document.querySelectorAll('.sep-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.sep-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            separator = btn.dataset.sep;
            update();
        });
    });

    document.querySelectorAll('.case-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.case-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            textCase = btn.dataset.case;
            update();
        });
    });

    copyBtn.addEventListener('click', async () => {
        await navigator.clipboard.writeText(output.textContent);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1500);
    });
</script>

<style>

        padding: 0;

    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;

    /* Theme Toggle */

        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;

        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .converter {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 500px;
        margin: 0 auto;
        text-align: left;
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .section-header span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
    }

    .input-section {
        margin-bottom: 20px;
    }

    .input-section input {
        width: 100%;
        padding: 15px;
        font-size: 14px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        outline: none;
    }

    .input-section input:focus {
        border-color: var(--text-subtle);
    }

    .input-section input::placeholder {
        color: var(--text-subtle);
    }

    .options {
        background: var(--bg-input);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
    }

        display: flex;
        justify-content: space-between;

        padding: 10px 0;

        cursor: pointer;

    }

    .sep-btn:hover,
    .case-btn:hover {
        border-color: var(--text-subtle);
        color: var(--text);
    }

    .sep-btn.active,
    .case-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--text);
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        width: 100%;
    }

    .checkbox-label input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
    }

    .checkbox-label span {

        color: var(--text-muted);
    }

    .output-section {

        border-radius: 10px;
        padding: 15px;

        h1 {

    <footer class="rating-footer">

            <div class="stars" id="stars">

                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
