<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Stopwatch</h1>

    <button id="addStopwatch" class="add-btn">+ Add Stopwatch</button>

    <div id="stopwatchContainer"></div>

<script>
    let stopwatchCount = 0;

    function createStopwatch() {
        stopwatchCount++;
        const id = stopwatchCount;

        const stopwatch = {
            totalSeconds: 0,
            intervalID: null,
            isRunning: false
        };

        const container = document.createElement('div');
        container.className = 'stopwatch';
        container.id = `stopwatch-${id}`;
        container.innerHTML = `
            <div class="stopwatch-header">
                <span class="stopwatch-label" contenteditable="true" spellcheck="false">Stopwatch ${id}</span>
                <button class="remove-btn" data-id="${id}">×</button>
            </div>
            <div class="time" id="time-${id}">00:00:00</div>
            <div class="buttons">
                <button class="start-btn" data-id="${id}">Start</button>
                <button class="stop-btn" data-id="${id}">Stop</button>
                <button class="reset-btn" data-id="${id}">Reset</button>
            </div>
        `;

        document.getElementById('stopwatchContainer').appendChild(container);

        const timeDisplay = document.getElementById(`time-${id}`);

        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return [hours, minutes, seconds]
                .map(v => v.toString().padStart(2, '0'))
                .join(':');
        }

        function updateTime() {
            stopwatch.totalSeconds += 1;
            timeDisplay.textContent = formatTime(stopwatch.totalSeconds);
        }

        container.querySelector('.start-btn').addEventListener('click', () => {
            if (!stopwatch.isRunning) {
                stopwatch.intervalID = setInterval(updateTime, 1000);
                stopwatch.isRunning = true;
            }
        });

        container.querySelector('.stop-btn').addEventListener('click', () => {
            if (stopwatch.isRunning) {
                clearInterval(stopwatch.intervalID);
                stopwatch.isRunning = false;
            }
        });

        container.querySelector('.reset-btn').addEventListener('click', () => {
            clearInterval(stopwatch.intervalID);
            stopwatch.totalSeconds = 0;
            timeDisplay.textContent = formatTime(0);
            stopwatch.isRunning = false;
        });

        container.querySelector('.remove-btn').addEventListener('click', () => {
            clearInterval(stopwatch.intervalID);
            container.remove();
        });
    }

    document.getElementById('addStopwatch').addEventListener('click', createStopwatch);

    // Create one stopwatch by default
    createStopwatch();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    #stopwatchContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }

    .stopwatch {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        min-width: 260px;
    }

    .stopwatch-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .stopwatch-label {
        font-weight: 400;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #666;
        cursor: text;
        padding: 4px 8px;
        border-radius: 4px;
        outline: none;
        transition: background 0.2s ease;
    }

    .stopwatch-label:hover {
        background: #252525;
    }

    .stopwatch-label:focus {
        background: #252525;
        color: #fff;
    }

    .remove-btn {
        background: transparent;
        color: #555;
        border: none;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        min-width: 24px;
        min-height: 24px;
        padding: 0;
        margin: 0;
        aspect-ratio: 1;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;
    }

    .remove-btn:hover {
        color: #e74c3c;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 8px;
    }

    .time {
        font-weight: 300;
        font-size: 3rem;
        margin: 20px 0;
        font-family: 'SF Mono', 'Fira Code', monospace;
        letter-spacing: 2px;
        color: #fff;
    }

    button {
        margin: 0;
        padding: 10px 20px;
        font-size: 12px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    button:hover {
        opacity: 0.8;
    }

    .start-btn {
        background: #2ecc71;
        color: white;
    }

    .stop-btn {
        background: #e74c3c;
        color: white;
    }

    .reset-btn {
        background: #333;
        color: #aaa;
    }

    .add-btn {
        background: #fff;
        color: #0f0f0f;
        padding: 14px 28px;
        font-size: 13px;
        font-weight: 500;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .add-btn:hover {
        opacity: 0.9;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
