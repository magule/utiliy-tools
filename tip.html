<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Tip Calculator</h1>

    <div class="calculator">
        <div class="input-section">
            <div class="input-group">
                <label>Bill Amount</label>
                <div class="input-with-prefix">
                    <span class="prefix">$</span>
                    <input type="number" id="billAmount" min="0" step="0.01" value="50.00" placeholder="0.00">
                </div>
            </div>

            <div class="input-group">
                <label>Tip Percentage</label>
                <div class="tip-buttons">
                    <button class="tip-btn" data-tip="10">10%</button>
                    <button class="tip-btn active" data-tip="15">15%</button>
                    <button class="tip-btn" data-tip="18">18%</button>
                    <button class="tip-btn" data-tip="20">20%</button>
                    <button class="tip-btn" data-tip="25">25%</button>
                </div>
                <div class="custom-tip">
                    <input type="number" id="customTip" min="0" max="100" placeholder="Custom %">
                </div>
            </div>

            <div class="input-group">
                <label>Split Between</label>
                <div class="split-control">
                    <button class="split-btn" id="decreaseSplit">-</button>
                    <span id="splitCount">1</span>
                    <button class="split-btn" id="increaseSplit">+</button>
                </div>
            </div>
        </div>

        <div class="results-section">
            <div class="result-row">
                <span class="result-label">Tip Amount</span>
                <span class="result-value" id="tipAmount">$7.50</span>
            </div>
            <div class="result-row">
                <span class="result-label">Total</span>
                <span class="result-value" id="totalAmount">$57.50</span>
            </div>
            <div class="result-row highlight" id="perPersonRow">
                <span class="result-label">Per Person</span>
                <span class="result-value large" id="perPerson">$57.50</span>
            </div>
        </div>

        <button class="reset-btn" id="resetBtn">Reset</button>
    </div>

<script>
    let billAmount = 50;
    let tipPercent = 15;
    let splitCount = 1;

    const billInput = document.getElementById('billAmount');
    const customTipInput = document.getElementById('customTip');
    const splitCountDisplay = document.getElementById('splitCount');
    const tipAmountDisplay = document.getElementById('tipAmount');
    const totalAmountDisplay = document.getElementById('totalAmount');
    const perPersonDisplay = document.getElementById('perPerson');
    const perPersonRow = document.getElementById('perPersonRow');
    const tipBtns = document.querySelectorAll('.tip-btn');
    const decreaseSplitBtn = document.getElementById('decreaseSplit');
    const increaseSplitBtn = document.getElementById('increaseSplit');
    const resetBtn = document.getElementById('resetBtn');

    function formatCurrency(amount) {
        return '$' + amount.toFixed(2);
    }

    function calculate() {
        const tipAmount = billAmount * (tipPercent / 100);
        const total = billAmount + tipAmount;
        const perPerson = total / splitCount;

        tipAmountDisplay.textContent = formatCurrency(tipAmount);
        totalAmountDisplay.textContent = formatCurrency(total);
        perPersonDisplay.textContent = formatCurrency(perPerson);

        // Show/hide per person row
        perPersonRow.style.display = splitCount > 1 ? 'flex' : 'none';
    }

    function setActiveTipButton(percent) {
        tipBtns.forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.dataset.tip) === percent);
        });
    }

    // Bill amount input
    billInput.addEventListener('input', (e) => {
        billAmount = parseFloat(e.target.value) || 0;
        calculate();
    });

    // Tip buttons
    tipBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tipPercent = parseInt(btn.dataset.tip);
            customTipInput.value = '';
            setActiveTipButton(tipPercent);
            calculate();
        });
    });

    // Custom tip input
    customTipInput.addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        if (!isNaN(value)) {
            tipPercent = value;
            setActiveTipButton(-1); // Deselect all preset buttons
            calculate();
        }
    });

    // Split controls
    decreaseSplitBtn.addEventListener('click', () => {
        if (splitCount > 1) {
            splitCount--;
            splitCountDisplay.textContent = splitCount;
            calculate();
        }
    });

    increaseSplitBtn.addEventListener('click', () => {
        if (splitCount < 50) {
            splitCount++;
            splitCountDisplay.textContent = splitCount;
            calculate();
        }
    });

    // Reset button
    resetBtn.addEventListener('click', () => {
        billAmount = 50;
        tipPercent = 15;
        splitCount = 1;

        billInput.value = '50.00';
        customTipInput.value = '';
        splitCountDisplay.textContent = '1';
        setActiveTipButton(15);
        calculate();
    });

    // Initialize
    calculate();
</script>

<style>

        padding: 0;
        box-sizing: border-box;
    }

        --accent: #0d9488;
        --accent-hover: #0f766e;

        --star-inactive: #d1d5db;

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .calculator {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 400px;
        margin: 0 auto;
    }

    .input-section {
        margin-bottom: 30px;
    }

    .input-group {
        margin-bottom: 25px;
        text-align: left;
    }

    .input-group label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-subtle);
        margin-bottom: 10px;
    }

    .input-with-prefix {
        position: relative;
        display: flex;
        align-items: center;
    }

    .prefix {
        position: absolute;
        left: 15px;
        font-size: 1.5rem;
        font-weight: 300;
        color: var(--text-subtle);
    }

    .input-with-prefix input {
        width: 100%;
        padding: 15px 15px 15px 35px;
        font-size: 1.5rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease;
    }

    .input-with-prefix input:focus {
        border-color: var(--text-subtle);
    }

    .tip-buttons {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }

    .tip-btn {
        flex: 1;
        padding: 12px 8px;
        font-size: 12px;
        font-weight: 500;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .tip-btn:hover {
        border-color: var(--text-subtle);
        color: var(--text);
    }

    .tip-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--text);
    }

    .custom-tip input {
        width: 100%;
        padding: 12px 15px;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        outline: none;
        text-align: center;
        transition: border-color 0.2s ease;
    }

    .custom-tip input:focus {
        border-color: var(--text-subtle);
    }

    .custom-tip input::placeholder {
        color: var(--text-subtle);
    }

    .split-control {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
    }

    .split-btn {
        width: 44px;
        height: 44px;
        font-size: 20px;
        font-weight: 300;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 50%;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .split-btn:hover {
        border-color: var(--text-subtle);
        color: var(--text);
    }

    #splitCount {
        font-size: 2rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;

        text-align: center;
        color: var(--text);
    }

    .results-section {
        background: var(--bg-input);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
    }

    .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #333;
    }

    .result-row:last-child {

    }

    .result-row.highlight {
        margin-top: 10px;
        padding-top: 20px;
        border-top: 1px solid #333;

    .result-label {

    .result-value.large {

    .reset-btn {

        padding: 14px;
        font-size: 12px;

        background: #333;
        border: none;
        border-radius: 10px;
        color: var(--text-muted);
        cursor: pointer;

    /* Hide number input spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {

        appearance: textfield;
    }
    .back-btn {

        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;

        border-color: var(--border);
    }

        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);

    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {

    }

    .star.active {
        color: var(--star);
    }

        display: block;
        margin-top: 8px;
        font-size: 11px;

    @media (max-width: 600px) {

            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
