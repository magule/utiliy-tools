<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Todo List</h1>

    <div class="todo-app">
        <div class="add-todo">
            <input type="text" id="todoInput" placeholder="Add a new task..." autocomplete="off">
            <button id="addBtn" class="add-btn">Add</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div id="todoList"></div>

        <div class="todo-footer" id="todoFooter">
            <span id="itemCount">0 items</span>
            <button id="clearCompleted" class="clear-btn">Clear Completed</button>
        </div>
    </div>

<script>
    let todos = JSON.parse(localStorage.getItem('todos')) || [];
    let currentFilter = 'all';

    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const todoList = document.getElementById('todoList');
    const itemCount = document.getElementById('itemCount');
    const clearCompletedBtn = document.getElementById('clearCompleted');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const todoFooter = document.getElementById('todoFooter');

    function saveTodos() {
        localStorage.setItem('todos', JSON.stringify(todos));
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function renderTodos() {
        const filtered = todos.filter(todo => {
            if (currentFilter === 'active') return !todo.completed;
            if (currentFilter === 'completed') return todo.completed;
            return true;
        });

        todoList.innerHTML = '';

        if (filtered.length === 0) {
            todoList.innerHTML = `
                <div class="empty-state">
                    ${currentFilter === 'all' ? 'No tasks yet. Add one above!' :
                      currentFilter === 'active' ? 'No active tasks.' : 'No completed tasks.'}
                </div>
            `;
        } else {
            filtered.forEach(todo => {
                const div = document.createElement('div');
                div.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <label class="checkbox">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} data-id="${todo.id}">
                        <span class="checkmark"></span>
                    </label>
                    <span class="todo-text" contenteditable="true" data-id="${todo.id}">${escapeHtml(todo.text)}</span>
                    <button class="delete-btn" data-id="${todo.id}">×</button>
                `;
                todoList.appendChild(div);
            });
        }

        // Update count
        const activeCount = todos.filter(t => !t.completed).length;
        itemCount.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;

        // Show/hide footer
        todoFooter.style.display = todos.length > 0 ? 'flex' : 'none';

        // Show/hide clear completed
        const completedCount = todos.filter(t => t.completed).length;
        clearCompletedBtn.style.display = completedCount > 0 ? 'block' : 'none';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function addTodo(text) {
        if (!text.trim()) return;

        todos.unshift({
            id: generateId(),
            text: text.trim(),
            completed: false,
            createdAt: Date.now()
        });

        saveTodos();
        renderTodos();
        todoInput.value = '';
    }

    function toggleTodo(id) {
        const todo = todos.find(t => t.id === id);
        if (todo) {
            todo.completed = !todo.completed;
            saveTodos();
            renderTodos();
        }
    }

    function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        saveTodos();
        renderTodos();
    }

    function updateTodoText(id, newText) {
        const todo = todos.find(t => t.id === id);
        if (todo && newText.trim()) {
            todo.text = newText.trim();
            saveTodos();
        } else if (todo && !newText.trim()) {
            deleteTodo(id);
        }
    }

    function clearCompleted() {
        todos = todos.filter(t => !t.completed);
        saveTodos();
        renderTodos();
    }

    // Event listeners
    addBtn.addEventListener('click', () => addTodo(todoInput.value));

    todoInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            addTodo(todoInput.value);
        }
    });

    todoList.addEventListener('change', (e) => {
        if (e.target.type === 'checkbox') {
            toggleTodo(e.target.dataset.id);
        }
    });

    todoList.addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-btn')) {
            deleteTodo(e.target.dataset.id);
        }
    });

    todoList.addEventListener('blur', (e) => {
        if (e.target.classList.contains('todo-text')) {
            updateTodoText(e.target.dataset.id, e.target.textContent);
        }
    }, true);

    todoList.addEventListener('keypress', (e) => {
        if (e.target.classList.contains('todo-text') && e.key === 'Enter') {
            e.preventDefault();
            e.target.blur();
        }
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderTodos();
        });
    });

    clearCompletedBtn.addEventListener('click', clearCompleted);

    // Initialize
    renderTodos();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .todo-app {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 500px;
        margin: 0 auto;
    }

    .add-todo {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .add-todo input {
        flex: 1;
        padding: 14px 18px;
        font-size: 14px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s ease;
    }

    .add-todo input:focus {
        border-color: var(--text-subtle);
    }

    .add-todo input::placeholder {
        color: var(--text-subtle);
    }

    .add-btn {
        background: #fff;
        color: #0f0f0f;
        padding: 14px 24px;
        font-size: 12px;
        font-weight: 500;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.2s ease;
    }

    .add-btn:hover {
        opacity: 0.9;
    }

    .filters {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #252525;
    }

    .filter-btn {
        background: transparent;
        color: var(--text-subtle);
        border: 1px solid transparent;
        padding: 8px 16px;
        font-size: 11px;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .filter-btn:hover {
        color: var(--text-muted);
    }

    .filter-btn.active {
        border-color: var(--border);
        color: var(--text);
    }

    #todoList {
        text-align: left;
    }

    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-subtle);
        font-size: 14px;
    }

    .todo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px;
        background: var(--bg-input);
        border-radius: 10px;
        margin-bottom: 10px;
        transition: all 0.2s ease;
    }

    .todo-item:hover {
        background: #2a2a2a;
    }

    .todo-item.completed .todo-text {
        color: var(--text-subtle);
        text-decoration: line-through;
    }

    /* Custom checkbox */
    .checkbox {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        cursor: pointer;
    }

    .checkbox input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
    }

    .checkmark {
        width: 22px;
        height: 22px;
        border: 2px solid #444;
        border-radius: 50%;
        transition: all 0.2s ease;
    }

    .checkbox:hover .checkmark {
        border-color: #666;
    }

    .checkbox input:checked ~ .checkmark {
        background: var(--accent);
        border-color: var(--accent);
    }

    .checkbox input:checked ~ .checkmark:after {
        content: '';
        position: absolute;
        left: 7px;
        top: 3px;
        width: 5px;
        height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .todo-text {
        flex: 1;
        font-size: 14px;
        color: var(--text-secondary);
        outline: none;
        padding: 4px 8px;
        border-radius: 4px;
        transition: background 0.2s ease;
        word-break: break-word;
    }

    .todo-text:hover {
        background: #333;
    }

    .todo-text:focus {
        background: #333;
        color: var(--text);
    }

    .delete-btn {
        background: transparent;
        color: var(--text-subtle);
        border: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        opacity: 0;
    }

    .todo-item:hover .delete-btn {
        opacity: 1;
    }

    .delete-btn:hover {
        color: var(--danger);
        background: rgba(231, 76, 60, 0.1);
    }

    .todo-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #252525;
    }

    #itemCount {
        font-size: 12px;
        color: var(--text-subtle);
    }

    .clear-btn {
        background: transparent;
        color: var(--text-subtle);
        border: none;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: color 0.2s ease;
    }

    .clear-btn:hover {
        color: var(--danger);
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
