<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter/X Character Counter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Twitter/X Counter</h1>

    <div class="counter">
        <div class="input-section">
            <textarea id="input" placeholder="What's happening?"></textarea>
            <div class="char-limit">
                <div class="char-ring" id="charRing">
                    <svg viewBox="0 0 36 36">
                        <circle class="ring-bg" cx="18" cy="18" r="16"/>
                        <circle class="ring-fill" id="ringFill" cx="18" cy="18" r="16"/>
                    </svg>
                    <span id="charRemaining">280</span>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-value" id="charCount">0</span>
                <span class="stat-label">Characters</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="wordCount">0</span>
                <span class="stat-label">Words</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="tweetCount">1</span>
                <span class="stat-label">Tweets</span>
            </div>
        </div>

        <div class="warnings" id="warnings"></div>

        <div class="preview-section">
            <div class="section-header">
                <span>Tweet Preview</span>
            </div>
            <div class="tweet-preview" id="tweetPreview">
                <div class="tweet-header">
                    <div class="tweet-avatar"></div>
                    <div class="tweet-user">
                        <span class="tweet-name">Your Name</span>
                        <span class="tweet-handle">@yourhandle</span>
                    </div>
                </div>
                <div class="tweet-content" id="tweetContent"></div>
                <div class="tweet-footer">
                    <span>Just now</span>
                </div>
            </div>
        </div>

        <div class="thread-preview" id="threadPreview" style="display: none;">
            <div class="section-header">
                <span>Thread Preview</span>
            </div>
            <div id="threadContent"></div>
        </div>
    </div>

<script>
    const input = document.getElementById('input');
    const charCount = document.getElementById('charCount');
    const wordCount = document.getElementById('wordCount');
    const tweetCount = document.getElementById('tweetCount');
    const charRemaining = document.getElementById('charRemaining');
    const ringFill = document.getElementById('ringFill');
    const charRing = document.getElementById('charRing');
    const warnings = document.getElementById('warnings');
    const tweetContent = document.getElementById('tweetContent');
    const tweetPreview = document.getElementById('tweetPreview');
    const threadPreview = document.getElementById('threadPreview');
    const threadContent = document.getElementById('threadContent');

    const MAX_CHARS = 280;
    const circumference = 2 * Math.PI * 16;
    ringFill.style.strokeDasharray = circumference;

    function countTwitterLength(text) {
        // URLs count as 23 characters
        const urlRegex = /https?:\/\/\S+/g;
        let length = text.length;
        const urls = text.match(urlRegex) || [];

        urls.forEach(url => {
            length = length - url.length + 23;
        });

        return length;
    }

    function highlightUrls(text) {
        return text.replace(/(https?:\/\/\S+)/g, '<span class="url">$1</span>');
    }

    function highlightMentions(text) {
        return text.replace(/(@\w+)/g, '<span class="mention">$1</span>');
    }

    function highlightHashtags(text) {
        return text.replace(/(#\w+)/g, '<span class="hashtag">$1</span>');
    }

    function formatTweet(text) {
        let formatted = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        formatted = highlightUrls(formatted);
        formatted = highlightMentions(formatted);
        formatted = highlightHashtags(formatted);
        formatted = formatted.replace(/\n/g, '<br>');
        return formatted;
    }

    function splitIntoTweets(text, maxLength = MAX_CHARS) {
        if (countTwitterLength(text) <= maxLength) {
            return [text];
        }

        const tweets = [];
        const words = text.split(' ');
        let currentTweet = '';

        for (const word of words) {
            const testTweet = currentTweet ? currentTweet + ' ' + word : word;
            const numbering = tweets.length > 0 || countTwitterLength(text) > maxLength
                ? ` (${tweets.length + 1}/?)` : '';

            if (countTwitterLength(testTweet + numbering) <= maxLength - 10) {
                currentTweet = testTweet;
            } else {
                if (currentTweet) tweets.push(currentTweet);
                currentTweet = word;
            }
        }

        if (currentTweet) tweets.push(currentTweet);

        // Add numbering
        return tweets.map((tweet, i) => `${tweet} (${i + 1}/${tweets.length})`);
    }

    function update() {
        const text = input.value;
        const length = countTwitterLength(text);
        const remaining = MAX_CHARS - length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;

        charCount.textContent = length;
        wordCount.textContent = words;
        charRemaining.textContent = Math.abs(remaining);

        // Update ring
        const progress = Math.min(length / MAX_CHARS, 1);
        const offset = circumference - (progress * circumference);
        ringFill.style.strokeDashoffset = offset;

        // Update colors
        if (remaining < 0) {
            charRing.classList.add('over');
            charRing.classList.remove('warning');
            charRemaining.textContent = remaining;
        } else if (remaining <= 20) {
            charRing.classList.add('warning');
            charRing.classList.remove('over');
        } else {
            charRing.classList.remove('warning', 'over');
        }

        // Warnings
        const warningList = [];
        if (remaining < 0) {
            warningList.push(`${Math.abs(remaining)} characters over limit`);
        }

        warnings.innerHTML = warningList.map(w =>
            `<div class="warning-item">${w}</div>`
        ).join('');

        // Preview
        if (text.trim()) {
            tweetContent.innerHTML = formatTweet(text);
            tweetPreview.style.display = 'block';
        } else {
            tweetPreview.style.display = 'block';
            tweetContent.innerHTML = '<span class="placeholder">Your tweet will appear here</span>';
        }

        // Thread
        if (length > MAX_CHARS) {
            const tweets = splitIntoTweets(text);
            tweetCount.textContent = tweets.length;

            threadContent.innerHTML = tweets.map((tweet, i) => `
                <div class="thread-tweet">
                    <div class="thread-connector"></div>
                    <div class="tweet-preview mini">
                        <div class="tweet-header">
                            <div class="tweet-avatar small"></div>
                            <div class="tweet-user">
                                <span class="tweet-name">Your Name</span>
                            </div>
                        </div>
                        <div class="tweet-content">${formatTweet(tweet)}</div>
                    </div>
                </div>
            `).join('');

            threadPreview.style.display = 'block';
        } else {
            tweetCount.textContent = '1';
            threadPreview.style.display = 'none';
        }
    }

    input.addEventListener('input', update);
    update();
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    /* Theme Variables */
    body[data-theme="dark"] {
        --bg: #0f0f0f;
        --bg-card: #1a1a1a;
        --bg-card-hover: #1e1e1e;
        --bg-input: #252525;
        --border: #2a2a2a;
        --border-hover: #333;
        --text: #fff;
        --text-secondary: #ddd;
        --text-muted: #888;
        --text-subtle: #555;
        --accent: #2ecc71;
        --accent-hover: #27ae60;
        --danger: #e74c3c;
        --star: #f39c12;
        --star-inactive: #333;
    }

    body[data-theme="light"] {
        --bg: #f5f5f7;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --bg-input: #f0f0f2;
        --border: #d1d5db;
        --border-hover: #14b8a6;
        --text: #111827;
        --text-secondary: #1f2937;
        --text-muted: #4b5563;
        --text-subtle: #6b7280;
        --accent: #0d9488;
        --accent-hover: #0f766e;
        --danger: #dc2626;
        --star: #f59e0b;
        --star-inactive: #d1d5db;
    }

    body {
        background: var(--bg);
        color: var(--text);
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* Theme Toggle */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .theme-toggle:hover {
        border-color: var(--border-hover);
        color: var(--text);
    }

    body[data-theme="dark"] .sun-icon { display: none; }
    body[data-theme="dark"] .moon-icon { display: block; }
    body[data-theme="light"] .sun-icon { display: block; }
    body[data-theme="light"] .moon-icon { display: none; }


    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .counter {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px;
        max-width: 550px;
        margin: 0 auto;
        text-align: left;
    }

    .input-section {
        position: relative;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        height: 120px;
        padding: 15px;
        padding-right: 60px;
        font-size: 16px;
        font-family: inherit;
        line-height: 1.5;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        outline: none;
        resize: none;
    }

    textarea:focus {
        border-color: #1da1f2;
    }

    textarea::placeholder {
        color: var(--text-subtle);
    }

    .char-limit {
        position: absolute;
        bottom: 15px;
        right: 15px;
    }

    .char-ring {
        width: 36px;
        height: 36px;
        position: relative;
    }

    .char-ring svg {
        transform: rotate(-90deg);
    }

    .ring-bg {
        fill: none;
        stroke: #333;
        stroke-width: 2;
    }

    .ring-fill {
        fill: none;
        stroke: #1da1f2;
        stroke-width: 2;
        transition: stroke-dashoffset 0.2s;
    }

    .char-ring.warning .ring-fill {
        stroke: #f1c40f;
    }

    .char-ring.over .ring-fill {
        stroke: #e74c3c;
    }

    .char-ring span {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 10px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--text-muted);
    }

    .char-ring.warning span {
        color: #f1c40f;
    }

    .char-ring.over span {

    .stats {

        justify-content: center;

        margin-bottom: 20px;

    .section-header {

    .section-header span {

        text-transform: uppercase;

        color: var(--text-subtle);
    }

    .tweet-preview {
        background: var(--bg-input);
        border-radius: 12px;
        padding: 15px;
    }

    .tweet-header {

        align-items: center;

    .tweet-avatar {

        height: 40px;

        border-radius: 50%;

    .tweet-name {

    .tweet-handle {

    .tweet-content {

    }

    .tweet-content .placeholder {

    }

    .tweet-content .url {

    }

    }

    .tweet-footer {

        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--text-subtle);
        text-decoration: none;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: var(--text);
        border-color: var(--border);
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border);
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-subtle);
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: var(--star);
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--accent);
    }

    @media (max-width: 600px) {
        body {
            padding: 60px 16px 30px;
        }
        .theme-toggle {
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
        }


        h1 {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .back-btn {
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .rating-footer {
            margin-top: 40px;
        }

        .star {
            font-size: 28px;
        }

        .stars {
            gap: 8px;
        }
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>
