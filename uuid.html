<html>
<head>

<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>UUID Generator</h1>

    <div class="generator">
        <div class="uuid-display">
            <div class="uuid-text" id="uuid">Click Generate</div>
            <div class="uuid-actions">
                <button class="action-btn" id="copyBtn" title="Copy">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="options">
            <div class="option-row">
                <label>Version</label>
                <select id="version">
                    <option value="4">UUID v4 (Random)</option>
                    <option value="1">UUID v1 (Time-based)</option>
                </select>
            </div>

            <div class="option-row">
                <label>Format</label>
                <select id="format">
                    <option value="standard">Standard (with dashes)</option>
                    <option value="nodash">No dashes</option>
                    <option value="braces">With braces</option>
                    <option value="urn">URN format</option>
                </select>
            </div>

            <div class="option-row">
                <label>Case</label>
                <select id="case">
                    <option value="lower">Lowercase</option>
                    <option value="upper">Uppercase</option>
                </select>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate UUID</button>

        <div class="bulk-section">
            <div class="bulk-header">
                <span>Bulk Generate</span>
                <div class="bulk-controls">
                    <input type="number" id="bulkCount" min="2" max="100" value="5">
                    <button class="bulk-btn" id="bulkBtn">Generate</button>
                </div>
            </div>
            <div class="bulk-output" id="bulkOutput"></div>
        </div>
    </div>

<script>
    const uuidEl = document.getElementById('uuid');
    const copyBtn = document.getElementById('copyBtn');
    const generateBtn = document.getElementById('generateBtn');
    const versionSelect = document.getElementById('version');
    const formatSelect = document.getElementById('format');
    const caseSelect = document.getElementById('case');
    const bulkCount = document.getElementById('bulkCount');
    const bulkBtn = document.getElementById('bulkBtn');
    const bulkOutput = document.getElementById('bulkOutput');

    function generateUUIDv4() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    function generateUUIDv1() {
        // Simplified v1-like UUID (not fully compliant but similar format)
        const now = Date.now();
        const timeHex = now.toString(16).padStart(12, '0');

        const random = crypto.getRandomValues(new Uint8Array(8));
        const randomHex = Array.from(random).map(b => b.toString(16).padStart(2, '0')).join('');

        return `${timeHex.slice(0, 8)}-${timeHex.slice(8, 12)}-1${randomHex.slice(0, 3)}-${(parseInt(randomHex.slice(3, 5), 16) & 0x3f | 0x80).toString(16)}${randomHex.slice(5, 7)}-${randomHex.slice(7, 19)}`.toLowerCase();
    }

    function formatUUID(uuid) {
        const format = formatSelect.value;
        const caseType = caseSelect.value;

        let formatted = uuid;

        switch (format) {
            case 'nodash':
                formatted = uuid.replace(/-/g, '');
                break;
            case 'braces':
                formatted = `{${uuid}}`;
                break;
            case 'urn':
                formatted = `urn:uuid:${uuid}`;
                break;
        }

        return caseType === 'upper' ? formatted.toUpperCase() : formatted.toLowerCase();
    }

    function generate() {
        const version = versionSelect.value;
        let uuid = version === '4' ? generateUUIDv4() : generateUUIDv1();
        uuidEl.textContent = formatUUID(uuid);
    }

    function generateBulk() {
        const count = Math.min(Math.max(parseInt(bulkCount.value) || 5, 2), 100);
        const version = versionSelect.value;
        const uuids = [];

        for (let i = 0; i < count; i++) {
            const uuid = version === '4' ? generateUUIDv4() : generateUUIDv1();
            uuids.push(formatUUID(uuid));
        }

        bulkOutput.innerHTML = uuids.map(uuid => `
            <div class="bulk-item">
                <span>${uuid}</span>
                <button class="copy-item" data-uuid="${uuid}">Copy</button>
            </div>
        `).join('');
    }

    async function copyToClipboard(text, button) {
        await navigator.clipboard.writeText(text);
        const originalText = button.textContent;
        button.textContent = 'Copied!';
        setTimeout(() => {
            button.textContent = originalText;
        }, 1500);
    }

    generateBtn.addEventListener('click', generate);
    bulkBtn.addEventListener('click', generateBulk);

    copyBtn.addEventListener('click', async () => {
        const uuid = uuidEl.textContent;
        if (uuid && uuid !== 'Click Generate') {
            await navigator.clipboard.writeText(uuid);
            copyBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            `;
            setTimeout(() => {
                copyBtn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                `;
            }, 2000);
        }
    });

    bulkOutput.addEventListener('click', (e) => {
        if (e.target.classList.contains('copy-item')) {
            copyToClipboard(e.target.dataset.uuid, e.target);
        }
    });

    [versionSelect, formatSelect, caseSelect].forEach(el => {
        el.addEventListener('change', generate);
    });
</script>

            <span class="rating-thanks" id="ratingThanks"></span>

<script>
(function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);

    themeToggle.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });
})();
</script>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>
