<!DOCTYPE html>
<html>
<head>
    <title>Water Intake Tracker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Water Intake</h1>

    <div class="tracker">
        <div class="glass-display">
            <div class="glass">
                <div class="water" id="waterFill"></div>
                <div class="glass-marks">
                    <span>100%</span>
                    <span>75%</span>
                    <span>50%</span>
                    <span>25%</span>
                </div>
            </div>
        </div>

        <div class="progress-info">
            <div class="current-amount">
                <span class="amount-value" id="currentAmount">0</span>
                <span class="amount-unit">ml</span>
            </div>
            <div class="goal-text">of <span id="goalAmount">2000</span> ml goal</div>
            <div class="percentage" id="percentage">0%</div>
        </div>

        <div class="quick-add">
            <button class="add-btn" data-amount="100">+100ml</button>
            <button class="add-btn" data-amount="250">+250ml</button>
            <button class="add-btn" data-amount="500">+500ml</button>
        </div>

        <div class="custom-add">
            <input type="number" id="customAmount" placeholder="Custom amount" min="0">
            <button id="addCustomBtn">Add</button>
        </div>

        <div class="settings">
            <div class="setting-row">
                <label>Daily Goal</label>
                <div class="setting-input">
                    <input type="number" id="goalInput" value="2000" min="500" max="5000" step="100">
                    <span>ml</span>
                </div>
            </div>
        </div>

        <div class="history" id="history">
            <div class="history-header">Today's Log</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <button class="reset-btn" id="resetBtn">Reset Today</button>
    </div>

<script>
    const storageKey = 'waterIntake';

    function getTodayKey() {
        return new Date().toISOString().split('T')[0];
    }

    function loadData() {
        const data = JSON.parse(localStorage.getItem(storageKey)) || {};
        const todayKey = getTodayKey();
        if (!data[todayKey]) {
            data[todayKey] = { entries: [], goal: 2000 };
        }
        return data;
    }

    function saveData(data) {
        localStorage.setItem(storageKey, JSON.stringify(data));
    }

    function getTodayData() {
        const data = loadData();
        return data[getTodayKey()];
    }

    function updateUI() {
        const today = getTodayData();
        const total = today.entries.reduce((sum, e) => sum + e.amount, 0);
        const goal = today.goal;
        const percent = Math.min((total / goal) * 100, 100);

        document.getElementById('currentAmount').textContent = total;
        document.getElementById('goalAmount').textContent = goal;
        document.getElementById('percentage').textContent = Math.round(percent) + '%';
        document.getElementById('waterFill').style.height = percent + '%';
        document.getElementById('goalInput').value = goal;

        // Update history
        const historyList = document.getElementById('historyList');
        if (today.entries.length === 0) {
            historyList.innerHTML = '<div class="no-entries">No entries yet</div>';
        } else {
            historyList.innerHTML = today.entries.slice().reverse().map((entry, i) => `
                <div class="history-item">
                    <span class="history-time">${formatTime(entry.time)}</span>
                    <span class="history-amount">+${entry.amount} ml</span>
                    <button class="delete-entry" data-index="${today.entries.length - 1 - i}">×</button>
                </div>
            `).join('');
        }
    }

    function formatTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function addWater(amount) {
        if (amount <= 0) return;

        const data = loadData();
        const todayKey = getTodayKey();

        data[todayKey].entries.push({
            amount: amount,
            time: Date.now()
        });

        saveData(data);
        updateUI();
    }

    function deleteEntry(index) {
        const data = loadData();
        const todayKey = getTodayKey();
        data[todayKey].entries.splice(index, 1);
        saveData(data);
        updateUI();
    }

    function updateGoal(goal) {
        const data = loadData();
        const todayKey = getTodayKey();
        data[todayKey].goal = goal;
        saveData(data);
        updateUI();
    }

    function resetToday() {
        const data = loadData();
        const todayKey = getTodayKey();
        data[todayKey].entries = [];
        saveData(data);
        updateUI();
    }

    // Event listeners
    document.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            addWater(parseInt(btn.dataset.amount));
        });
    });

    document.getElementById('addCustomBtn').addEventListener('click', () => {
        const amount = parseInt(document.getElementById('customAmount').value);
        if (amount > 0) {
            addWater(amount);
            document.getElementById('customAmount').value = '';
        }
    });

    document.getElementById('customAmount').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('addCustomBtn').click();
        }
    });

    document.getElementById('goalInput').addEventListener('change', (e) => {
        updateGoal(parseInt(e.target.value) || 2000);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('Reset today\'s water intake?')) {
            resetToday();
        }
    });

    document.getElementById('historyList').addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-entry')) {
            deleteEntry(parseInt(e.target.dataset.index));
        }
    });

    // Initialize
    updateUI();
</script>

<style>

        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .tracker {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        max-width: 400px;
        margin: 0 auto;
    }

    .glass-display {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
    }

    .glass {
        position: relative;
        width: 120px;
        height: 180px;
        background: #252525;
        border-radius: 10px 10px 20px 20px;
        overflow: hidden;
        border: 2px solid #333;
    }

    .water {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 0%;
        background: linear-gradient(180deg, #3498db, #2980b9);
        transition: height 0.5s ease;
    }

    .glass-marks {
        position: absolute;
        top: 0;
        right: 8px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 10px 0;
    }

    .glass-marks span {
        font-size: 8px;
        color: #555;
    }

    .progress-info {
        margin-bottom: 25px;
    }

    .current-amount {
        margin-bottom: 5px;
    }

    .amount-value {
        font-size: 3rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #3498db;
    }

    .amount-unit {
        font-size: 1rem;
        color: #555;
    }

    .goal-text {
        font-size: 13px;
        color: #555;
        margin-bottom: 5px;
    }

    .percentage {
        font-size: 14px;
        font-weight: 500;
        color: #3498db;
    }

    .quick-add {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .add-btn {
        flex: 1;
        padding: 14px 10px;
        font-size: 12px;
        font-weight: 500;
        background: #3498db;
        border: none;
        border-radius: 10px;
        color: #fff;
        cursor: pointer;
        transition: opacity 0.2s ease;
    }

    .add-btn:hover {
        opacity: 0.9;
    }

    .custom-add {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .custom-add input {
        flex: 1;
        padding: 12px 15px;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        color: #fff;
        outline: none;
    }

    .custom-add input:focus {
        border-color: #444;
    }

    .custom-add input::placeholder {
        color: #555;
    }

    .custom-add button {
        padding: 12px 20px;
        font-size: 12px;
        font-weight: 500;
        background: #333;
        border: none;
        border-radius: 8px;
        color: #aaa;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s ease;
    }

    .custom-add button:hover {
        background: #444;
        color: #fff;
    }

    .settings {
        margin-bottom: 20px;
        padding: 15px;
        background: #252525;
        border-radius: 10px;
    }

    .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .setting-row label {
        font-size: 12px;
        color: #666;
    }

    .setting-input {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .setting-input input {
        width: 80px;
        padding: 8px;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        color: #fff;
        text-align: center;
        outline: none;
    }

    .setting-input span {
        font-size: 12px;
        color: #555;
    }

    .history {
        margin-bottom: 20px;
        text-align: left;
    }

    .history-header {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #555;
        margin-bottom: 10px;
    }

    .history-list {
        background: #252525;
        border-radius: 10px;
        max-height: 150px;
        overflow-y: auto;
    }

    .no-entries {
        padding: 20px;
        text-align: center;
        color: #444;
        font-size: 13px;
    }

    .history-item {
        display: flex;
        align-items: center;
        padding: 12px 15px;
        border-bottom: 1px solid #333;
    }

    .history-item:last-child {
        border-bottom: none;
    }

    .history-time {
        font-size: 12px;
        color: #555;
        min-width: 70px;
    }

    .history-amount {
        flex: 1;
        font-size: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #3498db;
    }

    .delete-entry {
        background: transparent;
        border: none;
        color: #444;
        font-size: 18px;
        cursor: pointer;
        padding: 0 5px;
        transition: color 0.2s ease;
    }

    .delete-entry:hover {
        color: #e74c3c;
    }

    .reset-btn {
        width: 100%;
        padding: 12px;
        font-size: 11px;
        font-weight: 500;
        background: transparent;
        border: 1px solid #333;
        border-radius: 8px;
        color: #555;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .reset-btn:hover {
        border-color: #e74c3c;
        color: #e74c3c;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
