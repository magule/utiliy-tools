<!DOCTYPE html>
<html>
<head>
    <title>Word Frequency Counter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <a href="index.html" class="back-btn">← Back</a>
    <h1>Word Frequency Counter</h1>

    <div class="counter">
        <div class="input-section">
            <textarea id="input" placeholder="Paste your text here to analyze word frequency..."></textarea>
        </div>

        <div class="options">
            <label class="checkbox-label">
                <input type="checkbox" id="ignoreCase" checked>
                <span>Ignore case</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="ignoreNumbers">
                <span>Ignore numbers</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="ignoreCommon">
                <span>Ignore common words</span>
            </label>
            <div class="min-length">
                <span>Min length:</span>
                <input type="number" id="minLength" value="1" min="1" max="20">
            </div>
        </div>

        <div class="summary" id="summary">
            <div class="summary-item">
                <span class="summary-value" id="uniqueWords">0</span>
                <span class="summary-label">Unique Words</span>
            </div>
            <div class="summary-item">
                <span class="summary-value" id="totalWords">0</span>
                <span class="summary-label">Total Words</span>
            </div>
        </div>

        <div class="results" id="results">
            <div class="empty-state">Enter text to see word frequency</div>
        </div>
    </div>

<script>
    const input = document.getElementById('input');
    const ignoreCase = document.getElementById('ignoreCase');
    const ignoreNumbers = document.getElementById('ignoreNumbers');
    const ignoreCommon = document.getElementById('ignoreCommon');
    const minLength = document.getElementById('minLength');
    const uniqueWords = document.getElementById('uniqueWords');
    const totalWords = document.getElementById('totalWords');
    const results = document.getElementById('results');

    const commonWords = new Set([
        'the', 'be', 'to', 'of', 'and', 'a', 'in', 'that', 'have', 'i',
        'it', 'for', 'not', 'on', 'with', 'he', 'as', 'you', 'do', 'at',
        'this', 'but', 'his', 'by', 'from', 'they', 'we', 'say', 'her', 'she',
        'or', 'an', 'will', 'my', 'one', 'all', 'would', 'there', 'their', 'what',
        'so', 'up', 'out', 'if', 'about', 'who', 'get', 'which', 'go', 'me',
        'when', 'make', 'can', 'like', 'time', 'no', 'just', 'him', 'know', 'take',
        'people', 'into', 'year', 'your', 'good', 'some', 'could', 'them', 'see', 'other',
        'than', 'then', 'now', 'look', 'only', 'come', 'its', 'over', 'think', 'also',
        'back', 'after', 'use', 'two', 'how', 'our', 'work', 'first', 'well', 'way',
        'even', 'new', 'want', 'because', 'any', 'these', 'give', 'day', 'most', 'us',
        'is', 'are', 'was', 'were', 'been', 'being', 'has', 'had', 'having', 'does',
        'did', 'doing', 'am'
    ]);

    function analyze() {
        const text = input.value;
        if (!text.trim()) {
            results.innerHTML = '<div class="empty-state">Enter text to see word frequency</div>';
            uniqueWords.textContent = '0';
            totalWords.textContent = '0';
            return;
        }

        let words = text.match(/\b[\w']+\b/g) || [];

        if (ignoreCase.checked) {
            words = words.map(w => w.toLowerCase());
        }

        if (ignoreNumbers.checked) {
            words = words.filter(w => !/^\d+$/.test(w));
        }

        const minLen = parseInt(minLength.value) || 1;
        words = words.filter(w => w.length >= minLen);

        if (ignoreCommon.checked) {
            words = words.filter(w => !commonWords.has(w.toLowerCase()));
        }

        const freq = {};
        for (const word of words) {
            freq[word] = (freq[word] || 0) + 1;
        }

        const sorted = Object.entries(freq)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 50);

        const maxCount = sorted.length > 0 ? sorted[0][1] : 1;

        uniqueWords.textContent = Object.keys(freq).length;
        totalWords.textContent = words.length;

        if (sorted.length === 0) {
            results.innerHTML = '<div class="empty-state">No words found</div>';
            return;
        }

        results.innerHTML = sorted.map(([word, count], i) => {
            const percent = (count / maxCount) * 100;
            return `
                <div class="word-item">
                    <span class="word-rank">${i + 1}</span>
                    <div class="word-info">
                        <div class="word-text">${word}</div>
                        <div class="word-bar">
                            <div class="word-bar-fill" style="width: ${percent}%"></div>
                        </div>
                    </div>
                    <span class="word-count">${count}</span>
                </div>
            `;
        }).join('');
    }

    input.addEventListener('input', analyze);
    ignoreCase.addEventListener('change', analyze);
    ignoreNumbers.addEventListener('change', analyze);
    ignoreCommon.addEventListener('change', analyze);
    minLength.addEventListener('input', analyze);
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 60px 20px;
        min-height: 100vh;
        background: #0f0f0f;
        color: #fff;
    }

    h1 {
        margin-bottom: 40px;
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #888;
    }

    .counter {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 30px;
        max-width: 550px;
        margin: 0 auto;
    }

    .input-section {
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        height: 120px;
        padding: 15px;
        font-size: 14px;
        font-family: inherit;
        line-height: 1.6;
        background: #252525;
        border: 1px solid #333;
        border-radius: 10px;
        color: #fff;
        outline: none;
        resize: vertical;
    }

    textarea:focus {
        border-color: #444;
    }

    textarea::placeholder {
        color: #555;
    }

    .options {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        background: #252525;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .checkbox-label input {
        width: 16px;
        height: 16px;
        accent-color: #2ecc71;
    }

    .checkbox-label span {
        font-size: 12px;
        color: #888;
    }

    .min-length {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
    }

    .min-length span {
        font-size: 12px;
        color: #888;
    }

    .min-length input {
        width: 50px;
        padding: 6px;
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        color: #fff;
        text-align: center;
        outline: none;
    }

    .summary {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-bottom: 20px;
    }

    .summary-item {
        text-align: center;
    }

    .summary-value {
        display: block;
        font-size: 2rem;
        font-weight: 300;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #2ecc71;
    }

    .summary-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #555;
    }

    .results {
        background: #252525;
        border-radius: 10px;
        max-height: 400px;
        overflow-y: auto;
    }

    .empty-state {
        padding: 30px;
        color: #555;
        font-size: 13px;
    }

    .word-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 15px;
        border-bottom: 1px solid #333;
    }

    .word-item:last-child {
        border-bottom: none;
    }

    .word-rank {
        font-size: 10px;
        color: #555;
        min-width: 24px;
        text-align: right;
    }

    .word-info {
        flex: 1;
        min-width: 0;
    }

    .word-text {
        font-size: 13px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #fff;
        margin-bottom: 4px;
        text-align: left;
    }

    .word-bar {
        height: 4px;
        background: #333;
        border-radius: 2px;
        overflow: hidden;
    }

    .word-bar-fill {
        height: 100%;
        background: #2ecc71;
        border-radius: 2px;
        transition: width 0.3s ease;
    }

    .word-count {
        font-size: 12px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: #2ecc71;
        min-width: 40px;
        text-align: right;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 12px;
        color: #555;
        text-decoration: none;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        transition: all 0.2s ease;
        z-index: 100;
    }

    .back-btn:hover {
        color: #fff;
        border-color: #333;
    }

    .rating-footer {
        max-width: 900px;
        margin: 60px auto 0;
        padding-top: 30px;
        border-top: 1px solid #1a1a1a;
        text-align: center;
    }

    .rating-section {
        margin: 0;
    }

    .rating-label {
        display: block;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #444;
        margin-bottom: 8px;
    }

    .stars {
        display: inline-flex;
        gap: 4px;
    }

    .star {
        font-size: 20px;
        color: #333;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
    }

    .star:hover {
        transform: scale(1.1);
    }

    .star.active {
        color: #f39c12;
    }

    .rating-thanks {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #2ecc71;
    }
</style>
    <footer class="rating-footer">
        <div class="rating-section">
            <span class="rating-label">Rate this tool</span>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <span class="rating-thanks" id="ratingThanks"></span>
        </div>
    </footer>

<script>
(function() {
    const pageId = window.location.pathname;
    const storageKey = 'rated_' + pageId;
    const stars = document.querySelectorAll('.star');
    const thanksEl = document.getElementById('ratingThanks');

    const existingRating = localStorage.getItem(storageKey);
    if (existingRating) {
        showRating(parseInt(existingRating));
        thanksEl.textContent = 'Thanks for rating!';
    }

    function showRating(rating) {
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < rating);
        });
    }

    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => {
            if (!localStorage.getItem(storageKey)) {
                showRating(index + 1);
            }
        });
    });

    document.getElementById('stars').addEventListener('mouseleave', () => {
        if (!localStorage.getItem(storageKey)) {
            showRating(0);
        } else {
            showRating(parseInt(localStorage.getItem(storageKey)));
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            if (localStorage.getItem(storageKey)) return;

            const rating = parseInt(star.dataset.value);
            localStorage.setItem(storageKey, rating);
            showRating(rating);
            thanksEl.textContent = 'Thanks for rating!';

            fetch('https://formspree.io/f/xjgevpap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    page: pageId,
                    rating: rating,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        });
    });
})();
</script>

</body>
</html>
